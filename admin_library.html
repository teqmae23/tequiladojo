<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>書庫編集 — テキーラ道場</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<script>
var FIREBASE_CONFIG={apiKey:"AIzaSyD6a3i-N1RyXyAfXmztPQrYtx4x62YGth0",authDomain:"tequiladojo.firebaseapp.com",projectId:"tequiladojo",storageBucket:"tequiladojo.firebasestorage.app",messagingSenderId:"56663296233",appId:"1:56663296233:web:c8cac2fcbeb4faa09e0878"};
</script>
<script src="/auth-role.js?v=20260714"></script>
<style>
:root{--ink:#18110a;--ink2:#4a3820;--ink3:#9a8470;--gold:#c8921e;--gold-l:#e8b84a;--gold-d:#7a5610;--cream:#faf7f1;--cream2:#f0ebe0;--cream3:#e4ddd0;--white:#fff;--red:#b03020;--teal:#1a6e58;--border:rgba(160,130,100,.18);--border2:rgba(160,130,100,.32);--r:8px;--rl:12px;--sans:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;--serif:'Hiragino Mincho ProN',serif;--mono:'SFMono-Regular',Consolas,monospace;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--cream);color:var(--ink);min-height:100vh}
button{cursor:pointer;font-family:var(--sans)} input,select,textarea{font-family:var(--sans)}
#login-screen{display:none;min-height:100vh;align-items:center;justify-content:center;padding:24px}
.lcard{width:100%;max-width:360px;background:var(--white);border:1px solid var(--border2);border-radius:var(--rl);padding:36px 28px}
.lcard label{display:block;font-size:10px;color:var(--ink3);margin:12px 0 4px}
.lcard input{width:100%;padding:11px 12px;border:1px solid var(--border2);border-radius:var(--r);font-size:13px;background:var(--cream)}
.lbtn{width:100%;margin-top:18px;padding:12px;background:var(--gold-d);color:var(--cream);border:none;border-radius:var(--r)}
.lerr{min-height:16px;font-size:12px;color:var(--red);margin-top:8px;text-align:center}
.hdr{background:var(--ink);padding:0 16px;height:54px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:40}
.hdr-title{font-family:var(--serif);font-size:17px;color:var(--gold-l)}
.hdr-right{margin-left:auto;display:flex;gap:8px}
.hdr-nav{padding:6px 11px;border:1px solid rgba(255,255,255,.16);border-radius:6px;color:var(--gold-l);font-size:11px;text-decoration:none;background:none}
#app{display:none}
.wrap{max-width:1000px;margin:0 auto;padding:18px 14px 80px}
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--rl);padding:14px 16px;margin-bottom:16px}
.card h2{font-family:var(--serif);font-size:16px;color:var(--gold-d);margin-bottom:10px}
.row2{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.fg{margin-bottom:10px} .fg label{display:block;font-size:11px;color:var(--ink2);font-weight:600;margin-bottom:4px}
.fi{width:100%;padding:9px 11px;border:1px solid var(--border2);border-radius:var(--r);font-size:13px;background:var(--cream)}
.btn{border:none;border-radius:var(--r);padding:9px 14px;font-size:13px;font-weight:500}
.bp{background:var(--gold-d);color:var(--cream)} .bg{background:var(--cream2);color:var(--ink2);border:1px solid var(--border2)}
.bt{background:var(--teal);color:#fff} .bd{background:#fff;color:var(--red);border:1px solid var(--cream3)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--border2);border-radius:20px;font-size:12px;background:var(--white);cursor:pointer;margin:0 6px 6px 0}
.chip.on{background:var(--gold-d);color:#fff;border-color:var(--gold-d)}
.chip .fr{color:var(--gold-d);font-size:10px}.chip.on .fr{color:#fff}
.rowcard{border:1px solid var(--border2);border-radius:var(--r);padding:10px;margin-bottom:10px;background:var(--cream)}
.rowcard .rhead{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:11px;color:var(--ink3)}
.rowcard .rhead .sp{flex:1}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid4 textarea{width:100%;min-height:90px;padding:8px;border:1px solid var(--border2);border-radius:6px;font-size:12px;background:var(--white);resize:vertical;line-height:1.6}
.grid4 .lbl{font-size:10px;color:var(--ink3);margin-bottom:2px}
.tblbox img{max-width:100%;max-height:220px;border:1px solid var(--border2);border-radius:6px;display:block;margin:6px 0}
.mini{font-size:11px;padding:5px 9px}
.muted{font-size:11px;color:var(--ink3)}
#toasts{position:fixed;bottom:18px;right:18px;z-index:9999;display:flex;flex-direction:column;gap:6px}
.toast{background:var(--ink);color:#fff;font-size:12px;padding:9px 14px;border-radius:8px}.toast.err{background:var(--red)}
@media(max-width:640px){.grid4{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="login-screen"><div class="lcard"><div style="text-align:center;font-size:34px">📚</div><div style="text-align:center;font-family:var(--serif);font-size:20px;color:var(--gold-d);margin-bottom:16px">書庫編集</div>
<label>メール</label><input type="email" id="lemail"><label>パスワード</label><input type="password" id="lpass"><div class="lerr" id="lerr"></div><button class="lbtn" id="lbtn">ログイン</button></div></div>

<div id="app">
  <div class="hdr"><div class="hdr-title">📚 書庫編集</div><div class="hdr-right"><a class="hdr-nav" href="/library.html" target="_blank">閲覧を開く</a><a class="hdr-nav" href="/admin.html">管理TOP</a><button class="hdr-nav" id="btn-logout">ログアウト</button></div></div>
  <div class="wrap">
    <!-- 文書 -->
    <div class="card">
      <h2>文書</h2>
      <div id="doc-chips"></div>
      <div class="row2" style="margin-top:8px">
        <div class="fg" style="flex:1;min-width:160px;margin:0"><label>新規 文書ID（半角英数）</label><input class="fi" id="new-doc-id" placeholder="nom006"></div>
        <div class="fg" style="flex:2;min-width:180px;margin:0"><label>タイトル</label><input class="fi" id="new-doc-title" placeholder="NOM-006-SCFI-2012 テキーラ規格"></div>
        <button class="btn bg" id="btn-new-doc">＋ 文書を作成</button>
      </div>
    </div>

    <!-- 文書メタ -->
    <div class="card" id="doc-meta" style="display:none">
      <h2>文書設定 <span class="muted" id="meta-id"></span></h2>
      <div class="row2">
        <div class="fg" style="flex:2;min-width:200px;margin:0"><label>タイトル</label><input class="fi" id="m-title"></div>
        <div class="fg" style="flex:2;min-width:200px;margin:0"><label>サブタイトル</label><input class="fi" id="m-sub"></div>
        <div class="fg" style="width:90px;margin:0"><label>並び順</label><input class="fi" id="m-order" type="number" value="1"></div>
        <label style="display:flex;align-items:center;gap:6px;font-size:13px"><input type="checkbox" id="m-pub"> 公開</label>
        <button class="btn bp" id="btn-save-meta">文書設定を保存</button>
      </div>
    </div>

    <!-- 章一覧 -->
    <div class="card" id="ch-list-card" style="display:none">
      <h2>章</h2>
      <div id="ch-chips"></div>
      <button class="btn bg mini" id="btn-new-ch" style="margin-top:6px">＋ 章を追加</button>
      <span class="muted" style="margin-left:8px">「主文」にすると目次でなく冒頭に表示されます。</span>
    </div>

    <!-- 章編集 -->
    <div class="card" id="ch-edit" style="display:none">
      <h2 id="ch-edit-title">章編集</h2>
      <div class="row2">
        <div class="fg" style="width:90px;margin:0"><label>章番号</label><input class="fi" id="c-num" placeholder="6"></div>
        <div class="fg" style="width:90px;margin:0"><label>並び順</label><input class="fi" id="c-order" type="number" value="0"></div>
        <label style="display:flex;align-items:center;gap:6px;font-size:13px"><input type="checkbox" id="c-front"> 主文（冒頭表示）</label>
      </div>
      <div class="grid4" style="margin:8px 0">
        <div><div class="lbl">章タイトル ES</div><textarea id="c-tes" style="min-height:44px"></textarea></div>
        <div><div class="lbl">章タイトル EN</div><textarea id="c-ten" style="min-height:44px"></textarea></div>
        <div><div class="lbl">章タイトル 日本語</div><textarea id="c-tja" style="min-height:44px"></textarea></div>
        <div></div>
      </div>
      <div style="border-top:1px solid var(--cream3);margin:8px 0;padding-top:8px">
        <b style="font-size:13px">本文（行）</b>
        <button class="btn bg mini" id="btn-add-text" style="margin-left:8px">＋ 対訳行</button>
        <button class="btn bg mini" id="btn-add-table">＋ 表（画像）</button>
      </div>
      <div id="rows-container"></div>
      <div style="display:flex;gap:10px;margin-top:12px">
        <button class="btn bp" id="btn-save-ch">この章を保存</button>
        <button class="btn bd" id="btn-del-ch">章を削除</button>
      </div>
    </div>
  </div>
</div>
<div id="toasts"></div>

<script>
firebase.initializeApp(FIREBASE_CONFIG);
var auth=firebase.auth(), db=firebase.firestore(), storage=firebase.storage();
function g(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(m,t){var e=document.createElement('div');e.className='toast'+(t?' '+t:'');e.textContent=m;g('toasts').appendChild(e);setTimeout(function(){e.remove();},2800);}

AuthRole.requireStaff(auth,function(){ g('app').style.display='block'; loadDocs(); },function(){ g('login-screen').style.display='flex'; });
g('lbtn').addEventListener('click',function(){ auth.signInWithEmailAndPassword((g('lemail').value||'').trim(),g('lpass').value).catch(function(e){ g('lerr').textContent=e.message; }); });
g('lpass').addEventListener('keydown',function(e){ if(e.key==='Enter') g('lbtn').click(); });
g('btn-logout').addEventListener('click',function(){ auth.signOut().then(function(){location.reload();}); });

var docs=[], curDoc=null, chapters=[], curCh=null, curRows=[];

function loadDocs(){
  db.collection('libraryDocs').get().then(function(snap){
    docs=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});
    docs.sort(function(a,b){return (a.order||0)-(b.order||0);});
    g('doc-chips').innerHTML=docs.length?docs.map(function(d){
      return '<span class="chip'+(curDoc===d.id?' on':'')+'" data-doc="'+esc(d.id)+'">'+esc(d.title||d.id)+(d.published?'':' <span class="fr">下書き</span>')+'</span>';
    }).join(''):'<span class="muted">文書がありません。下で作成してください。</span>';
    g('doc-chips').querySelectorAll('[data-doc]').forEach(function(el){ el.addEventListener('click',function(){ selectDoc(el.dataset.doc); }); });
  });
}
g('btn-new-doc').addEventListener('click',function(){
  var id=(g('new-doc-id').value||'').trim().replace(/[^A-Za-z0-9_-]/g,'');
  var title=(g('new-doc-title').value||'').trim();
  if(!id){ toast('文書IDを入力','err'); return; }
  db.collection('libraryDocs').doc(id).set({title:title||id,subtitle:'',order:(docs.length+1),published:false,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true})
    .then(function(){ g('new-doc-id').value='';g('new-doc-title').value=''; toast('作成しました'); loadDocs(); selectDoc(id); });
});
function selectDoc(id){
  curDoc=id; curCh=null; curRows=[];
  var d=docs.find(function(x){return x.id===id;})||{};
  g('doc-meta').style.display='block'; g('ch-list-card').style.display='block'; g('ch-edit').style.display='none';
  g('meta-id').textContent='（'+id+'）';
  g('m-title').value=d.title||''; g('m-sub').value=d.subtitle||''; g('m-order').value=d.order||1; g('m-pub').checked=!!d.published;
  loadDocs(); loadChapters();
}
g('btn-save-meta').addEventListener('click',function(){
  if(!curDoc) return;
  db.collection('libraryDocs').doc(curDoc).set({title:(g('m-title').value||'').trim(),subtitle:(g('m-sub').value||'').trim(),order:parseInt(g('m-order').value)||1,published:g('m-pub').checked,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true})
    .then(function(){ toast('保存しました'); loadDocs(); });
});

function loadChapters(){
  db.collection('libraryDocs').doc(curDoc).collection('chapters').get().then(function(snap){
    chapters=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});
    chapters.sort(function(a,b){return (a.order||0)-(b.order||0);});
    g('ch-chips').innerHTML=chapters.length?chapters.map(function(c){
      return '<span class="chip'+(curCh===c.id?' on':'')+'" data-ch="'+esc(c.id)+'">'+(c.isFront?'📄 ':'')+esc((c.num||'')+' '+(c.titleJa||c.titleEs||'(無題)'))+'</span>';
    }).join(''):'<span class="muted">章がありません。</span>';
    g('ch-chips').querySelectorAll('[data-ch]').forEach(function(el){ el.addEventListener('click',function(){ selectCh(el.dataset.ch); }); });
  });
}
g('btn-new-ch').addEventListener('click',function(){
  if(!curDoc) return;
  var ref=db.collection('libraryDocs').doc(curDoc).collection('chapters').doc();
  ref.set({num:'',titleEs:'',titleEn:'',titleJa:'新しい章',isFront:false,order:(chapters.length+1)*10,rows:[],updatedAt:firebase.firestore.FieldValue.serverTimestamp()})
    .then(function(){ toast('章を追加'); loadChapters(); selectCh(ref.id); });
});
function selectCh(chId){
  curCh=chId;
  var c=chapters.find(function(x){return x.id===chId;})||{};
  g('ch-edit').style.display='block';
  g('ch-edit-title').textContent='章編集：'+((c.num||'')+' '+(c.titleJa||''));
  g('c-num').value=c.num||''; g('c-order').value=c.order||0; g('c-front').checked=!!c.isFront;
  g('c-tes').value=c.titleEs||''; g('c-ten').value=c.titleEn||''; g('c-tja').value=c.titleJa||'';
  curRows=(c.rows||[]).map(function(r){return Object.assign({},r);});
  renderRows();
  loadChapters();
  g('ch-edit').scrollIntoView({behavior:'smooth'});
}

// ── 行エディタ ──
function renderRows(){
  var c=g('rows-container');
  c.innerHTML=curRows.map(function(r,i){
    var head='<div class="rhead"><b>#'+(i+1)+'</b> '+(r.t==='table'?'表（画像）':'対訳行')
      +'<span class="sp"></span>'
      +'<button class="btn bg mini" data-up="'+i+'">↑</button><button class="btn bg mini" data-down="'+i+'">↓</button>'
      +'<button class="btn bd mini" data-del="'+i+'">削除</button></div>';
    if(r.t==='table'){
      return '<div class="rowcard" data-i="'+i+'" data-type="table">'+head
        +'<div class="tblbox">'+(r.img?'<img src="'+esc(r.img)+'">':'<div class="muted">画像未設定</div>')+'</div>'
        +'<input type="hidden" class="r-img" value="'+esc(r.img||'')+'">'
        +'<div style="display:flex;gap:8px;align-items:center;margin:6px 0"><input type="file" accept="image/*" class="r-file" style="font-size:12px"><span class="muted r-upst"></span></div>'
        +'<div class="grid4"><div><div class="lbl">表のキャプション</div><textarea class="r-caption" style="min-height:40px">'+esc(r.caption||'')+'</textarea></div>'
        +'<div><div class="lbl">解説</div><textarea class="r-note">'+esc(r.note||'')+'</textarea></div></div></div>';
    }
    return '<div class="rowcard" data-i="'+i+'" data-type="text">'+head
      +'<div class="grid4">'
      +'<div><div class="lbl">ES 原文</div><textarea class="r-es">'+esc(r.es||'')+'</textarea></div>'
      +'<div><div class="lbl">English</div><textarea class="r-en">'+esc(r.en||'')+'</textarea></div>'
      +'<div><div class="lbl">日本語</div><textarea class="r-ja">'+esc(r.ja||'')+'</textarea></div>'
      +'<div><div class="lbl">解説</div><textarea class="r-note">'+esc(r.note||'')+'</textarea></div>'
      +'</div></div>';
  }).join('');
  c.querySelectorAll('[data-del]').forEach(function(b){ b.addEventListener('click',function(){ syncRows(); curRows.splice(+b.dataset.del,1); renderRows(); }); });
  c.querySelectorAll('[data-up]').forEach(function(b){ b.addEventListener('click',function(){ syncRows(); var i=+b.dataset.up; if(i>0){ var t=curRows[i-1];curRows[i-1]=curRows[i];curRows[i]=t; } renderRows(); }); });
  c.querySelectorAll('[data-down]').forEach(function(b){ b.addEventListener('click',function(){ syncRows(); var i=+b.dataset.down; if(i<curRows.length-1){ var t=curRows[i+1];curRows[i+1]=curRows[i];curRows[i]=t; } renderRows(); }); });
  c.querySelectorAll('.r-file').forEach(function(f){ f.addEventListener('change',function(){ uploadImg(f); }); });
}
function syncRows(){
  var cards=g('rows-container').querySelectorAll('.rowcard');
  var out=[];
  cards.forEach(function(card){
    if(card.dataset.type==='table'){
      out.push({t:'table',img:card.querySelector('.r-img').value||'',caption:card.querySelector('.r-caption').value||'',note:card.querySelector('.r-note').value||''});
    }else{
      out.push({t:'text',es:card.querySelector('.r-es').value||'',en:card.querySelector('.r-en').value||'',ja:card.querySelector('.r-ja').value||'',note:card.querySelector('.r-note').value||''});
    }
  });
  curRows=out;
}
function uploadImg(fileInput){
  var file=fileInput.files&&fileInput.files[0]; if(!file) return;
  var card=fileInput.closest('.rowcard');
  var st=card.querySelector('.r-upst'); st.textContent='アップロード中…';
  var path='library/'+curDoc+'/'+curCh+'/'+Date.now()+'_'+file.name.replace(/[^A-Za-z0-9._-]/g,'');
  storage.ref(path).put(file).then(function(snap){ return snap.ref.getDownloadURL(); }).then(function(url){
    card.querySelector('.r-img').value=url;
    var box=card.querySelector('.tblbox'); box.innerHTML='<img src="'+esc(url)+'">';
    st.textContent='✓';
  }).catch(function(e){ st.textContent='失敗: '+e.message; });
}
g('btn-add-text').addEventListener('click',function(){ syncRows(); curRows.push({t:'text',es:'',en:'',ja:'',note:''}); renderRows(); });
g('btn-add-table').addEventListener('click',function(){ syncRows(); curRows.push({t:'table',img:'',caption:'',note:''}); renderRows(); });

g('btn-save-ch').addEventListener('click',function(){
  if(!curDoc||!curCh) return; syncRows();
  db.collection('libraryDocs').doc(curDoc).collection('chapters').doc(curCh).set({
    num:(g('c-num').value||'').trim(),order:parseInt(g('c-order').value)||0,isFront:g('c-front').checked,
    titleEs:g('c-tes').value||'',titleEn:g('c-ten').value||'',titleJa:g('c-tja').value||'',rows:curRows,
    updatedAt:firebase.firestore.FieldValue.serverTimestamp()
  },{merge:true}).then(function(){ toast('章を保存しました'); loadChapters(); }).catch(function(e){ toast('保存失敗: '+e.message,'err'); });
});
g('btn-del-ch').addEventListener('click',function(){
  if(!curDoc||!curCh) return;
  if(!confirm('この章を削除しますか？')) return;
  db.collection('libraryDocs').doc(curDoc).collection('chapters').doc(curCh).delete().then(function(){ toast('削除しました'); curCh=null; g('ch-edit').style.display='none'; loadChapters(); });
});
</script>
</body>
</html>
