<style>
:root{
  --bg:#f5f2eb;--panel:#ffffff;--panel2:#faf8f3;--line:#e2dbcc;--line2:#cbc0aa;

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100vh;font-size:15px;line-height:1.6}
button{cursor:pointer;font-family:var(--sans)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--rl);padding:12px 14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.lb{font-size:13px;color:var(--ink3);font-weight:600;white-space:nowrap}

input[type=search]{min-width:220px}

.btn:hover{border-color:var(--gold-d)}
.chk{display:inline-flex;align-items:center;gap:4px;font-size:14px;padding:3px 8px;border:1px solid var(--line2);border-radius:14px;background:var(--panel2);cursor:pointer;user-select:none}
.chk input{margin:0}
.sortkey{display:inline-flex;gap:4px;align-items:center}
.sortkey .n{font-size:12px;color:var(--ink3)}
.count{margin-left:auto;font-size:13px;color:var(--ink3)}
.tblwrap{overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--rl)}
table{border-collapse:collapse;width:100%;min-width:980px}
th,td{border:1px solid var(--line);padding:5px 8px;font-size:14px;vertical-align:middle}
th{background:#f3eee3;color:var(--ink2);font-size:13px;font-weight:700;white-space:nowrap;position:sticky;top:0;z-index:2}
th select{font-size:13px;padding:3px 6px;background:#fff;font-weight:700}
td.m{text-align:center;background:#fffdf8}
td.nom{font-family:var(--mono);font-weight:700}
td.bid{font-family:var(--mono);white-space:nowrap}
td.brand,td.master{font-weight:600}
td select,td input{width:100%;min-width:90px;font-size:14px;padding:4px 6px;background:#fff}
td input[type=number]{text-align:right}
.st-serving{background:#fff1e0!important;color:#9a4f00;font-weight:700}
.st-keep{background:#fde7f0!important;color:#a3305f;font-weight:700}
.st-away{background:#e8eefb!important;color:#2a4f8f;font-weight:700}

tr.saving td{opacity:.6}
.lnk{cursor:pointer}

#embed-overlay{display:none;position:fixed;inset:0;z-index:6000;background:rgba(24,17,10,.55)}

#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#fff;border:1px solid var(--line2);box-shadow:0 4px 16px rgba(0,0,0,.15);color:var(--ink);padding:10px 18px;border-radius:24px;font-size:14px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}

<body>
<div id="gate"><div><div style="font-size:40px">🔒</div><p style="margin:14px 0;color:var(--ink2)">オーナー権限が必要です。</p><a class="hnav" href="/tdhome.html">管理トップへ</a></div></div>

<div id="app">
  <div class="hdr">
    <span class="ht">🍾 ボトル管理</span>
    <div class="hr"><a class="hnav" href="/admin_tequila.html?tab=bdata">ボトルデータ（詳細編集）</a><a class="hnav" href="/tdhome.html">🏠 管理トップ</a></div>
  </div>
  <div class="wrap">
    <div class="card">
      <div class="row">
        <span class="lb">状態</span>
        <span id="f-status"></span>
        <input type="search" id="f-q" placeholder="NOM・ブランド・ボトル名・ボトルIDで検索">
        <span class="count" id="count"></span>

      <div class="row">
        <span class="lb">並び順</span>
        <span id="sortkeys"></span>
        <button class="btn" id="btn-reload">↻ 再読込</button>
      </div>
      <div class="hint">状態と選択項目の値はその場で変更でき、変更すると即保存されます。選択項目（3列）は見出しのプルダウンで表示する項目を選べます。同じ NOM・ブランド・ボトルマスタが続く行は、それぞれの列をまとめて（セル結合して）表示します。NOM・ブランド・ボトルマスタ・ボトルIDをクリックすると、それぞれのマスタ／ボトルデータの編集画面が開きます。</div>

<script>
if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
var auth=firebase.auth(), db=firebase.firestore();
function g(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
var _tt=null; function toast(m,t){var e=g('toast');e.textContent=m;e.className='show'+(t==='err'?' err':'');clearTimeout(_tt);_tt=setTimeout(function(){e.className='';},2600);}
function jlog(op,col,id,before,after){ try{ if(typeof window.writeJournal==='function') window.writeJournal(op,col,id,before,after); }catch(e){} }
function lsGet(k,d){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

// ── 状態 ──
// bottleData.status に保存。keep/away はこの画面で追加した値。
// キープ購入で作られた個体（lotNo='KEEP'、status='ended'）や keepBottles の元個体は、状態未変更ならキープとして表示。
var STATUS=[
  {v:'serving',l:'提供中'},
  {v:'keep',   l:'キープ'},
  {v:'away',   l:'退避'},
  {v:'stock',  l:'在庫'},
  {v:'ended',  l:'提供終了'}
];
var ST_ORDER={}; STATUS.forEach(function(s,i){ ST_ORDER[s.v]=i; });
var ST_LABEL={}; STATUS.forEach(function(s){ ST_LABEL[s.v]=s.l; });
var keepSourceSet={};
function stateOf(r){
  var st=String(r.status||'');
  if(r.statusByBottleMgmt && ST_ORDER[st]!=null) return st; // この画面で明示的に設定した値を優先
  if(keepSourceSet[String(r.id)] || String(r.lotNo||'').toUpperCase()==='KEEP') return 'keep';
  if(ST_ORDER[st]!=null) return st;
  return 'serving'; // 未設定は提供中（admin_tequila と同じ既定）
}

// ── 選択項目（3列） ──
var FIELDS=[
  {k:'remaining',   l:'残量(ml)',     t:'number'},
  {k:'volume',      l:'容量(ml)',     t:'number'},
  {k:'price',       l:'10ml単価(円)', t:'number'},
  {k:'location',    l:'保管場所',     t:'text'},
  {k:'lotNo',       l:'ロット番号',   t:'text'},
  {k:'visibility',  l:'公開区分',     t:'select', opts:[{v:'0',l:'公開'},{v:'1',l:'非公開'}]},
  {k:'purchaseDate',l:'購入日',       t:'date'},
  {k:'serveStart',  l:'提供開始日',   t:'date'},
  {k:'serveEnd',    l:'提供終了日',   t:'date'},
  {k:'cost',        l:'仕入れ価格(円)',t:'number'},
  {k:'abv',         l:'度数(%)',      t:'number'},
  {k:'suffix',      l:'追記',         t:'text'},
  {k:'note',        l:'メモ',         t:'text'}
];
var FIELD_BY={}; FIELDS.forEach(function(f){ FIELD_BY[f.k]=f; });
var selCols=lsGet('bm_cols',['remaining','location','price']).filter(function(k){return FIELD_BY[k];});
while(selCols.length<3) selCols.push(FIELDS[selCols.length].k);

// ── 並び順（最大3キー） ──
var SORT_KEYS=[
  {v:'',     l:'（なし）'},
  {v:'nom',  l:'NOM番号'},
  {v:'name', l:'ボトル名'},
  {v:'status',l:'状態'},
  {v:'sel1', l:'選択項目1'},
  {v:'sel2', l:'選択項目2'},
  {v:'sel3', l:'選択項目3'}
];
var sortSpec=lsGet('bm_sort',[{k:'nom',d:'asc'},{k:'name',d:'asc'},{k:'status',d:'asc'}]);
var statusFilter=lsGet('bm_status',{serving:true,keep:true,away:true,stock:true,ended:false});

var rows=[], brandMap={}, masterMap={};

AuthRole.requireOwner(auth,function(){ g('app').style.display='block'; renderControls(); load(); },function(){ g('gate').style.display='flex'; });

function load(){
  g('tbl').innerHTML='<div class="empty">読み込み中…</div>';
  return Promise.all([
    db.collection('bottleData').get(),
    db.collection('bottles').get(),
    db.collection('brands').get(),
    db.collection('keepBottles').get().catch(function(){ return {docs:[]}; })
  ]).then(function(res){
    masterMap={}; res[1].docs.forEach(function(d){ masterMap[d.id]=d.data()||{}; });
    brandMap={}; res[2].docs.forEach(function(d){ brandMap[d.id]=d.data()||{}; });
    keepSourceSet={}; res[3].docs.forEach(function(d){ var k=d.data()||{}; if(k.sourceBottleDataId) keepSourceSet[String(k.sourceBottleDataId)]=true; });
    rows=res[0].docs.map(function(d){ return Object.assign({id:d.id},d.data()); });
    render();
  }).catch(function(e){ g('tbl').innerHTML='<div class="empty">読み込み失敗: '+esc(e.message)+'</div>'; });
}

// ── 表示用の値 ──
function masterIdOf(r){ return String(r.bottleId||'').trim(); }
function nomOf(r){ if(r.nom!=null&&r.nom!=='') return String(r.nom); var s=masterIdOf(r); return s.length>=4?s.slice(0,4):''; }
function brandIdOf(r){ if(r.brandId) return String(r.brandId); var s=masterIdOf(r); return s.length>=7?s.slice(0,7):''; }
function brandNameOf(r){ var b=brandMap[brandIdOf(r)]; return b?(b.brandEs||b.brandJa||b.name||''):''; }
function masterNameOf(r){
  var m=masterMap[masterIdOf(r)];
  return (m&&(m.bottleEs||m.bottleEn||m.bottleJa||m.name))||r.bottleEsBase||r.bottleEs||r.bottleJa||'(名称未設定)';
}
function bidOf(r){ return String(r.bottleDataId||r.id); }
function fieldVal(r,k){ var v=r[k]; return v==null?'':v; }

function cmpVal(a,b){
  var an=(a===''||a==null), bn=(b===''||b==null);
  if(an&&bn) return 0; if(an) return 1; if(bn) return -1; // 空欄は常に後ろ
  var na=parseFloat(a), nb=parseFloat(b);
  if(!isNaN(na)&&!isNaN(nb)&&String(na)===String(a).trim()&&String(nb)===String(b).trim()) return na-nb;
  return String(a).localeCompare(String(b),'ja');
}
function keyVal(r,k){
  if(k==='nom') return nomOf(r);
  if(k==='name') return masterNameOf(r);
  if(k==='status') return ST_ORDER[stateOf(r)];
  if(k==='sel1') return fieldVal(r,selCols[0]);
  if(k==='sel2') return fieldVal(r,selCols[1]);
  if(k==='sel3') return fieldVal(r,selCols[2]);
  return '';
}
function sortRows(list){
  var spec=sortSpec.filter(function(s){return s&&s.k;});
  return list.slice().sort(function(a,b){
    for(var i=0;i<spec.length;i++){
      var c=cmpVal(keyVal(a,spec[i].k),keyVal(b,spec[i].k));
      if(c) return spec[i].d==='desc'?-c:c;
    }
    // 最後は同じボトルマスタをまとめ、ボトルID順
    return cmpVal(masterIdOf(a),masterIdOf(b)) || cmpVal(bidOf(a),bidOf(b));
  });
}

// ── 操作パネル ──
function renderControls(){
  g('f-status').innerHTML=STATUS.map(function(s){
    return '<label class="chk"><input type="checkbox" data-st="'+s.v+'"'+(statusFilter[s.v]?' checked':'')+'>'+s.l+'</label>';
  }).join(' ');
  Array.prototype.forEach.call(g('f-status').querySelectorAll('input'),function(c){
    c.addEventListener('change',function(){ statusFilter[c.dataset.st]=c.checked; lsSet('bm_status',statusFilter); render(); });
  });
  var html='';
  for(var i=0;i<3;i++){
    var s=sortSpec[i]||{k:'',d:'asc'};
    html+='<span class="sortkey"><span class="n">'+(i+1)+'.</span><select data-sk="'+i+'">'+SORT_KEYS.map(function(o){return '<option value="'+o.v+'"'+(o.v===s.k?' selected':'')+'>'+o.l+'</option>';}).join('')+'</select>'
      +'<select data-sd="'+i+'"><option value="asc"'+(s.d!=='desc'?' selected':'')+'>昇順</option><option value="desc"'+(s.d==='desc'?' selected':'')+'>降順</option></select></span> ';
  }
  g('sortkeys').innerHTML=html;
  Array.prototype.forEach.call(g('sortkeys').querySelectorAll('select'),function(el){
    el.addEventListener('change',function(){
      var next=[];
      for(var i=0;i<3;i++){ var k=g('sortkeys').querySelector('[data-sk="'+i+'"]').value, d=g('sortkeys').querySelector('[data-sd="'+i+'"]').value; next.push({k:k,d:d}); }
      sortSpec=next; lsSet('bm_sort',sortSpec); render();
    });
  });
  g('f-q').addEventListener('input',render);
  g('btn-reload').addEventListener('click',load);
}

// ── 表 ──
function cellEditor(r,k){
  var f=FIELD_BY[k], v=fieldVal(r,k);
  if(f.t==='select') return '<select data-edit="'+k+'" data-id="'+esc(r.id)+'"><option value=""></option>'+f.opts.map(function(o){return '<option value="'+o.v+'"'+(String(v)===o.v?' selected':'')+'>'+o.l+'</option>';}).join('')+'</select>';
  var type=f.t==='number'?'number':(f.t==='date'?'date':'text');
  return '<input type="'+type+'" data-edit="'+k+'" data-id="'+esc(r.id)+'" value="'+esc(v)+'">';
}
function render(){
  var q=(g('f-q').value||'').trim().toLowerCase();
  var list=rows.filter(function(r){
    if(!statusFilter[stateOf(r)]) return false;
    if(q){ var hay=(nomOf(r)+' '+brandNameOf(r)+' '+masterNameOf(r)+' '+bidOf(r)+' '+(r.lotNo||'')).toLowerCase(); if(hay.indexOf(q)<0) return false; }
    return true;
  });
  list=sortRows(list);
  g('count').textContent=list.length+' 本 / 全'+rows.length+'本';
  if(!list.length){ g('tbl').innerHTML='<div class="empty">該当するボトルがありません</div>'; return; }
  // セル結合（階層）: 連続する行で NOM が同じなら NOM を、NOM＋ブランドが同じならブランドを、
  // NOM＋ブランド＋ボトルマスタが同じならボトルマスタを、それぞれ縦に結合する
  function spans(keyFn){
    var sp=new Array(list.length).fill(0);
    for(var i=0;i<list.length;){
      var k=keyFn(list[i]), j=i+1;
      while(j<list.length && keyFn(list[j])===k) j++;
      sp[i]=j-i; i=j;
    }
    return sp;
  }
  var spNom=spans(function(r){ return nomOf(r); });
  var spBrand=spans(function(r){ return nomOf(r)+'|'+brandIdOf(r); });
  var spMaster=spans(function(r){ return nomOf(r)+'|'+brandIdOf(r)+'|'+masterIdOf(r); });
  function rsAttr(n){ return n>1?' rowspan="'+n+'"':''; }
  var head='<tr><th>NOM</th><th>ブランド</th><th>ボトルマスタ</th><th>ボトルID</th><th>状態</th>'
    +selCols.map(function(k,ci){ return '<th><select data-col="'+ci+'">'+FIELDS.map(function(f){return '<option value="'+f.k+'"'+(f.k===k?' selected':'')+'>'+f.l+'</option>';}).join('')+'</select></th>'; }).join('')+'</tr>';
  var body=list.map(function(r,i){
    var st=stateOf(r), h='<tr data-row="'+esc(r.id)+'">';
    var nom=nomOf(r), brid=brandIdOf(r), mid=masterIdOf(r);
    if(spNom[i]) h+='<td class="m nom'+(nom?' lnk':'')+'"'+rsAttr(spNom[i])+(nom?' data-open="'+esc('admin_distillery.html?nom='+encodeURIComponent(nom))+'" title="蒸留所マスタを編集"':'')+'>'+esc(nom)+'</td>';
    if(spBrand[i]) h+='<td class="m brand'+(brid?' lnk':'')+'"'+rsAttr(spBrand[i])+(brid?' data-open="'+esc('admin_tequila.html?tab=brands&edit='+encodeURIComponent(brid))+'" title="ブランドマスタを編集"':'')+'>'+esc(brandNameOf(r))+'</td>';
    if(spMaster[i]) h+='<td class="m master'+(mid?' lnk':'')+'"'+rsAttr(spMaster[i])+(mid?' data-open="'+esc('admin_tequila.html?tab=bottles&edit='+encodeURIComponent(mid))+'" title="ボトルマスタを編集"':'')+'>'+esc(masterNameOf(r))+'</td>';
    h+='<td class="bid lnk" data-open="'+esc('admin_tequila.html?tab=bdata&edit='+encodeURIComponent(r.id))+'" title="ボトルデータを編集">'+esc(bidOf(r))+'</td>';
    h+='<td class="st-'+st+'"><select class="st-'+st+'" data-status data-id="'+esc(r.id)+'">'+STATUS.map(function(s){return '<option value="'+s.v+'"'+(s.v===st?' selected':'')+'>'+s.l+'</option>';}).join('')+'</select></td>';
    h+=selCols.map(function(k){ return '<td>'+cellEditor(r,k)+'</td>'; }).join('');
    return h+'</tr>';
  }).join('');
  g('tbl').innerHTML='<table><thead>'+head+'</thead><tbody>'+body+'</tbody></table>';
  Array.prototype.forEach.call(g('tbl').querySelectorAll('th select[data-col]'),function(el){
    el.addEventListener('change',function(){ selCols[+el.dataset.col]=el.value; lsSet('bm_cols',selCols); render(); });
  });
  Array.prototype.forEach.call(g('tbl').querySelectorAll('select[data-status]'),function(el){
    el.addEventListener('change',function(){ saveStatus(el.dataset.id, el.value); });
  });
  Array.prototype.forEach.call(g('tbl').querySelectorAll('[data-edit]'),function(el){
    el.addEventListener('change',function(){ saveField(el.dataset.id, el.dataset.edit, el.value); });
  });
}

// ── マスタ編集のポップアップ（admin_distillery / admin_tequila の編集モーダルを ?embed=1 の iframe で表示） ──
var _scrollY=0;
function openEmbed(url){
  _scrollY=window.scrollY;
  g('embed-frame').src=url+(url.indexOf('?')>=0?'&':'?')+'embed=1';
  g('embed-overlay').style.display='block';
  document.body.style.overflow='hidden';
}
function closeEmbed(){
  g('embed-overlay').style.display='none';
  g('embed-frame').src='about:blank';
  document.body.style.overflow='';
}
g('tbl').addEventListener('click',function(e){
  var c=e.target.closest&&e.target.closest('[data-open]'); if(!c) return;
  openEmbed(c.getAttribute('data-open'));
});
window.addEventListener('message',function(e){
  var d=e.data||{};
  if(d.type!=='tequila-embed-close') return;
  closeEmbed();
  if(d.saved){ var y=_scrollY; var p=load(); if(p&&p.then) p.then(function(){ window.scrollTo(0,y); }); }
});
document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&g('embed-overlay').style.display==='block') closeEmbed(); });

// ── 保存 ──
function rowById(id){ return rows.filter(function(r){return r.id===id;})[0]; }
function markSaving(id,on){ var tr=g('tbl').querySelector('tr[data-row="'+id.replace(/"/g,'')+'"]'); if(tr) tr.classList.toggle('saving',!!on); }
function saveStatus(id, st){
  var r=rowById(id); if(!r) return;
  // メニュー（visibility）と整合: 提供中なら公開、それ以外は非公開（admin_tequila のボトルデータ保存と同じ考え方）
  var upd={status:st, statusByBottleMgmt:true, visibility:(st==='serving'?'0':'1'), updatedAt:new Date().toISOString()};
  var before={status:r.status==null?null:r.status, visibility:r.visibility==null?null:r.visibility};
  markSaving(id,true);
  db.collection('bottleData').doc(id).update(upd).then(function(){
    Object.assign(r,upd); jlog('update','bottleData',id,before,upd);
    toast(bidOf(r)+' を「'+ST_LABEL[st]+'」にしました'); render();
  }).catch(function(e){ markSaving(id,false); toast('保存失敗: '+e.message,'err'); render(); });
}
function saveField(id, k, raw){
  var r=rowById(id), f=FIELD_BY[k]; if(!r||!f) return;
  var v=raw;
  if(f.t==='number'){ v=(raw===''?null:parseFloat(raw)); if(v!=null&&isNaN(v)){ toast('数値を入力してください','err'); render(); return; } }
  else { v=String(raw).trim(); if(v==='') v=null; }
  var upd={updatedAt:new Date().toISOString()}; upd[k]=v;
  var before={}; before[k]=r[k]==null?null:r[k];
  markSaving(id,true);
  db.collection('bottleData').doc(id).update(upd).then(function(){
    Object.assign(r,upd); jlog('update','bottleData',id,before,upd);
    markSaving(id,false); toast(bidOf(r)+'：'+f.l+'を保存しました');
  }).catch(function(e){ markSaving(id,false); toast('保存失敗: '+e.message,'err'); render(); });
}
</script>
