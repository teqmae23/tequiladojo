<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会員アクセスログ - テキーラ道場</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
var FIREBASE_CONFIG={
  apiKey:"AIzaSyD6a3i-N1RyXyAfXmztPQrYtx4x62YGth0",
  authDomain:"tequiladojo.firebaseapp.com",
  projectId:"tequiladojo",
  storageBucket:"tequiladojo.firebasestorage.app",
  messagingSenderId:"56663296233",
  appId:"1:56663296233:web:c8cac2fcbeb4faa09e0878",
  measurementId:"G-KMS18946JQ"
};
</script>
<script src="/auth-role.js?v=20260829"></script>
<style>
:root{
  --ink:#18110a;--ink2:#3a2c14;--ink3:#6b5a44;
  --gold:#c8921e;--gold-l:#e8b84a;--gold-d:#7a5610;
  --cream:#faf7f1;--cream2:#f0ebe0;--cream3:#e4ddd0;--white:#fff;
  --border:rgba(160,130,100,.18);--border2:rgba(160,130,100,.32);
  --shadow:0 1px 12px rgba(24,17,10,.07);--shadow-lg:0 6px 36px rgba(24,17,10,.13);
  --r:8px;--rl:14px;
  --serif:'Hiragino Mincho ProN','Yu Mincho',serif;
  --sans:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  --mono:'SFMono-Regular',Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--cream);color:var(--ink);min-height:100vh}
button{cursor:pointer;font-family:var(--sans)}
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
#app{display:none}
.lcard{width:100%;max-width:360px;background:var(--white);border:1px solid var(--border2);border-radius:var(--rl);padding:40px 30px;box-shadow:var(--shadow-lg)}
.llogo{text-align:center;font-size:40px;margin-bottom:6px}
.lbrand{font-family:var(--serif);font-size:22px;color:var(--gold-d);letter-spacing:.1em;text-align:center}
.lsub{text-align:center;font-size:10px;letter-spacing:.18em;color:var(--ink3);margin-bottom:24px}
.lcard label{display:block;font-size:10px;color:var(--ink3);letter-spacing:.06em;margin:12px 0 4px}
.lcard input{width:100%;padding:11px 12px;border:1px solid var(--border2);border-radius:var(--r);font-size:13px;background:var(--cream)}
.lerr{min-height:16px;font-size:12px;color:#b03020;margin-top:8px;text-align:center}
.lbtn{width:100%;margin-top:18px;padding:12px;background:var(--gold-d);color:var(--cream);border:none;border-radius:var(--r);font-size:13px}
.hdr{background:var(--ink);padding:0 16px;height:56px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:40}
.hdr-title{font-family:var(--serif);font-size:18px;color:var(--gold-l);letter-spacing:.06em}
.hdr-right{margin-left:auto;display:flex;gap:8px}
.hdr-nav{padding:6px 11px;border:1px solid rgba(255,255,255,.16);border-radius:6px;color:var(--gold-l);font-size:11px;text-decoration:none;background:none}
.wrap{max-width:920px;margin:0 auto;padding:18px 14px 60px}
.ptitle{font-family:var(--serif);font-size:20px;color:var(--ink);margin-bottom:4px}
.pdesc{font-size:12px;color:var(--ink3);margin-bottom:16px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input,.toolbar select{padding:8px 10px;border:1px solid var(--border2);border-radius:var(--r);font-size:13px;background:var(--white)}
.toolbar input[type=text]{min-width:180px;flex:1}
.btn{border:1px solid var(--border2);border-radius:var(--r);padding:8px 14px;font-size:13px;background:var(--white);color:var(--ink2)}
.cnt{font-size:12px;color:var(--ink3);margin-left:auto}
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--rl);box-shadow:var(--shadow);overflow:hidden}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 12px;font-size:13px;border-bottom:1px solid var(--cream2)}
th{background:var(--cream2);color:var(--ink3);font-size:11px;font-weight:600;letter-spacing:.04em}
td.mono{font-family:var(--mono);font-size:12px;color:var(--ink2)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:10px;background:var(--cream2);color:var(--ink2)}
.mid{font-size:10px;color:var(--ink3);font-family:var(--mono)}
.ec{text-align:center;color:var(--ink3);padding:40px 12px;font-size:13px}

/* ===== 可読性向上（管理画面共通・濃い文字/大きめフォント）===== */
.pdesc{font-size:13px;color:var(--ink2)}
.cnt{font-size:12.5px;color:var(--ink2)}
.fl{font-size:12.5px;color:var(--ink2)}
.hint,.help,.note,.muted,.sub,.meta,.desc,.sublabel{color:var(--ink2)}
</style>
</head>
<body>

<div id="login-screen">
  <div class="lcard">
    <div class="llogo">📈</div>
    <div class="lbrand">テキーラ道場</div>
    <div class="lsub">会員アクセスログ</div>
    <label>メールアドレス</label>
    <input type="email" id="lemail" autocomplete="username">
    <label>パスワード</label>
    <input type="password" id="lpass" autocomplete="current-password">
    <div class="lerr" id="lerr"></div>
    <button class="lbtn" id="lbtn">ログイン</button>
  </div>
</div>

<div id="app">
  <div class="hdr">
    <div class="hdr-title">📈 会員アクセスログ</div>
    <div class="hdr-right">
      <a class="hdr-nav" href="/tdhome.html">← ホーム</a>
      <button class="hdr-nav" id="btn-logout">ログアウト</button>
    </div>
  </div>
  <div class="wrap">
    <div class="ptitle">会員アクセスログ</div>
    <div class="pdesc">会員が会員ページ／マイページ・下位ページを開いた記録（新しい順・最大500件）。同一ページは10分以内の重複を除外して記録しています。</div>
    <div class="toolbar">
      <input type="text" id="f-q" placeholder="会員名 / 会員IDで検索">
      <select id="f-page"><option value="">全ページ</option></select>
      <input type="date" id="f-date">
      <button class="btn" id="btn-clear">クリア</button>
      <button class="btn" id="btn-reload">↻ 再読み込み</button>
      <span class="cnt" id="cnt"></span>
    </div>
    <div class="card">
      <table>
        <thead><tr><th style="width:150px">日時</th><th>会員</th><th style="width:150px">ページ</th></tr></thead>
        <tbody id="tb"><tr><td colspan="3" class="ec">読み込み中…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script>
firebase.initializeApp(FIREBASE_CONFIG);
var auth=firebase.auth(), db=firebase.firestore();
function g(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function pad(n){return String(n).padStart(2,'0');}

var PAGE_LABEL={member:'会員トップ',mypage:'マイページ',menu:'オンラインメニュー',map:'蒸留所マップ',movie:'テキーラ動画',seminars:'有料セミナー',ptd:'PTDデータ',subscription:'会員プラン',collection:'コレクション',library:'テキーラ書庫'};
function pageLabel(k){return PAGE_LABEL[k]||k||'—';}

var logs=[], midMap={};
// 会員を読み込み、ドキュメントID/realId/displayId のいずれからでも表示ID(displayId)へ
// 解決できるマップを作る（旧ログは内部IDで記録されているため）。
function loadMembers(){
  return db.collection('members').get().then(function(snap){
    snap.forEach(function(d){
      var m=d.data()||{};
      var disp=m.displayId||d.id;
      midMap[d.id]=disp;
      if(m.realId) midMap[m.realId]=disp;
      if(m.displayId) midMap[m.displayId]=disp;
      if(m.memberId) midMap[String(m.memberId)]=disp;
    });
  }).catch(function(){});
}
function dispMid(id){ return (id&&midMap[id])||id||''; }

AuthRole.requireStaff(auth, function(user, role){
  g('login-screen').style.display='none';
  g('app').style.display='block';
  init();
}, function(){
  g('login-screen').style.display='flex';
  g('app').style.display='none';
});
g('lbtn').addEventListener('click',function(){
  auth.signInWithEmailAndPassword((g('lemail').value||'').trim(), g('lpass').value).catch(function(e){ g('lerr').textContent=e.message; });
});
g('lpass').addEventListener('keydown',function(e){ if(e.key==='Enter') g('lbtn').click(); });
g('btn-logout').addEventListener('click',function(){ auth.signOut(); });

var _inited=false;
function init(){
  if(_inited){ load(); return; }   // 認証イベントが複数回発火しても初期化は1回だけ
  _inited=true;
  // ページ選択肢
  var sel=g('f-page');
  Object.keys(PAGE_LABEL).forEach(function(k){ var o=document.createElement('option'); o.value=k; o.textContent=PAGE_LABEL[k]; sel.appendChild(o); });
  ['f-q','f-page','f-date'].forEach(function(id){ g(id).addEventListener('input',render); g(id).addEventListener('change',render); });
  g('btn-clear').addEventListener('click',function(){ g('f-q').value=''; g('f-page').value=''; g('f-date').value=''; render(); });
  g('btn-reload').addEventListener('click',load);
  loadMembers().then(load);
}

function load(){
  g('tb').innerHTML='<tr><td colspan="3" class="ec">読み込み中…</td></tr>';
  db.collection('accessLogs').orderBy('at','desc').limit(500).get().then(function(snap){
    logs=snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    render();
  }).catch(function(e){ g('tb').innerHTML='<tr><td colspan="3" class="ec">読み込み失敗: '+esc(e.message)+'</td></tr>'; });
}

function fmtAt(at){
  if(!at||!at.toDate) return '—';
  var d=at.toDate();
  return d.getFullYear()+'/'+pad(d.getMonth()+1)+'/'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());
}
function dayKey(at){
  if(!at||!at.toDate) return '';
  var d=at.toDate();
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}

function render(){
  var q=(g('f-q').value||'').toLowerCase().trim();
  var fp=g('f-page').value;
  var fd=g('f-date').value; // YYYY-MM-DD
  var list=logs.filter(function(l){
    if(fp && (l.page||'')!==fp) return false;
    if(fd && dayKey(l.at)!==fd) return false;
    if(q){
      var hay=((l.name||'')+' '+dispMid(l.memberId)).toLowerCase();
      if(hay.indexOf(q)<0) return false;
    }
    return true;
  });
  g('cnt').textContent=list.length+' 件'+(list.length!==logs.length?(' / 全'+logs.length+'件'):'');
  var tb=g('tb');
  if(!list.length){ tb.innerHTML='<tr><td colspan="3" class="ec">該当するアクセスログはありません</td></tr>'; return; }
  tb.innerHTML=list.map(function(l){
    return '<tr>'
      +'<td class="mono">'+esc(fmtAt(l.at))+'</td>'
      +'<td>'+esc(l.name||'（名称未設定）')+' <span class="mid">'+esc(dispMid(l.memberId))+'</span></td>'
      +'<td><span class="pill">'+esc(pageLabel(l.page))+'</span></td>'
      +'</tr>';
  }).join('');
}
</script>
</body>
</html>
