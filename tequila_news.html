<style>
:root{
  --ink:#18110a;--ink2:#4a3820;--ink3:#9a8470;
  --gold:#c8921e;--gold-l:#e8b84a;--gold-d:#7a5610;
  --cream:#faf7f1;--cream2:#f0ebe0;--cream3:#e4ddd0;--white:#fff;
  --border:rgba(160,130,100,.18);--border2:rgba(160,130,100,.32);
  --shadow:0 1px 12px rgba(24,17,10,.07);--shadow-lg:0 6px 36px rgba(24,17,10,.13);
  --r:8px;--rl:14px;
  --serif:'Hiragino Mincho ProN','Yu Mincho',serif;
  --sans:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  --mono:'SFMono-Regular',Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--cream);color:var(--ink);min-height:100vh}
button{cursor:pointer;font-family:var(--sans)}
a{color:inherit}
/* login */
#login-screen{display:none;min-height:100vh;align-items:center;justify-content:center;padding:24px}
.lcard{width:100%;max-width:360px;background:var(--white);border:1px solid var(--border2);border-radius:var(--rl);padding:40px 30px;box-shadow:var(--shadow-lg)}
.llogo{text-align:center;font-size:40px;margin-bottom:6px}
.lbrand{font-family:var(--serif);font-size:22px;color:var(--gold-d);letter-spacing:.1em;text-align:center}
.lsub{text-align:center;font-size:10px;letter-spacing:.18em;color:var(--ink3);margin-bottom:24px}
.lcard label{display:block;font-size:10px;color:var(--ink3);letter-spacing:.06em;margin:12px 0 4px}
.lcard input{width:100%;padding:11px 12px;border:1px solid var(--border2);border-radius:var(--r);font-size:13px;background:var(--cream)}
.lerr{min-height:16px;font-size:12px;color:#b03020;margin-top:8px;text-align:center}
.lbtn{width:100%;margin-top:18px;padding:12px;background:var(--gold-d);color:var(--cream);border:none;border-radius:var(--r);font-size:13px}
/* header */
.hdr{background:var(--ink);padding:0 16px;height:56px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:40}
.hdr-title{font-family:var(--serif);font-size:18px;color:var(--gold-l);letter-spacing:.06em}
.hdr-right{margin-left:auto}
.hdr-nav{padding:6px 11px;border:1px solid rgba(255,255,255,.16);border-radius:6px;color:var(--gold-l);font-size:11px;text-decoration:none}
#app{display:none}
.wrap{max-width:860px;margin:0 auto;padding:16px 14px 60px}
/* toolbar */
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.tcount{font-size:12px;color:var(--ink2);font-weight:600}
.markall{font-size:11px;color:var(--gold-d);background:var(--white);border:1px solid var(--cream3);border-radius:16px;padding:6px 12px;cursor:pointer}
.markall:hover{background:var(--cream2);border-color:var(--gold)}
.sortsel{margin-left:auto;font-size:12px;color:var(--ink2);background:var(--white);border:1px solid var(--cream3);border-radius:16px;padding:6px 12px}
.tag-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tag-chip{padding:5px 11px;border:1px solid var(--cream3);border-radius:16px;background:var(--white);color:var(--ink3);font-size:11px;white-space:nowrap}
.tag-chip.on{background:var(--gold-d);color:var(--cream);border-color:var(--gold-d)}
/* list */
#list{display:flex;flex-direction:column;background:var(--white);border:1px solid var(--border);border-radius:var(--rl);box-shadow:var(--shadow);overflow:hidden}
.nrow{display:flex;align-items:baseline;gap:12px;padding:13px 16px;border-bottom:1px solid #d9d4cc;cursor:pointer;transition:background .12s}
.nrow:last-child{border-bottom:none}
.nrow:hover{background:var(--cream2)}
.nrow-title{flex:1;min-width:0;font-size:14px;font-weight:600;line-height:1.5;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nrow-lang{flex-shrink:0;font-size:9px;color:var(--gold-d);border:1px solid var(--cream3);border-radius:8px;padding:0 5px;line-height:1.5}
.nrow-date{flex-shrink:0;font-size:12px;color:var(--ink3);font-family:var(--mono)}
.unread-dot{flex-shrink:0;width:7px;height:7px;border-radius:50%;background:var(--gold);align-self:center}
.new-badge{flex-shrink:0;font-size:9px;font-weight:800;letter-spacing:.04em;color:#fff;background:#c0453a;border-radius:4px;padding:1px 5px;line-height:1.5}
/* 既読はタイトルを少しグレーに（未読を目立たせる） */
.nrow.read{background:#efefef}
.nrow.read:hover{background:#e6e6e6}
.nrow.read .nrow-title{color:#000}
.hot-badge{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.04em;color:#fff;background:#e8130a;border-radius:4px;padding:0 5px;line-height:1.6;margin-right:6px;vertical-align:1px;font-family:var(--sans)}
.dm-title .hot-badge{font-size:12px;padding:1px 7px;vertical-align:4px}
.ndate{font-size:11px;color:var(--ink3);font-family:var(--mono)}
.ndate b{color:var(--ink2);font-weight:600}
.nlang{font-size:10px;color:var(--ink3);border:1px solid var(--cream3);border-radius:10px;padding:1px 7px}
.empty{text-align:center;color:var(--ink3);padding:60px 20px;font-size:14px}
/* detail modal */
.dmbg{position:fixed;inset:0;background:rgba(10,7,4,.72);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:0;overflow-y:auto}
.dmbg.open{display:block}
.dmodal{max-width:760px;margin:40px auto;background:var(--white);border-radius:var(--rl);box-shadow:var(--shadow-lg);overflow:hidden}
@media(max-width:600px){.dmodal{margin:0;border-radius:0;min-height:100vh}}
.dm-head{position:sticky;top:0;background:var(--ink);padding:0 14px;height:52px;display:flex;align-items:center;gap:10px;z-index:2}
.dm-htitle{color:var(--gold-l);font-size:13px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dm-x{background:rgba(255,255,255,.12);border:none;color:#fff;width:34px;height:34px;border-radius:50%;font-size:18px;flex-shrink:0}
.dm-body{padding:24px 24px 48px}
@media(max-width:600px){.dm-body{padding:20px 16px 48px}}
.dm-meta{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.dm-title{font-family:var(--serif);font-size:23px;font-weight:700;line-height:1.5;margin-bottom:6px;text-wrap:balance}
.dm-title-orig{font-size:13px;color:var(--ink3);line-height:1.6;margin-bottom:16px;font-style:italic}
.dm-summary{background:var(--cream2);border-left:3px solid var(--gold);border-radius:0 var(--r) var(--r) 0;padding:12px 16px;font-size:13.5px;line-height:1.85;color:var(--ink2);margin-bottom:20px}
.dm-article{font-size:14.5px;line-height:1.95;color:var(--ink)}
.dm-article p{margin:0 0 1em}
.dm-article a{color:var(--gold-d);text-decoration:underline}
.dm-article img{max-width:100%;height:auto;border-radius:var(--r);margin:8px 0}
.dm-article h2,.dm-article h3{font-family:var(--serif);margin:1.2em 0 .5em;line-height:1.5}
.dm-article ul,.dm-article ol{margin:0 0 1em 1.3em}
.dm-orig{margin-top:22px;border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.dm-orig summary{cursor:pointer;padding:11px 14px;background:var(--cream2);font-size:12px;font-weight:600;color:var(--ink2);list-style:none}
.dm-orig summary::-webkit-details-marker{display:none}
.dm-orig summary::before{content:'▸ ';color:var(--gold-d)}
.dm-orig[open] summary::before{content:'▾ '}
.dm-orig .dm-origbody{padding:14px 16px;font-size:13px;line-height:1.85;color:var(--ink2);white-space:pre-wrap}
.dm-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:22px}
.dm-tag{font-size:11px;background:var(--cream2);color:var(--gold-d);padding:3px 11px;border-radius:12px;font-weight:600}
.dm-src{margin-top:22px;padding-top:18px;border-top:1px solid var(--border)}
.dm-src-label{font-size:10px;letter-spacing:.12em;color:var(--ink3);margin-bottom:6px}
.dm-src a{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--gold-d);text-decoration:none;word-break:break-all}
.dm-src a:hover{text-decoration:underline}
.dm-foot{margin-top:28px;text-align:center}
.dm-foot a{font-size:12px;color:var(--ink3);text-decoration:none}
</style>
</head>
<body>

<!-- ログイン画面 -->
<div id="login-screen">
  <div class="lcard">
    <div class="llogo">📰</div>
    <div class="lbrand">テキーラ道場</div>
    <div class="lsub">テキーラ関連ニュース — 会員専用</div>
    <label>メールアドレス</label>
    <input type="email" id="lemail" autocomplete="username">
    <label>パスワード</label>
    <input type="password" id="lpass" autocomplete="current-password">
    <div class="lerr" id="lerr"></div>
    <button class="lbtn" id="lbtn">ログイン</button>
  </div>
</div>

<!-- 有料会員限定ロック画面（設定で accessLevel=paid のとき） -->
<div id="locked-screen" style="display:none;min-height:100vh;align-items:center;justify-content:center;padding:24px">
  <div class="lcard" style="text-align:center">
    <div class="llogo">🔒</div>
    <div class="lbrand">テキーラ関連ニュース</div>
    <div class="lsub">有料会員限定</div>
    <p id="locked-need" style="font-size:13px;color:var(--ink2);line-height:1.8;margin:18px 0 8px">このコンテンツは有料会員向けです。</p>
    <a class="lbtn" href="/member_subscription.html" style="display:block;text-decoration:none;text-align:center;box-sizing:border-box">プランを見る</a>
    <a href="/member.html" style="display:inline-block;margin-top:14px;font-size:12px;color:var(--ink3);text-decoration:none">← 会員コンテンツに戻る</a>
  </div>
</div>

<!-- アプリ -->
<div id="app">
  <div class="hdr">
    <div class="hdr-title">📰 テキーラ関連ニュース</div>
    <div class="hdr-right"><a class="hdr-nav" href="/member.html">📚 会員コンテンツ</a> <a class="hdr-nav" href="/" style="margin-left:6px">🏠 TOP</a></div>
  </div>
  <div class="wrap">
    <div class="toolbar">
      <span class="tcount" id="count"></span>
      <button class="markall" id="markall">✓ 全部既読</button>
      <select class="sortsel" id="sortsel">
        <option value="default">標準（NEW → 公開日が新しい順）</option>
        <option value="src">投稿日（元記事）が新しい順</option>
        <option value="srcold">投稿日（元記事）が古い順</option>
        <option value="pub">公開日が新しい順</option>
        <option value="pubold">公開日が古い順</option>
      </select>
    </div>
    <div class="tag-filter" id="tag-filter"></div>
    <div id="list"></div>
    <div class="empty" id="empty" style="display:none;">公開中のニュースはまだありません。</div>
  </div>
</div>

<!-- 記事詳細モーダル -->
<div class="dmbg" id="detail">
  <div class="dmodal">
    <div class="dm-head">
      <div class="dm-htitle" id="dm-htitle">テキーラ関連ニュース</div>
      <button class="dm-x" id="dm-x">✕</button>
    </div>
    <div class="dm-body" id="dm-body"></div>
  </div>
</div>

<script>
firebase.initializeApp(FIREBASE_CONFIG);
var auth=firebase.auth(), db=firebase.firestore();
function g(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function stripHtml(h){var d=document.createElement('div');d.innerHTML=h||'';return (d.textContent||d.innerText||'').replace(/\s+/g,' ').trim();}
function bodyHtml(raw){
  var s=String(raw||'').trim(); if(!s) return '';
  if(/<(p|br|div|h[1-6]|ul|ol|li|a|img|strong|em|b|i)\b/i.test(s)) return s;
  return s.split(/\n{2,}/).map(function(p){ return '<p>'+esc(p.trim()).replace(/\n/g,'<br>')+'</p>'; }).join('\n');
}
var LANG_LABEL={ja:'日本語',en:'英語',es:'スペイン語',fr:'フランス語',pt:'ポルトガル語',other:'他言語'};

var articles=[], curTag='__all', sortMode='default';
var currentUid=null, readRef=null, readSet={};
var NEW_WINDOW_MS=3*24*60*60*1000; // 3日以内公開=NEW

AuthRole.requireMember(auth, function(user){
  currentUid=user.uid;
  try{ readRef=db.collection('tequilaNewsReads').doc(user.uid); }catch(e){}
  gateByConfig(user);
}, function(){
  g('login-screen').style.display='flex';
});

function isNew(a){ var t=Date.parse(a.publishedAt||a.createdAt||''); return t && (Date.now()-t)<=NEW_WINDOW_MS; }
function isRead(a){ return !!readSet[a.id]; }
function showNew(a){ return isNew(a) && !isRead(a); } // 既読ならNEWを外す

function gateByConfig(user){
  db.collection('tequilaNewsConfig').doc('settings').get().then(function(cfg){
    var accessLevel=(cfg.exists&&cfg.data().accessLevel)||'member';
    if(accessLevel!=='paid'){ g('app').style.display='block'; loadArticles(); return; }
    Promise.all([
      db.collection('members').where('authUid','==',user.uid).limit(1).get(),
      MemberPlan.loadPlans(db)
    ]).then(function(res){
      var member=res[0].empty?{}:res[0].docs[0].data();
      var eff=MemberPlan.effectivePlan(member, res[1]||[]);
      if((Number(eff&&eff.level)||0)>0){ g('app').style.display='block'; loadArticles(); }
      else{ g('locked-screen').style.display='flex'; }
    }).catch(function(){ g('locked-screen').style.display='flex'; });
  }).catch(function(){ g('app').style.display='block'; loadArticles(); });
}

g('lbtn').addEventListener('click',function(){
  auth.signInWithEmailAndPassword((g('lemail').value||'').trim(),g('lpass').value).catch(function(e){ g('lerr').textContent=e.message; });
});
g('lpass').addEventListener('keydown',function(e){ if(e.key==='Enter') g('lbtn').click(); });

function tsPub(a){ var t=Date.parse(a.publishedAt||a.createdAt||''); return isNaN(t)?0:t; }
function tsSrc(a){ var t=Date.parse(a.sourceDate||a.publishedAt||a.createdAt||''); return isNaN(t)?0:t; }
function fmtDate(iso){ if(!iso) return ''; var t=Date.parse(iso); if(isNaN(t)) return ''; var d=new Date(t); return d.getFullYear()+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+('0'+d.getDate()).slice(-2); }
function dispTitle(a){ return a.titleJa||a.title||'(無題)'; }
function dispBody(a){ return bodyHtml(a.bodyJa||a.body||''); }

function loadArticles(){
  var pReads=readRef?readRef.get().then(function(d){ readSet=(d.exists&&d.data().read)||{}; }).catch(function(){ readSet={}; }):Promise.resolve();
  Promise.all([
    db.collection('tequilaNews').where('published','==',true).get(),
    pReads
  ]).then(function(res){
    var snap=res[0];
    articles=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});
    renderTags(); applySort(); render();
    var q=new URLSearchParams(location.search), wid=q.get('id');
    if(wid){ var hit=articles.filter(function(a){return a.id===wid;})[0]; if(hit) openDetail(hit); }
  }).catch(function(e){
    g('list').innerHTML=''; g('empty').style.display='block';
    g('empty').textContent='読み込みに失敗しました: '+esc(e.message);
  });
}

// 既読化（本人のUID単位でFirestoreに保存）
function markRead(id){
  if(!id || readSet[id]) return;
  readSet[id]=true;
  if(readRef){ var o={}; o[id]=true; readRef.set({read:o,updatedAt:new Date().toISOString()},{merge:true}).catch(function(){}); }
  // 表示を即時反映
  var el=g('list').querySelector('.nrow[data-id="'+(''+id).replace(/"/g,'')+'"]');
  if(el){ el.classList.add('read'); var dot=el.querySelector('.unread-dot'); if(dot) dot.style.visibility='hidden'; var nb=el.querySelector('.new-badge'); if(nb) nb.remove(); }
  updateUnreadCount();
}
function markAllRead(){
  var ids=articles.map(function(a){return a.id;});
  if(!ids.length) return;
  var o={}; ids.forEach(function(id){ readSet[id]=true; o[id]=true; });
  if(readRef){ readRef.set({read:o,updatedAt:new Date().toISOString()},{merge:true}).catch(function(){}); }
  render();
}
function updateUnreadCount(){
  var items=articles.filter(function(a){return curTag==='__all'||(a.tags||[]).indexOf(curTag)>=0;});
  var unread=items.filter(function(a){return !isRead(a);}).length;
  var b=g('markall'); if(b) b.style.display=unread?'':'none';
  var c=g('count'); if(c) c.textContent=items.length?(items.length+'件'+(unread?'（未読'+unread+'）':'')):'';
}

function applySort(){
  if(sortMode==='default') articles.sort(function(a,b){ var na=showNew(a)?1:0, nb=showNew(b)?1:0; return (nb-na)||(tsPub(b)-tsPub(a)); });
  else if(sortMode==='pub') articles.sort(function(a,b){return tsPub(b)-tsPub(a);});
  else if(sortMode==='pubold') articles.sort(function(a,b){return tsPub(a)-tsPub(b);});
  else if(sortMode==='src') articles.sort(function(a,b){return tsSrc(b)-tsSrc(a);});
  else if(sortMode==='srcold') articles.sort(function(a,b){return tsSrc(a)-tsSrc(b);});
}
g('sortsel').addEventListener('change',function(){ sortMode=g('sortsel').value; applySort(); render(); });
g('markall').addEventListener('click',markAllRead);

function renderTags(){
  var tags=[]; articles.forEach(function(a){ (a.tags||[]).forEach(function(t){ if(t&&tags.indexOf(t)<0) tags.push(t); }); });
  var el=g('tag-filter');
  if(!tags.length){ el.innerHTML=''; return; }
  var html='<button class="tag-chip'+(curTag==='__all'?' on':'')+'" data-t="__all">すべて</button>';
  html+=tags.map(function(t){return '<button class="tag-chip'+(curTag===t?' on':'')+'" data-t="'+esc(t)+'">#'+esc(t)+'</button>';}).join('');
  el.innerHTML=html;
  Array.prototype.forEach.call(el.querySelectorAll('.tag-chip'),function(b){
    b.addEventListener('click',function(){ curTag=b.dataset.t; renderTags(); render(); });
  });
}

function render(){
  var items=articles.filter(function(a){return curTag==='__all'||(a.tags||[]).indexOf(curTag)>=0;});
  var list=g('list');
  if(!items.length){ list.innerHTML=''; g('empty').style.display='block'; updateUnreadCount(); return; }
  g('empty').style.display='none';
  list.innerHTML=items.map(function(a,i){
    var read=isRead(a);
    var lang=(a.originalLang&&a.originalLang!=='ja')?'<span class="nrow-lang">'+esc(LANG_LABEL[a.originalLang]||a.originalLang)+'</span>':'';
    var d=fmtDate(a.sourceDate||a.publishedAt);
    var dot='<span class="unread-dot"'+(read?' style="visibility:hidden"':'')+'></span>';
    var nb=showNew(a)?'<span class="new-badge">NEW</span>':'';
    return '<div class="nrow'+(read?' read':'')+'" data-i="'+i+'" data-id="'+esc(a.id)+'">'
      +dot
      +'<span class="nrow-title">'+(a.hot?'<span class="hot-badge">HOT</span>':'')+esc(dispTitle(a))+'</span>'
      +nb+lang
      +'<span class="nrow-date">'+esc(d)+'</span>'
      +'</div>';
  }).join('');
  Array.prototype.forEach.call(list.querySelectorAll('.nrow'),function(el){
    el.addEventListener('click',function(){ openDetail(items[Number(el.dataset.i)]); });
  });
  updateUnreadCount();
}

function openDetail(a){
  markRead(a.id);
  g('dm-htitle').textContent=dispTitle(a);
  var lang=(a.originalLang&&a.originalLang!=='ja')?'<span class="nlang">'+esc(LANG_LABEL[a.originalLang]||a.originalLang)+' 原文の和訳</span>':'';
  var html='<div class="dm-meta">'
    +'<span class="ndate"><b>道場公開</b> '+esc(fmtDate(a.publishedAt))+'</span>'
    +(a.sourceDate?'<span class="ndate">／ 元記事 '+esc(fmtDate(a.sourceDate))+'</span>':'')
    +lang+'</div>'
    +'<div class="dm-title">'+(a.hot?'<span class="hot-badge">HOT</span>':'')+esc(dispTitle(a))+'</div>';
  // 原題（和訳タイトルがあり、かつ原題が別言語で存在する場合）
  if(a.titleJa && a.title && a.title!==a.titleJa){ html+='<div class="dm-title-orig">原題: '+esc(a.title)+'</div>'; }
  if(a.summaryJa){ html+='<div class="dm-summary">'+esc(a.summaryJa)+'</div>'; }
  html+='<div class="dm-article">'+(dispBody(a)||'<p>本文はありません。</p>')+'</div>';
  // 原文（本文の原語）
  var orig=a.body;
  if(orig && a.bodyJa && String(orig).trim() && orig!==a.bodyJa){
    html+='<details class="dm-orig"><summary>原文（'+esc(LANG_LABEL[a.originalLang]||a.originalLang||'原語')+'）を表示</summary>'
      +'<div class="dm-origbody">'+esc(stripHtml(orig))+'</div></details>';
  }
  if(a.tags&&a.tags.length){ html+='<div class="dm-tags">'+a.tags.map(function(t){return '<span class="dm-tag">#'+esc(t)+'</span>';}).join('')+'</div>'; }
  if(a.sourceUrl){
    html+='<div class="dm-src"><div class="dm-src-label">ソース</div>'
      +'<a href="'+esc(a.sourceUrl)+'" target="_blank" rel="noopener noreferrer">🔗 '+esc(a.sourceName||a.sourceUrl)+'</a></div>';
  }else if(a.sourceName){
    html+='<div class="dm-src"><div class="dm-src-label">出典</div><div style="font-size:13px;color:var(--ink2)">'+esc(a.sourceName)+'</div></div>';
  }
  html+='<div class="dm-foot"><a href="#" id="dm-close2">← 一覧に戻る</a></div>';
  g('dm-body').innerHTML=html;
  g('dm-body').scrollTop=0;
  g('detail').classList.add('open');
  document.body.style.overflow='hidden';
  var c2=g('dm-close2'); if(c2) c2.addEventListener('click',function(e){e.preventDefault();closeDetail();});
  try{ history.replaceState(null,'','?id='+encodeURIComponent(a.id)); }catch(e){}
}
function closeDetail(){
  g('detail').classList.remove('open');
  document.body.style.overflow='';
  try{ history.replaceState(null,'',location.pathname); }catch(e){}
}
g('dm-x').addEventListener('click',closeDetail);
g('detail').addEventListener('click',function(e){ if(e.target===g('detail')) closeDetail(); });
document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&g('detail').classList.contains('open')) closeDetail(); });
</script>
