<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>イベント管理 — テキーラ道場</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>

  apiKey:"AIzaSyD6a3i-N1RyXyAfXmztPQrYtx4x62YGth0",

  projectId:"tequiladojo",
  storageBucket:"tequiladojo.firebasestorage.app",
  messagingSenderId:"56663296233",

};

<script src="/auth-role.js?v=20260714"></script>
<style>
:root{
  --ink:#18110a;--ink2:#4a3820;--ink3:#9a8470;
  --gold:#c8921e;--gold-l:#e8b84a;--gold-d:#7a5610;
  --cream:#faf7f1;--cream2:#f0ebe0;--cream3:#e4ddd0;--white:#fff;
  --red:#b03020;--teal:#1a6e58;
  --border:rgba(160,130,100,.18);--border2:rgba(160,130,100,.32);
  --shadow-lg:0 6px 36px rgba(24,17,10,.13);
  --r:8px;--rl:12px;
  --serif:'Hiragino Mincho ProN','Yu Mincho',serif;
  --sans:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  --mono:'SFMono-Regular',Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--cream);color:var(--ink);min-height:100vh}
button{cursor:pointer;font-family:var(--sans)}
#login-screen{display:none;min-height:100vh;align-items:center;justify-content:center;padding:24px}
.lcard{width:100%;max-width:360px;background:var(--white);border:1px solid var(--border2);border-radius:var(--rl);padding:40px 30px;box-shadow:var(--shadow-lg)}
.llogo{text-align:center;font-size:40px;margin-bottom:6px}
.lbrand{font-family:var(--serif);font-size:22px;color:var(--gold-d);letter-spacing:.1em;text-align:center}
.lsub{text-align:center;font-size:10px;letter-spacing:.18em;color:var(--ink3);margin-bottom:24px}
.lcard label{display:block;font-size:10px;color:var(--ink3);margin:12px 0 4px}
.lcard input{width:100%;padding:11px 12px;border:1px solid var(--border2);border-radius:var(--r);font-size:13px;background:var(--cream)}
.lerr{min-height:16px;font-size:12px;color:var(--red);margin-top:8px;text-align:center}
.lbtn{width:100%;margin-top:18px;padding:12px;background:var(--gold-d);color:var(--cream);border:none;border-radius:var(--r);font-size:13px}
.hdr{background:var(--ink);padding:0 16px;height:56px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:40}
.hdr-title{font-family:var(--serif);font-size:18px;color:var(--gold-l);letter-spacing:.06em}
.hdr-right{margin-left:auto;display:flex;gap:8px}
.hdr-nav{padding:6px 11px;border:1px solid rgba(255,255,255,.16);border-radius:6px;color:var(--gold-l);font-size:11px;text-decoration:none;background:none;cursor:pointer}
#app{display:none}
.wrap{max-width:920px;margin:0 auto;padding:20px 16px 60px}
.ptitle{font-family:var(--serif);font-size:22px;color:var(--gold-d);margin-bottom:4px}
.pdesc{font-size:12px;color:var(--ink3);margin-bottom:16px;line-height:1.6}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.btn{border:none;border-radius:var(--r);padding:9px 16px;font-size:13px;font-weight:500}
.bp{background:var(--gold-d);color:var(--cream)}
.bs{background:var(--cream2);color:var(--ink2);border:1px solid var(--border2)}
.bd{background:var(--white);color:var(--red);border:1px solid var(--cream3)}
.sm{padding:6px 11px;font-size:12px}
.cnt{font-size:12px;color:var(--ink3);margin-left:auto}
.ev-card{background:var(--white);border:1px solid var(--border);border-radius:var(--rl);padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 3px rgba(24,17,10,.05)}
.ev-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ev-name{font-size:15px;font-weight:700;color:var(--ink)}
.ev-pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px}
.pill-pub{background:#e7f6f1;color:var(--teal)}
.pill-hidden{background:var(--cream3);color:var(--ink3)}
.ev-meta{font-size:12px;color:var(--ink3);margin-top:4px;line-height:1.6}
.ev-actions{margin-left:auto;display:flex;gap:6px}
.ec{padding:26px;text-align:center;color:var(--ink3);font-size:13px}
.mbg{position:fixed;inset:0;background:rgba(24,17,10,.55);z-index:200;display:none;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto}
.mbg.open{display:flex}
.modal{background:var(--white);border-radius:var(--rl);width:100%;max-width:600px;margin-top:20px;box-shadow:var(--shadow-lg);max-height:92vh;display:flex;flex-direction:column}
.mhd{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border);font-weight:700;color:var(--gold-d)}
.mbd{padding:16px 18px;overflow-y:auto}
.mft{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center}
.fg{margin-bottom:12px}
.fl{display:block;font-size:11px;color:var(--ink3);margin-bottom:4px;font-weight:600}
.fi{width:100%;padding:9px 10px;border:1px solid var(--border2);border-radius:var(--r);font-size:13px;background:var(--cream);font-family:var(--sans)}
textarea.fi{min-height:90px;resize:vertical;line-height:1.6}
.row2{display:flex;gap:10px}
.row2>.fg{flex:1}
.sch-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
.sch-row .d{min-width:110px;font-family:var(--mono);color:var(--ink2)}
.sch-row input[type=time]{padding:6px 8px;border:1px solid var(--border2);border-radius:var(--r);font-size:13px;background:var(--white)}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--cream2);color:var(--ink2);border:1px solid var(--border2);border-radius:14px;padding:3px 10px;font-size:12px;margin:0 5px 5px 0}
.chip b{cursor:pointer;color:var(--red)}
.presults{border:1px solid var(--border);border-radius:var(--r);max-height:180px;overflow-y:auto;margin-top:4px;display:none}
.presults div{padding:7px 10px;border-bottom:1px solid var(--border);cursor:pointer;font-size:13px}
.presults div:hover{background:var(--cream2)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;padding:10px 18px;border-radius:18px;z-index:9999;box-shadow:var(--shadow-lg)}
.toast.err{background:var(--red)}
.err{min-height:16px;color:var(--red);font-size:12px;margin-top:6px}
</style>
</head>
<body>

<div id="login-screen">
  <div class="lcard">
    <div class="llogo">🎪</div>
    <div class="lbrand">テキーラ道場</div>
    <div class="lsub">イベント管理</div>
    <label>メールアドレス</label><input type="email" id="lemail" autocomplete="username">
    <label>パスワード</label><input type="password" id="lpass" autocomplete="current-password">
    <div class="lerr" id="lerr"></div>
    <button class="lbtn" id="lbtn">ログイン</button>
  </div>
</div>

<div id="app">
  <div class="hdr">
    <div class="hdr-title">🎪 イベント管理</div>
    <div class="hdr-right">
      <a class="hdr-nav" href="/tdhome.html">管理TOP</a>
      <button class="hdr-nav" id="btn-logout">ログアウト</button>
    </div>
  </div>
  <div class="wrap">
    <div class="ptitle">イベント管理</div>
    <div class="pdesc">会員向けイベントのマスタ。公開すると会員マイページにイベントTOPページへのバナーが表示されます。</div>
    <div class="toolbar">
      <button class="btn bp" onclick="openEvent(null)">＋ イベント追加</button>
      <span class="cnt" id="cnt"></span>
    </div>
    <div id="list"><div class="ec">読み込み中…</div></div>
  </div>
</div>

<!-- 追加/編集モーダル -->
<div class="mbg" id="ev-modal">
  <div class="modal">
    <div class="mhd"><span id="ev-mt">イベント登録</span><button class="hdr-nav" style="margin-left:auto;color:var(--ink3);border-color:var(--border2)" onclick="closeEvent()">✕</button></div>
    <div class="mbd">
      <div class="fg"><label class="fl">イベント名 <span style="color:var(--red)">*</span></label><input class="fi" id="f-name" placeholder="例: テキーラ道場 5周年フェス"></div>
      <div class="row2">
        <div class="fg"><label class="fl">開始日付 <span style="color:var(--red)">*</span></label><input class="fi" id="f-start" type="date"></div>
        <div class="fg"><label class="fl">終了日付 <span style="color:var(--red)">*</span></label><input class="fi" id="f-end" type="date"></div>
      </div>
      <div class="fg">
        <label class="fl">各日の開催時間</label>
        <div style="font-size:11px;color:var(--ink3);margin-bottom:6px">開始・終了日付を入れると各日の行が生成されます。</div>
        <div id="sched"></div>
      </div>
      <div class="fg"><label class="fl">開催場所</label><input class="fi" id="f-loc" placeholder="例: テキーラ道場 本店"></div>
      <div class="fg"><label class="fl">詳細</label><textarea class="fi" id="f-desc" placeholder="イベントの説明・内容など"></textarea></div>
      <div class="fg"><label class="fl">イベントTOPページ（任意のURL）</label><input class="fi" id="f-top" placeholder="空欄なら自動で /event.html?id=... を使用"></div>
      <div class="fg">
        <label class="fl">参加者</label>
        <div id="p-chips"></div>
        <input class="fi" id="p-search" placeholder="会員ID・氏名で検索して追加...">
        <div class="presults" id="p-results"></div>
      </div>
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);cursor:pointer;margin-top:4px">
        <input type="checkbox" id="f-pub" style="width:16px;height:16px;accent-color:var(--gold-d)">
        公開する（会員マイページにバナー表示）
      </label>
      <div class="err" id="ev-err"></div>
    </div>
    <div class="mft">
      <button class="btn bd sm" id="ev-del" style="display:none" onclick="delEvent()">🗑 削除</button>
      <div style="flex:1"></div>
      <button class="btn bs" onclick="closeEvent()">キャンセル</button>
      <button class="btn bp" id="ev-save" onclick="saveEvent()">保存</button>
    </div>
  </div>
</div>

<script>
firebase.initializeApp(FIREBASE_CONFIG);
var auth=firebase.auth(), db=firebase.firestore();
function g(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(m,t){var d=document.createElement('div');d.className='toast'+(t?' '+t:'');d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove();},2800);}

var events=[], members=[], _editId=null, _participants=[];

AuthRole.requireStaff(auth, function(){ g('login-screen').style.display='none'; g('app').style.display='block'; init(); },
  function(){ g('login-screen').style.display='flex'; g('app').style.display='none'; });
g('lbtn').addEventListener('click',function(){ auth.signInWithEmailAndPassword((g('lemail').value||'').trim(), g('lpass').value).catch(function(e){ g('lerr').textContent=e.message; }); });
g('lpass').addEventListener('keydown',function(e){ if(e.key==='Enter') g('lbtn').click(); });
g('btn-logout').addEventListener('click',function(){ auth.signOut(); });

var _inited=false;
function init(){ if(_inited){ load(); return; } _inited=true; loadMembers(); load(); g('p-search').addEventListener('input',renderPSearch); }

function load(){
  g('list').innerHTML='<div class="ec">読み込み中…</div>';
  db.collection('events').orderBy('startDate','desc').get().then(function(snap){
    events=snap.docs.map(function(d){ return Object.assign({id:d.id},d.data()); });
    render();
  }).catch(function(e){ g('list').innerHTML='<div class="ec">読込失敗: '+esc(e.message)+'</div>'; });
}
function loadMembers(){
  db.collection('members').get().then(function(snap){
    members=snap.docs.map(function(d){ return Object.assign({id:d.id},d.data()); }).filter(function(m){ return !m.deleted; });
  }).catch(function(){});
}
function memberName(id){ var m=members.find(function(x){return x.id===id||String(x.memberId)===String(id)||String(x.displayId)===String(id);}); return m?(m.nickname||m.name||m.displayId||id):id; }

function fmtRange(s,e){ if(!s)return '—'; return s+(e&&e!==s?(' 〜 '+e):''); }
function render(){
  g('cnt').textContent=events.length+'件';
  if(!events.length){ g('list').innerHTML='<div class="ec">イベントがありません。「＋ イベント追加」から登録してください。</div>'; return; }
  g('list').innerHTML=events.map(function(ev){
    var pub=ev.published?'<span class="ev-pill pill-pub">公開中</span>':'<span class="ev-pill pill-hidden">非公開</span>';
    var np=(ev.participantIds||[]).length;
    return '<div class="ev-card">'
      +'<div class="ev-top"><span class="ev-name">'+esc(ev.name||'（無題）')+'</span>'+pub
      +'<div class="ev-actions"><button class="btn bs sm" onclick="openEvent(\''+esc(ev.id)+'\')">編集</button>'
      +'<a class="btn bs sm" style="text-decoration:none" href="/event.html?id='+encodeURIComponent(ev.id)+'" target="_blank">TOPを見る</a></div></div>'
      +'<div class="ev-meta">📅 '+esc(fmtRange(ev.startDate,ev.endDate))+(ev.location?'　📍 '+esc(ev.location):'')+'　👥 参加者 '+np+'名</div>'
      +(ev.description?'<div class="ev-meta" style="color:var(--ink2)">'+esc((ev.description||'').slice(0,80))+((ev.description||'').length>80?'…':'')+'</div>':'')
      +'</div>';
  }).join('');
}

// ── スケジュール（各日の開催時間） ──
function daysBetween(s,e){
  var out=[]; if(!s)return out; var end=e&&e>=s?e:s;
  var d=new Date(s+'T00:00:00'), last=new Date(end+'T00:00:00');
  var guard=0;
  while(d<=last && guard<366){ var y=d.getFullYear(),m=('0'+(d.getMonth()+1)).slice(-2),dd=('0'+d.getDate()).slice(-2); out.push(y+'-'+m+'-'+dd); d.setDate(d.getDate()+1); guard++; }
  return out;
}
var _schedMap={}; // date -> {open, close}
function renderSched(){
  var days=daysBetween(g('f-start').value, g('f-end').value);
  if(!days.length){ g('sched').innerHTML='<div style="font-size:12px;color:var(--ink3)">開始・終了日付を入力してください</div>'; return; }
  g('sched').innerHTML=days.map(function(d){
    var t=_schedMap[d]||{};
    return '<div class="sch-row"><span class="d">'+esc(d)+'</span>'
      +'<input type="time" data-d="'+esc(d)+'" data-k="open" value="'+esc(t.open||'')+'"> 〜 '
      +'<input type="time" data-d="'+esc(d)+'" data-k="close" value="'+esc(t.close||'')+'"></div>';
  }).join('');
  Array.prototype.forEach.call(g('sched').querySelectorAll('input[type=time]'),function(inp){
    inp.addEventListener('input',function(){ var d=this.getAttribute('data-d'),k=this.getAttribute('data-k'); if(!_schedMap[d])_schedMap[d]={}; _schedMap[d][k]=this.value; });
  });
}
g('f-start').addEventListener('change',renderSched);
g('f-end').addEventListener('change',renderSched);

// ── 参加者検索 ──
function renderChips(){
  g('p-chips').innerHTML=_participants.length
    ? _participants.map(function(id){ return '<span class="chip">'+esc(memberName(id))+'<b data-rm="'+esc(id)+'">×</b></span>'; }).join('')
    : '<span style="font-size:12px;color:var(--ink3)">未登録</span>';
  Array.prototype.forEach.call(g('p-chips').querySelectorAll('b[data-rm]'),function(b){ b.addEventListener('click',function(){ _participants=_participants.filter(function(x){return x!==this.getAttribute('data-rm');}.bind(this)); renderChips(); }); });
}
function renderPSearch(){
  var q=(g('p-search').value||'').trim().toLowerCase();
  var box=g('p-results');
  if(!q){ box.style.display='none'; box.innerHTML=''; return; }
  var hits=members.filter(function(m){
    if(_participants.indexOf(m.id)>=0) return false;
    return String(m.displayId||'').toLowerCase().indexOf(q)>=0 || String(m.nickname||'').toLowerCase().indexOf(q)>=0 || String(m.name||'').toLowerCase().indexOf(q)>=0 || String(m.memberId||'').toLowerCase().indexOf(q)>=0;
  }).slice(0,30);
  if(!hits.length){ box.style.display='block'; box.innerHTML='<div style="color:var(--ink3)">該当なし</div>'; return; }
  box.style.display='block';
  box.innerHTML=hits.map(function(m){ return '<div data-id="'+esc(m.id)+'">'+esc(m.nickname||m.name||m.displayId||m.id)+' <span style="color:var(--ink3);font-size:11px">'+esc(m.displayId||'')+'</span></div>'; }).join('');
  Array.prototype.forEach.call(box.querySelectorAll('div[data-id]'),function(row){ row.addEventListener('click',function(){ var id=this.getAttribute('data-id'); if(_participants.indexOf(id)<0)_participants.push(id); g('p-search').value=''; box.style.display='none'; renderChips(); }); });
}

// ── モーダル ──
function openEvent(id){
  _editId=id; g('ev-err').textContent='';
  var ev=id?events.find(function(x){return x.id===id;}):null;
  g('ev-mt').textContent=id?'イベント編集':'イベント登録';
  g('ev-del').style.display=id?'inline-block':'none';
  g('f-name').value=ev?(ev.name||''):'';
  g('f-start').value=ev?(ev.startDate||''):'';
  g('f-end').value=ev?(ev.endDate||''):'';
  g('f-loc').value=ev?(ev.location||''):'';
  g('f-desc').value=ev?(ev.description||''):'';
  g('f-top').value=ev?(ev.topPageUrl||''):'';
  g('f-pub').checked=!!(ev&&ev.published);
  _participants=(ev&&Array.isArray(ev.participantIds))?ev.participantIds.slice():[];
  _schedMap={}; if(ev&&Array.isArray(ev.schedule)) ev.schedule.forEach(function(s){ if(s&&s.date)_schedMap[s.date]={open:s.open||'',close:s.close||''}; });
  g('p-search').value=''; g('p-results').style.display='none';
  renderSched(); renderChips();
  g('ev-modal').classList.add('open');
}
function closeEvent(){ g('ev-modal').classList.remove('open'); }
g('ev-modal').addEventListener('click',function(e){ if(e.target===g('ev-modal')) closeEvent(); });

function saveEvent(){
  var name=(g('f-name').value||'').trim();
  var start=g('f-start').value, end=g('f-end').value;
  if(!name){ g('ev-err').textContent='イベント名を入力してください'; return; }
  if(!start){ g('ev-err').textContent='開始日付を入力してください'; return; }
  if(!end) end=start;
  if(end<start){ g('ev-err').textContent='終了日付は開始日付以降にしてください'; return; }
  var schedule=daysBetween(start,end).map(function(d){ var t=_schedMap[d]||{}; return {date:d, open:t.open||'', close:t.close||''}; });
  var data={
    name:name, startDate:start, endDate:end,
    schedule:schedule, location:(g('f-loc').value||'').trim(),
    description:(g('f-desc').value||'').trim(), topPageUrl:(g('f-top').value||'').trim(),
    published:!!g('f-pub').checked, participantIds:_participants.slice(),
    updatedAt:firebase.firestore.FieldValue.serverTimestamp()
  };
  var btn=g('ev-save'); btn.disabled=true;
  var p;
  if(_editId){ p=db.collection('events').doc(_editId).set(data,{merge:true}); }
  else { data.createdAt=firebase.firestore.FieldValue.serverTimestamp(); p=db.collection('events').add(data); }
  p.then(function(){ toast(_editId?'更新しました':'登録しました'); closeEvent(); load(); })
   .catch(function(e){ g('ev-err').textContent='保存失敗: '+e.message; })
   .finally(function(){ btn.disabled=false; });
}
function delEvent(){
  if(!_editId) return;
  if(!confirm('このイベントを削除しますか？（元に戻せません）')) return;
  db.collection('events').doc(_editId).delete().then(function(){ toast('削除しました'); closeEvent(); load(); })
   .catch(function(e){ g('ev-err').textContent='削除失敗: '+e.message; });
}
</script>
</body>
</html>
