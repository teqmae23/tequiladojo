<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOPアクセス解析 - テキーラ道場</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
var FIREBASE_CONFIG={
  apiKey:"AIzaSyD6a3i-N1RyXyAfXmztPQrYtx4x62YGth0",
  authDomain:"tequiladojo.firebaseapp.com",
  projectId:"tequiladojo",
  storageBucket:"tequiladojo.firebasestorage.app",
  messagingSenderId:"56663296233",
  appId:"1:56663296233:web:c8cac2fcbeb4faa09e0878",
  measurementId:"G-KMS18946JQ"
};
</script>
<script src="/auth-role.js?v=20260829"></script>
<style>
:root{
  --ink:#18110a;--ink2:#4a3820;--ink3:#9a8470;
  --gold:#c8921e;--gold-l:#e8b84a;--gold-d:#7a5610;
  --cream:#faf7f1;--cream2:#f0ebe0;--cream3:#e4ddd0;--white:#fff;
  --border:rgba(160,130,100,.18);--border2:rgba(160,130,100,.32);
  --shadow:0 1px 12px rgba(24,17,10,.07);--shadow-lg:0 6px 36px rgba(24,17,10,.13);
  --r:8px;--rl:14px;
  --serif:'Hiragino Mincho ProN','Yu Mincho',serif;
  --sans:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  --mono:'SFMono-Regular',Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--cream);color:var(--ink);min-height:100vh}
button{cursor:pointer;font-family:var(--sans)}
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
#app{display:none}
.lcard{width:100%;max-width:360px;background:var(--white);border:1px solid var(--border2);border-radius:var(--rl);padding:40px 30px;box-shadow:var(--shadow-lg)}
.llogo{text-align:center;font-size:40px;margin-bottom:6px}
.lbrand{font-family:var(--serif);font-size:22px;color:var(--gold-d);letter-spacing:.1em;text-align:center}
.lsub{text-align:center;font-size:10px;letter-spacing:.18em;color:var(--ink3);margin-bottom:24px}
.lcard label{display:block;font-size:10px;color:var(--ink3);letter-spacing:.06em;margin:12px 0 4px}
.lcard input{width:100%;padding:11px 12px;border:1px solid var(--border2);border-radius:var(--r);font-size:13px;background:var(--cream)}
.lerr{min-height:16px;font-size:12px;color:#b03020;margin-top:8px;text-align:center}
.lbtn{width:100%;margin-top:18px;padding:12px;background:var(--gold-d);color:var(--cream);border:none;border-radius:var(--r);font-size:13px}
.hdr{background:var(--ink);padding:0 16px;height:56px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:40}
.hdr-title{font-family:var(--serif);font-size:18px;color:var(--gold-l);letter-spacing:.06em}
.hdr-right{margin-left:auto;display:flex;gap:8px}
.hdr-nav{padding:6px 11px;border:1px solid rgba(255,255,255,.16);border-radius:6px;color:var(--gold-l);font-size:11px;text-decoration:none;background:none}
.wrap{max-width:920px;margin:0 auto;padding:18px 14px 60px}
.ptitle{font-family:var(--serif);font-size:20px;color:var(--ink);margin-bottom:4px}
.pdesc{font-size:12px;color:var(--ink3);margin-bottom:16px}
.kpis{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.kpi{flex:1;min-width:150px;background:var(--white);border:1px solid var(--border);border-radius:var(--rl);box-shadow:var(--shadow);padding:16px 18px}
.kpi .lbl{font-size:11px;color:var(--ink3);letter-spacing:.04em;margin-bottom:6px}
.kpi .val{font-family:var(--serif);font-size:26px;color:var(--gold-d);line-height:1}
.kpi .sub{font-size:10px;color:var(--ink3);margin-top:6px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar select{padding:8px 10px;border:1px solid var(--border2);border-radius:var(--r);font-size:13px;background:var(--white)}
.btn{border:1px solid var(--border2);border-radius:var(--r);padding:8px 14px;font-size:13px;background:var(--white);color:var(--ink2)}
.cnt{font-size:12px;color:var(--ink3);margin-left:auto}
.sec-title{font-family:var(--serif);font-size:15px;color:var(--ink2);margin:22px 0 8px}
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--rl);box-shadow:var(--shadow);overflow:hidden}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 12px;font-size:13px;border-bottom:1px solid var(--cream2)}
th{background:var(--cream2);color:var(--ink3);font-size:11px;font-weight:600;letter-spacing:.04em}
td.num{text-align:right;font-family:var(--mono);font-size:12px;color:var(--ink2)}
th.num{text-align:right}
.bar{height:8px;border-radius:4px;background:var(--gold-l);min-width:2px}
.barcell{width:34%}
.ec{text-align:center;color:var(--ink3);padding:40px 12px;font-size:13px}
.flag{font-size:15px;margin-right:6px}
</style>
</head>
<body>

<div id="login-screen">
  <div class="lcard">
    <div class="llogo">🌐</div>
    <div class="lbrand">テキーラ道場</div>
    <div class="lsub">TOPアクセス解析</div>
    <label>メールアドレス</label>
    <input type="email" id="lemail" autocomplete="username">
    <label>パスワード</label>
    <input type="password" id="lpass" autocomplete="current-password">
    <div class="lerr" id="lerr"></div>
    <button class="lbtn" id="lbtn">ログイン</button>
  </div>
</div>

<div id="app">
  <div class="hdr">
    <div class="hdr-title">🌐 TOPアクセス解析</div>
    <div class="hdr-right">
      <a class="hdr-nav" href="/tdhome.html">← ホーム</a>
      <button class="hdr-nav" id="btn-logout">ログアウト</button>
    </div>
  </div>
  <div class="wrap">
    <div class="ptitle">TOPページ アクセス解析</div>
    <div class="pdesc">トップページの訪問記録（IPはハッシュ化して保存）。同じ日・同じ訪問元は1ユニークとして数え、再訪はヒット数として加算します。直近の記録を集計しています。</div>

    <div class="toolbar">
      <select id="f-page">
        <option value="top" selected>公開TOP（index）</option>
        <option value="member">会員TOP（会員ページ）</option>
      </select>
      <select id="f-range">
        <option value="7">直近7日</option>
        <option value="30" selected>直近30日</option>
        <option value="90">直近90日</option>
        <option value="0">全期間</option>
      </select>
      <button class="btn" id="btn-reload">↻ 再読み込み</button>
      <span class="cnt" id="cnt"></span>
    </div>

    <div class="kpis" id="kpis"></div>

    <div class="sec-title">日別</div>
    <div class="card">
      <table>
        <thead><tr><th>日付</th><th class="num" style="width:120px">ユニーク</th><th class="num" style="width:120px">ヒット</th></tr></thead>
        <tbody id="tb-day"><tr><td colspan="3" class="ec">読み込み中…</td></tr></tbody>
      </table>
    </div>

    <div class="sec-title">国別</div>
    <div class="card">
      <table>
        <thead><tr><th>国</th><th class="num" style="width:110px">ユニーク</th><th class="num" style="width:100px">ヒット</th><th class="barcell"></th></tr></thead>
        <tbody id="tb-country"><tr><td colspan="4" class="ec">読み込み中…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script>
firebase.initializeApp(FIREBASE_CONFIG);
var auth=firebase.auth(), db=firebase.firestore();
function g(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function nf(n){return (n||0).toLocaleString('ja-JP');}
// 国コード(ISO2)→国旗絵文字
function flag(cc){
  cc=String(cc||'').toUpperCase();
  if(!/^[A-Z]{2}$/.test(cc)) return '';
  return String.fromCodePoint(0x1F1E6+cc.charCodeAt(0)-65)+String.fromCodePoint(0x1F1E6+cc.charCodeAt(1)-65);
}

var rows=[];

AuthRole.requireStaff(auth, function(user, role){
  g('login-screen').style.display='none';
  g('app').style.display='block';
  init();
}, function(){
  g('login-screen').style.display='flex';
  g('app').style.display='none';
});
g('lbtn').addEventListener('click',function(){
  auth.signInWithEmailAndPassword((g('lemail').value||'').trim(), g('lpass').value).catch(function(e){ g('lerr').textContent=e.message; });
});
g('lpass').addEventListener('keydown',function(e){ if(e.key==='Enter') g('lbtn').click(); });
g('btn-logout').addEventListener('click',function(){ auth.signOut(); });

var _inited=false;
function init(){
  if(_inited){ load(); return; }   // 認証イベントが複数回発火しても初期化は1回だけ
  _inited=true;
  g('f-range').addEventListener('change',render);
  g('f-page').addEventListener('change',render);
  g('btn-reload').addEventListener('click',load);
  load();
}

function load(){
  g('tb-day').innerHTML='<tr><td colspan="3" class="ec">読み込み中…</td></tr>';
  g('tb-country').innerHTML='<tr><td colspan="4" class="ec">読み込み中…</td></tr>';
  // 直近の記録を集計（ドキュメント= 日×訪問元の単位）。lastAt降順で最大3000件。
  db.collection('topAccessLogs').orderBy('lastAt','desc').limit(3000).get().then(function(snap){
    rows=snap.docs.map(function(d){ return d.data()||{}; });
    render();
  }).catch(function(e){
    g('tb-day').innerHTML='<tr><td colspan="3" class="ec">読み込み失敗: '+esc(e.message)+'</td></tr>';
    g('tb-country').innerHTML='';
  });
}

function cutoffDay(days){
  if(!days) return '';
  var d=new Date(Date.now()+9*3600*1000 - days*86400*1000); // JST基準
  var p=function(n){return String(n).padStart(2,'0');};
  return d.getUTCFullYear()+'-'+p(d.getUTCMonth()+1)+'-'+p(d.getUTCDate());
}

function render(){
  var days=parseInt(g('f-range').value,10)||0;
  var cut=cutoffDay(days);
  var page=g('f-page').value||'top';
  // page 未設定の旧レコードは公開TOP扱い
  var list=rows.filter(function(r){ return (!cut || String(r.day||'')>=cut) && (String(r.page||'top')===page); });

  var totalUniq=list.length, totalHits=0;
  var byDay={}, byCountry={};
  list.forEach(function(r){
    var h=Number(r.hits)||0; totalHits+=h;
    var dk=r.day||'—';
    if(!byDay[dk]) byDay[dk]={uniq:0,hits:0};
    byDay[dk].uniq++; byDay[dk].hits+=h;
    var ckey=(r.country||'')||'（不明）';
    if(!byCountry[ckey]) byCountry[ckey]={uniq:0,hits:0,code:r.countryCode||''};
    byCountry[ckey].uniq++; byCountry[ckey].hits+=h;
    if(!byCountry[ckey].code && r.countryCode) byCountry[ckey].code=r.countryCode;
  });

  g('cnt').textContent=list.length+' レコード';

  // KPI
  g('kpis').innerHTML=
    '<div class="kpi"><div class="lbl">ユニーク訪問</div><div class="val">'+nf(totalUniq)+'</div><div class="sub">'+(days?('直近'+days+'日'):'全期間')+'（日×訪問元）</div></div>'
    +'<div class="kpi"><div class="lbl">総ヒット</div><div class="val">'+nf(totalHits)+'</div><div class="sub">再訪を含む延べ表示回数</div></div>'
    +'<div class="kpi"><div class="lbl">国・地域</div><div class="val">'+nf(Object.keys(byCountry).length)+'</div><div class="sub">記録された国の数</div></div>';

  // 日別（新しい順）
  var dayKeys=Object.keys(byDay).sort().reverse();
  if(!dayKeys.length){ g('tb-day').innerHTML='<tr><td colspan="3" class="ec">記録がありません</td></tr>'; }
  else{
    g('tb-day').innerHTML=dayKeys.map(function(k){
      return '<tr><td class="mono">'+esc(k)+'</td><td class="num">'+nf(byDay[k].uniq)+'</td><td class="num">'+nf(byDay[k].hits)+'</td></tr>';
    }).join('');
  }

  // 国別（ユニーク降順）
  var cKeys=Object.keys(byCountry).sort(function(a,b){ return byCountry[b].uniq-byCountry[a].uniq; });
  var maxU=cKeys.length?byCountry[cKeys[0]].uniq:1;
  if(!cKeys.length){ g('tb-country').innerHTML='<tr><td colspan="4" class="ec">記録がありません</td></tr>'; }
  else{
    g('tb-country').innerHTML=cKeys.map(function(k){
      var c=byCountry[k];
      var pct=maxU?Math.round(c.uniq/maxU*100):0;
      var fl=flag(c.code);
      return '<tr>'
        +'<td>'+(fl?'<span class="flag">'+fl+'</span>':'')+esc(k)+'</td>'
        +'<td class="num">'+nf(c.uniq)+'</td>'
        +'<td class="num">'+nf(c.hits)+'</td>'
        +'<td class="barcell"><div class="bar" style="width:'+pct+'%"></div></td>'
        +'</tr>';
    }).join('');
  }
}
</script>
</body>
</html>
