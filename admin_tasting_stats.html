<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#18110a;--ink2:#3a2c14;--ink3:#6b5a44;
  --gold:#c8921e;--gold-l:#e8b84a;--gold-d:#7a5610;
  --teal:#1a6e58;--teal-l:#e0f0eb;
  --red:#8c2818;--red-l:#fae8e4;
  --cream:#faf7f1;--cream2:#f0ebe0;--cream3:#e4ddd0;--white:#fff;
  --border:rgba(160,130,100,.18);--border2:rgba(160,130,100,.32);
  --r:6px;--rl:12px;
  --sans:'Noto Sans JP',sans-serif;--mono:'DM Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px}
body{font-family:var(--sans);background:var(--cream);color:var(--ink);min-height:100vh}
button{cursor:pointer;font-family:var(--sans)}
input,select{font-family:var(--sans)}
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center}
.lcard{width:100%;max-width:380px;background:var(--white);border:1px solid var(--border2);border-radius:var(--rl);padding:40px 34px;box-shadow:0 6px 36px rgba(24,17,10,.13)}
.llogo{text-align:center;font-size:40px}
.lbrand{font-size:22px;font-weight:700;color:var(--gold-d);text-align:center;letter-spacing:.1em;margin:4px 0}
.lsub{text-align:center;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);margin-bottom:26px}
.lcard label{display:block;font-size:10px;color:var(--ink3);letter-spacing:.08em;text-transform:uppercase;margin:12px 0 5px}
.lcard input{width:100%;padding:11px 13px;border:1px solid var(--border2);border-radius:var(--r);font-size:13px;background:var(--cream)}
.lerr{min-height:16px;font-size:12px;color:var(--red);margin-top:8px;text-align:center}
.lbtn{width:100%;margin-top:20px;padding:13px;background:var(--gold-d);color:var(--cream);border:none;border-radius:var(--r);font-size:13px;font-weight:500}
#app{display:none}
.topbar{background:var(--ink);color:var(--cream);padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:30}
.tbrand{font-weight:700;letter-spacing:.06em}
.topbar a,.topbar .tbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.85);padding:5px 12px;border-radius:var(--r);font-size:12px;text-decoration:none;white-space:nowrap}
.topbar .sp{flex:1}
.wrap{padding:14px;max-width:1000px;margin:0 auto}
.hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.hd h1{font-size:17px;font-weight:700;color:var(--gold-d)}
.hd .sub{font-size:12px;color:var(--ink3)}
.note{font-size:11px;color:var(--ink3);margin:6px 0 10px;line-height:1.7}
.filters{background:var(--white);border:1px solid var(--border2);border-radius:var(--rl);padding:10px 12px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end}
.fg{display:flex;flex-direction:column;gap:3px}
.fg .lbl{font-size:10px;color:var(--ink3);letter-spacing:.04em;font-weight:700}
.fg input,.fg select{padding:6px 8px;border:1px solid var(--border2);border-radius:var(--r);font-size:12px;background:var(--cream);font-family:var(--sans)}
.fg input[type=date]{width:130px}
.bjrax{display:flex;gap:3px}
.bjrax .cb{display:inline-flex;align-items:center;gap:3px;border:1px solid var(--border2);border-radius:14px;padding:3px 8px;font-size:11px;font-weight:700;cursor:pointer;background:var(--cream);user-select:none}
.bjrax .cb.on{background:var(--gold-d);color:#fff;border-color:var(--gold-d)}
.btn{border:1px solid var(--border2);background:var(--white);color:var(--ink2);border-radius:var(--r);font-size:12px;font-weight:600;padding:6px 12px}
.btn.p{background:var(--gold-d);color:#fff;border-color:var(--gold-d)}
.summary{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.chip{background:var(--white);border:1px solid var(--border);border-radius:var(--rl);padding:10px 14px;min-width:110px}
.chip .k{font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.chip .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.chip .v.s{color:var(--gold-d)}
.chip .v.o{color:var(--teal)}
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:var(--rl);background:var(--white)}
table.rk{border-collapse:collapse;width:100%;font-size:13px;min-width:720px}
table.rk th,table.rk td{border-bottom:1px solid var(--border);padding:8px 10px;text-align:right;white-space:nowrap}
table.rk th{background:var(--cream2);font-size:11px;color:var(--ink2);font-weight:700;position:sticky;top:0}
table.rk td.l,table.rk th.l{text-align:left}
table.rk tr:hover td{background:var(--cream)}
.rank{font-weight:700;color:var(--gold-d);width:34px}
.tq{font-weight:700}
.tq-sub{font-size:10px;color:var(--ink3);font-weight:400}
.cls{display:inline-block;font-size:10px;font-weight:700;border-radius:8px;padding:1px 6px;background:var(--cream2);color:var(--ink2);margin-right:4px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.st{color:var(--gold-d);font-weight:700}
.so{color:var(--teal);font-weight:700}
.empty{padding:28px;text-align:center;color:var(--ink3);font-size:13px}
#toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:6px}
.toast{background:var(--ink);color:#fff;padding:8px 16px;border-radius:var(--r);font-size:12px;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.toast.terr{background:var(--red)}
</style>
</head>
<body>

<div id="login-screen">
  <div class="lcard">
    <div class="llogo">📊</div>
    <div class="lbrand">テキーラ道場</div>
    <div class="lsub">Tasting Analytics</div>
    <label>メールアドレス</label>
    <input type="email" id="lemail" placeholder="owner@example.com">
    <label>パスワード</label>
    <input type="password" id="lpass" placeholder="••••••••">
    <div class="lerr" id="lerr"></div>
    <button class="lbtn" id="lbtn">ログイン</button>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="tbrand">📊 試飲分析</div>
    <a href="admin_treats.html">🥃 奢り管理</a>
    <a href="tdhome.html">🏠 管理TOP</a>
    <div class="sp"></div>
    <button class="tbtn" id="btn-logout">ログアウト</button>
  </div>
  <div class="wrap">
    <div class="hd">
      <h1>試飲ランキング</h1>
      <span class="sub" id="sub"></span>
    </div>
    <div class="note">オンライン奢り（試飲）の記録を、<b>ストレート／ソーダ割り</b>に分けて銘柄ごとに集計します。クラス(BJRAX)・度数(通常/HP)・会員ID・期間で抽出できます。<br>※ソーダ割りは30ml固定・ストレートは選択ml。度数はHP=41%以上・通常=40%以下。</div>

    <div class="filters">
      <div class="fg"><span class="lbl">期間（注文日）</span><div style="display:flex;gap:4px;align-items:center"><input type="date" id="f-from"><span style="font-size:11px;color:var(--ink3)">〜</span><input type="date" id="f-to"></div></div>
      <div class="fg"><span class="lbl">状態</span>
        <select id="f-status">
          <option value="valid">有効（承認待ち以降）</option>
          <option value="served">提供済みのみ</option>
          <option value="all">全件（キャンセル含む）</option>
        </select>
      </div>
      <div class="fg"><span class="lbl">クラス（BJRAX）</span>
        <div class="bjrax" id="f-bjrax">
          <span class="cb on" data-c="B">B</span><span class="cb on" data-c="J">J</span><span class="cb on" data-c="R">R</span><span class="cb on" data-c="A">A</span><span class="cb on" data-c="X">X</span>
        </div>
      </div>
      <div class="fg"><span class="lbl">度数</span>
        <select id="f-abv"><option value="all">全件</option><option value="normal">通常(≤40%)</option><option value="hp">HP(≥41%)</option></select>
      </div>
      <div class="fg"><span class="lbl">会員ID（注文者）</span><input type="text" id="f-member" placeholder="例: 260018 / 部分可"></div>
      <div class="fg"><span class="lbl">スタイル</span>
        <select id="f-style"><option value="all">両方</option><option value="straight">ストレートのみ</option><option value="soda">ソーダ割りのみ</option></select>
      </div>
      <div class="fg"><span class="lbl">並び替え</span>
        <select id="f-metric"><option value="count">杯数</option><option value="ml">総量(ml)</option><option value="amount">金額</option></select>
      </div>
      <div class="fg"><span class="lbl">&nbsp;</span><button class="btn" id="btn-reload">🔄 再読込</button></div>
    </div>

    <div class="summary" id="summary"></div>
    <div class="tw"><table class="rk" id="tbl">
      <thead><tr>
        <th class="l">#</th><th class="l">テキーラ</th>
        <th>合計</th><th>ストレート</th><th>ソーダ割り</th>
        <th>総量(ml)</th><th>金額(テキーラ)</th><th>会員数</th>
      </tr></thead>
      <tbody id="rows"><tr><td colspan="8" class="empty">読込中…</td></tr></tbody>
    </table></div>
  </div>
</div>

<div id="toasts"></div>

<script>
if (!firebase.apps.length) { firebase.initializeApp(FIREBASE_CONFIG); }
var auth = firebase.auth();
var db   = firebase.firestore();
function g(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(msg,type){ var el=document.createElement('div'); el.className='toast'+(type==='err'?' terr':''); el.textContent=msg; g('toasts').appendChild(el); setTimeout(function(){el.remove();},2600); }
function yen(n){ return '¥'+Number(n||0).toLocaleString(); }
var BJRAX_MAP={'1':'B','2':'J','3':'R','4':'A','5':'X'};

var _treats=[];        // onlineTreats 全件
var _bottles={};       // baseBottleId → bottleData（classId/abv 用）

// ボトルのクラス文字（BJRAX）: classId[1] 優先、無ければ bottleId 9桁目
function classLetter(id, b){
  var c='';
  if(b&&b.classId!=null&&b.classId!==''){ var s=String(b.classId); c=s.length>=2?s.charAt(1):s; }
  else { var s2=String(id||''); c=s2.length>=9?s2.charAt(8):''; }
  return BJRAX_MAP[c]||'?';
}
function abvOf(b){ var v=b?parseFloat(b.abv):NaN; return isNaN(v)?null:v; }

function tsMs(t){ if(t.createdAt&&t.createdAt.seconds) return t.createdAt.seconds*1000; if(t.createdAt&&t.createdAt.toDate) return t.createdAt.toDate().getTime(); return 0; }
function dateStr(ms){ if(!ms) return ''; var d=new Date(ms); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }

function load(){
  g('rows').innerHTML='<tr><td colspan="8" class="empty">読込中…</td></tr>';
  db.collection('onlineTreats').get().then(function(snap){
    _treats=snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    // 対象ボトルの classId/abv を取得（10件ずつ documentId in）
    var seen={}, ids=[]; _treats.forEach(function(t){ var k=t.baseBottleId||t.baseProductCode; if(k&&!seen[k]){ seen[k]=1; ids.push(k); } });
    var chunks=[]; for(var i=0;i<ids.length;i+=10) chunks.push(ids.slice(i,i+10));
    return Promise.all(chunks.map(function(ck){
      return db.collection('bottleData').where(firebase.firestore.FieldPath.documentId(),'in',ck).get()
        .then(function(s){ s.docs.forEach(function(d){ _bottles[d.id]=d.data(); }); })
        .catch(function(){});
    })).then(render);
  }).catch(function(e){ g('rows').innerHTML='<tr><td colspan="8" class="empty">読み込みに失敗しました: '+esc(e.message)+'</td></tr>'; });
}

function activeClasses(){
  var s={}; Array.prototype.forEach.call(g('f-bjrax').querySelectorAll('.cb'),function(el){ if(el.classList.contains('on')) s[el.getAttribute('data-c')]=1; }); return s;
}
function statusPass(st, mode){
  st=st||'';
  if(mode==='all') return true;
  if(mode==='served') return st==='served';
  // valid: キャンセル・決済前を除く（paid/approved/served）
  return st==='paid'||st==='approved'||st==='served';
}

function render(){
  var statusMode=g('f-status').value;
  var abvMode=g('f-abv').value;
  var styleMode=g('f-style').value;
  var cls=activeClasses();
  var allCls=(Object.keys(cls).length===5);
  var member=(g('f-member').value||'').trim();
  var from=g('f-from').value, to=g('f-to').value;
  var metric=g('f-metric').value;

  var agg={}; // key(baseBottleId) → {name,nom,id,cls,abv, cS,cO, mlS,mlO, amtS,amtO, members:Set}
  var tot={cS:0,cO:0,ml:0,amt:0, members:{}};
  var nMatched=0;

  _treats.forEach(function(t){
    if(!statusPass(t.status, statusMode)) return;
    if(member && String(t.fromMemberId||'').indexOf(member)<0) return;
    var ms=tsMs(t), ds=dateStr(ms);
    if(from && ds && ds<from) return;
    if(to && ds && ds>to) return;
    var key=t.baseBottleId||t.baseProductCode||t.baseName||'?';
    var b=_bottles[key];
    var cl=classLetter(key,b);
    var abv=abvOf(b);
    // BJRAX フィルタ（全選択時はスキップ）
    if(!allCls && !cls[cl]) return;
    // 度数フィルタ
    if(abvMode==='normal' && !(abv!=null&&abv<=40)) return;
    if(abvMode==='hp' && !(abv!=null&&abv>=41)) return;
    var isSoda=(t.soda===true||t.style==='soda');
    if(styleMode==='straight' && isSoda) return;
    if(styleMode==='soda' && !isSoda) return;

    var a=agg[key]||(agg[key]={ id:key, name:t.baseName||key, nom:t.nom||'', cls:cl, abv:abv, cS:0,cO:0, mlS:0,mlO:0, amtS:0,amtO:0, members:{} });
    var ml=Number(t.ml)||0, amt=Number(t.tequilaAmount!=null?t.tequilaAmount:t.amount)||0;
    if(isSoda){ a.cO++; a.mlO+=ml; a.amtO+=amt; tot.cO++; } else { a.cS++; a.mlS+=ml; a.amtS+=amt; tot.cS++; }
    if(t.fromMemberId){ a.members[t.fromMemberId]=1; tot.members[t.fromMemberId]=1; }
    tot.ml+=ml; tot.amt+=amt; nMatched++;
  });

  var rows=Object.keys(agg).map(function(k){ var a=agg[k]; a.cnt=a.cS+a.cO; a.ml=a.mlS+a.mlO; a.amt=a.amtS+a.amtO; a.nMem=Object.keys(a.members).length; return a; });
  rows.sort(function(x,y){
    if(metric==='ml') return y.ml-x.ml;
    if(metric==='amount') return y.amt-x.amt;
    return (y.cnt-x.cnt)||(y.ml-x.ml);
  });

  // サマリ
  g('summary').innerHTML=
    '<div class="chip"><div class="k">試飲 合計</div><div class="v">'+(tot.cS+tot.cO)+'<span style="font-size:12px"> 杯</span></div></div>'+
    '<div class="chip"><div class="k">ストレート</div><div class="v s">'+tot.cS+'<span style="font-size:12px"> 杯</span></div></div>'+
    '<div class="chip"><div class="k">ソーダ割り</div><div class="v o">'+tot.cO+'<span style="font-size:12px"> 杯</span></div></div>'+
    '<div class="chip"><div class="k">総量</div><div class="v">'+tot.ml.toLocaleString()+'<span style="font-size:12px"> ml</span></div></div>'+
    '<div class="chip"><div class="k">金額(テキーラ)</div><div class="v">'+yen(tot.amt)+'</div></div>'+
    '<div class="chip"><div class="k">銘柄数 / 会員数</div><div class="v">'+rows.length+' / '+Object.keys(tot.members).length+'</div></div>';

  g('sub').textContent='対象 '+nMatched+' 件';

  if(!rows.length){ g('rows').innerHTML='<tr><td colspan="8" class="empty">該当する試飲記録がありません</td></tr>'; return; }
  g('rows').innerHTML=rows.map(function(a,i){
    return '<tr>'+
      '<td class="l rank">'+(i+1)+'</td>'+
      '<td class="l"><span class="cls">'+esc(a.cls)+'</span><span class="tq">'+esc(a.name)+'</span>'+(a.nom?' <span class="tq-sub">NOM '+esc(a.nom)+'</span>':'')+(a.abv!=null?' <span class="tq-sub">'+a.abv+'%</span>':'')+'</td>'+
      '<td class="mono"><b>'+a.cnt+'</b></td>'+
      '<td class="mono st">'+a.cS+'</td>'+
      '<td class="mono so">'+a.cO+'</td>'+
      '<td class="mono">'+a.ml.toLocaleString()+'</td>'+
      '<td class="mono">'+yen(a.amt)+'</td>'+
      '<td class="mono">'+a.nMem+'</td>'+
    '</tr>';
  }).join('');
}

/* ── フィルタ操作 ── */
g('f-bjrax').addEventListener('click',function(e){ var cb=e.target.closest('.cb'); if(cb){ cb.classList.toggle('on'); render(); } });
['f-status','f-abv','f-style','f-metric'].forEach(function(id){ g(id).addEventListener('change',render); });
['f-from','f-to'].forEach(function(id){ g(id).addEventListener('change',render); });
g('f-member').addEventListener('input',render);
g('btn-reload').addEventListener('click',load);

/* ── 認証 ── */
AuthRole.requireStaff(auth, function(user){
  g('login-screen').style.display='none';
  g('app').style.display='block';
  load();
});
g('lbtn').addEventListener('click',function(){
  var email=(g('lemail').value||'').trim(), pass=g('lpass').value;
  g('lerr').textContent='';
  if(!email||!pass){ g('lerr').textContent='メールアドレスとパスワードを入力してください'; return; }
  g('lbtn').textContent='ログイン中...';
  auth.signInWithEmailAndPassword(email,pass).then(function(){ g('lbtn').textContent='ログイン'; })
    .catch(function(e){ g('lerr').textContent='ログイン失敗: '+e.message; g('lbtn').textContent='ログイン'; });
});
g('lpass').addEventListener('keydown',function(e){ if(e.key==='Enter') g('lbtn').click(); });
g('btn-logout').addEventListener('click',function(){ auth.signOut(); });
</script>
</body>
</html>
