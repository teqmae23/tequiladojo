<style>
:root{
  --ink:#18110a;--ink2:#3a2c14;--ink3:#6b5a44;
  --gold:#c8921e;--gold-l:#e8b84a;--gold-d:#7a5610;
  --teal:#1a6e58;--teal-l:#e0f0eb;
  --red:#8c2818;--red-l:#fae8e4;
  --cream:#faf7f1;--cream2:#f0ebe0;--cream3:#e4ddd0;--white:#fff;
  --border:rgba(160,130,100,.18);--border2:rgba(160,130,100,.32);
  --r:6px;--rl:12px;
  --sans:'Noto Sans JP',sans-serif;--mono:'DM Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px}
body{font-family:var(--sans);background:var(--cream);color:var(--ink);min-height:100vh}
button{cursor:pointer;font-family:var(--sans)}
input,select{font-family:var(--sans)}
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center}
.lcard{width:100%;max-width:380px;background:var(--white);border:1px solid var(--border2);border-radius:var(--rl);padding:40px 34px;box-shadow:0 6px 36px rgba(24,17,10,.13)}
.llogo{text-align:center;font-size:40px}
.lbrand{font-size:22px;font-weight:700;color:var(--gold-d);text-align:center;letter-spacing:.1em;margin:4px 0}
.lsub{text-align:center;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);margin-bottom:26px}
.lcard label{display:block;font-size:10px;color:var(--ink3);letter-spacing:.08em;text-transform:uppercase;margin:12px 0 5px}
.lcard input{width:100%;padding:11px 13px;border:1px solid var(--border2);border-radius:var(--r);font-size:13px;background:var(--cream)}
.lerr{min-height:16px;font-size:12px;color:var(--red);margin-top:8px;text-align:center}
.lbtn{width:100%;margin-top:20px;padding:13px;background:var(--gold-d);color:var(--cream);border:none;border-radius:var(--r);font-size:13px;font-weight:500}
#app{display:none}
.topbar{background:var(--ink);color:var(--cream);padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:30}
.tbrand{font-weight:700;letter-spacing:.06em}
.topbar a,.topbar .tbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.85);padding:5px 12px;border-radius:var(--r);font-size:12px;text-decoration:none;white-space:nowrap}
.topbar .sp{flex:1}
.save-ind{font-size:11px;color:rgba(255,255,255,.65)}
.wrap{padding:14px}
.hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.hd h1{font-size:17px;font-weight:700;color:var(--gold-d)}
.hd .legend{font-size:11px;color:var(--ink3)}
.btn{border:1px solid var(--border2);background:var(--white);color:var(--ink2);border-radius:var(--r);font-size:12px;font-weight:600;padding:6px 12px}
.btn.p{background:var(--gold-d);color:#fff;border-color:var(--gold-d)}
.btn.sm{padding:3px 8px;font-size:11px}
.note{font-size:11px;color:var(--ink3);margin:8px 0;line-height:1.7}
.gridwrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r);background:var(--white)}
table.bg{border-collapse:separate;border-spacing:0;font-size:12px;min-width:max-content}
table.bg th,table.bg td{border:1px solid var(--border);padding:4px 6px;vertical-align:middle;text-align:center}
table.bg thead th{position:sticky;top:48px;background:var(--cream2);z-index:10;font-weight:700}
.col-h{position:sticky;left:0;background:var(--cream2);z-index:5;min-width:78px;text-align:left;font-weight:700;white-space:nowrap}
thead .col-h{z-index:15}
.pname{width:88px;border:1px solid var(--border2);border-radius:5px;padding:4px 5px;font-size:12px;font-weight:700;text-align:center;background:var(--white)}
.px{border:none;background:none;color:var(--red);font-size:11px;margin-left:2px}
tr.sec td{color:var(--cream);text-align:left;font-weight:700;letter-spacing:.04em;position:sticky;left:0}
tr.sec.place td{background:#2a2114}
tr.sec.flight td{background:#1b3a30}
tr.sec .tlname{background:transparent;border:none;color:var(--cream);font-weight:700;font-size:12px;width:150px;border-bottom:1px dashed rgba(255,255,255,.3)}
tr.sec .rowctl{float:right;display:flex;gap:4px}
tr.sec .rowctl button{background:rgba(255,255,255,.14);border:none;color:#fff;border-radius:4px;font-size:11px;width:22px;height:20px;line-height:1}
.tier{font-size:10.5px;color:var(--ink3);font-weight:700}
.bagcell{min-width:116px}
.bagcell .ln{display:flex;align-items:center;justify-content:center;gap:3px;white-space:nowrap;line-height:1.7}
.ni{width:34px;border:1px solid var(--border2);border-radius:4px;padding:2px 3px;font-size:12px;text-align:center;font-family:var(--mono)}
.ni.kg{width:46px}
.ni.neg{color:var(--red)}
.unit{font-size:10px;color:var(--ink3)}
.disp{font-weight:700}
.tot{font-size:10.5px;color:var(--teal);font-weight:700}
.pbrow td{background:var(--teal-l)}
.initrow td{background:#fbf6ea}
.flightrow td{background:#eef5f1}
.warn{color:var(--red);font-weight:700;font-size:11px}
.ok{color:var(--teal);font-weight:700;font-size:11px}
.flim{display:flex;align-items:center;justify-content:center;gap:3px;white-space:nowrap}
.empty{padding:28px;text-align:center;color:var(--ink3);font-size:13px}
.addbar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
#toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:6px}
.toast{background:var(--ink);color:#fff;padding:8px 16px;border-radius:var(--r);font-size:12px;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.toast.terr{background:var(--red)}
</style>

<body>

<div id="login-screen">
  <div class="lcard">
    <div class="llogo">🧳</div>
    <div class="lbrand">テキーラ道場</div>

    <input type="email" id="lemail" placeholder="owner@example.com">

    <button class="lbtn" id="lbtn">ログイン</button>

</div>

<div id="app">
  <div class="topbar">
    <div class="tbrand">🧳 スーツケース管理</div>
    <a href="admin_events.html">← イベント管理</a>
    <div class="sp"></div>
    <span class="save-ind" id="save-ind"></span>
    <button class="tbtn" id="btn-logout">ログアウト</button>
  </div>
  <div class="wrap">
    <div class="hd">
      <h1 id="plan-title">スーツケース管理</h1>
      <div class="legend">📦 通常荷物(kg) ／ 🍾 ボトル(1本1.8kg・SC1個に12本) ／ 🧳 スーツケース</div>
      <div style="flex:1"></div>
      <button class="btn" id="btn-reseed">スケジュールから再生成</button>
      <button class="btn p" id="btn-save">保存</button>
    </div>
    <div class="note">各「場所」は 3段（<b>最初</b>＝到着時／<b>増減</b>＝ここでの積み下ろし・±可／<b>搭乗前</b>＝次便に載せる状態）。搭乗前は次の場所の「最初」に自動で引き継がれます。空路行では各自のスーツケース個数×1個あたり重量制限を設定し、搭乗前荷物が超過すると⚠️表示します。</div>
    <div class="gridwrap" id="grid"></div>
    <div class="addbar">
      <button class="btn sm" onclick="addParticipant()">＋ 参加者</button>
      <button class="btn sm" onclick="addRow('place')">＋ 場所</button>
      <button class="btn sm" onclick="addRow('flight')">＋ 空路</button>
    </div>
  </div>
</div>

<div id="toasts"></div>

<script>
if (!firebase.apps.length) { firebase.initializeApp(FIREBASE_CONFIG); }
var auth = firebase.auth();
var db   = firebase.firestore();
function g(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(msg,type){ var el=document.createElement('div'); el.className='toast'+(type==='err'?' terr':''); el.textContent=msg; g('toasts').appendChild(el); setTimeout(function(){el.remove();},2600); }
function r1(n){ return Math.round((+n||0)*10)/10; }
function num(v){ v=(''+(v==null?'':v)).trim(); if(v==='') return 0; var n=parseFloat(v); return isNaN(n)?0:n; }
function niTxt(v){ return (v===0||v==null)?'':v; }
function uid(){ return 'b'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
var BOTTLE_KG=1.8, SC_BOTTLES=12;
var EV=(new URLSearchParams(location.search).get('ev'))||'';

var plan={ name:'', participants:[], timeline:[], place:{}, flight:{} };
var comp={}, _ev={};

function bagWeight(kg,btl){ return r1((+kg||0)+(+btl||0)*BOTTLE_KG); }

function compute(){
  comp={}; var prevPb=null;
  plan.timeline.forEach(function(e){
    if(e.type!=='place') return;
    comp[e.id]={};
    plan.participants.forEach(function(pt){
      var cell=(plan.place[e.id]&&plan.place[e.id][pt.id])||{};
      var init = (prevPb===null) ? {sc:+cell.initSc||0,kg:r1(cell.initKg),btl:+cell.initBtl||0}
                                 : {sc:prevPb[pt.id].sc,kg:prevPb[pt.id].kg,btl:prevPb[pt.id].btl};
      var pb={sc:init.sc+(+cell.dSc||0),kg:r1(init.kg+(+cell.dKg||0)),btl:init.btl+(+cell.dBtl||0)};
      comp[e.id][pt.id]={init:init,pb:pb,first:(prevPb===null)};
    });
    prevPb={}; plan.participants.forEach(function(pt){ prevPb[pt.id]=comp[e.id][pt.id].pb; });
  });
}
function prevPlaceId(flightArrIdx){ for(var k=flightArrIdx-1;k>=0;k--){ if(plan.timeline[k].type==='place') return plan.timeline[k].id; } return null; }

function bagInputs(rowId,pid,prefix){
  var cell=(plan.place[rowId]&&plan.place[rowId][pid])||{};
  var sc=cell[prefix+'Sc'], kg=cell[prefix+'Kg'], btl=cell[prefix+'Btl'];
  var neg=(prefix==='d')?' neg':'';
  return '<div class="ln">🧳<input class="ni'+neg+'" type="number" step="1" value="'+esc(niTxt(sc))+'" onchange="setPlace(\''+rowId+'\',\''+pid+'\',\''+prefix+'Sc\',this.value)"></div>'
       +'<div class="ln">📦<input class="ni kg'+neg+'" type="number" step="0.1" value="'+esc(niTxt(kg))+'" onchange="setPlace(\''+rowId+'\',\''+pid+'\',\''+prefix+'Kg\',this.value)"><span class="unit">kg</span></div>'
       +'<div class="ln">🍾<input class="ni'+neg+'" type="number" step="1" value="'+esc(niTxt(btl))+'" onchange="setPlace(\''+rowId+'\',\''+pid+'\',\''+prefix+'Btl\',this.value)"><span class="unit">本</span></div>';
}
function bagDisp(b){
  return '<div class="ln disp">🧳'+b.sc+'　📦'+r1(b.kg)+'<span class="unit">kg</span>　🍾'+b.btl+'<span class="unit">本</span></div>'
       +'<div class="tot">計 '+bagWeight(b.kg,b.btl)+' kg</div>';
}
function flightJudge(fRowId,pid,srcId,fc){
  if(!srcId||!comp[srcId]||!comp[srcId][pid]) return '<div class="tier">（手前に場所がありません）</div>';
  var pb=comp[srcId][pid].pb;
  var sc=+fc.sc||0, lim=+fc.limKg||0;
  var w=bagWeight(pb.kg,pb.btl);
  if(!sc||!lim) return '<div class="tier">荷重 '+w+'kg ／ 🍾'+pb.btl+'本（制限未設定）</div>';
  var cap=r1(sc*lim), btlCap=sc*SC_BOTTLES, over=false, msgs=[];
  if(w>cap){ over=true; msgs.push('⚠️ 重量 '+w+'/'+cap+'kg（'+r1(w-cap)+'kg超過）'); } else msgs.push('重量 '+w+'/'+cap+'kg');
  if(pb.btl>btlCap){ over=true; msgs.push('⚠️ ボトル '+pb.btl+'/'+btlCap+'本（SC不足）'); } else msgs.push('🍾'+pb.btl+'/'+btlCap+'本');
  return '<div class="'+(over?'warn':'ok')+'">'+msgs.join('<br>')+'</div>';
}

function render(){
  compute();
  g('plan-title').textContent=(_ev.name?('🧳 '+_ev.name):'スーツケース管理');
  var P=plan.participants;
  if(!P.length || !plan.timeline.length){
    g('grid').innerHTML='<div class="empty">参加者またはタイムラインがありません。<br>下の「＋参加者」「＋場所」「＋空路」か「スケジュールから再生成」で作成してください。</div>';
    return;
  }
  var h='<table class="bg"><thead><tr><th class="col-h">項目</th>';
  P.forEach(function(pt){ h+='<th><input class="pname" value="'+esc(pt.name)+'" onchange="setPName(\''+pt.id+'\',this.value)"><button class="px" title="参加者を削除" onclick="removeParticipant(\''+pt.id+'\')">✕</button></th>'; });
  h+='</tr></thead><tbody>';
  plan.timeline.forEach(function(e,idx){
    var ctl='<span class="rowctl"><button title="上へ" onclick="moveRow(\''+e.id+'\',-1)">↑</button><button title="下へ" onclick="moveRow(\''+e.id+'\',1)">↓</button><button title="削除" onclick="removeRow(\''+e.id+'\')">✕</button></span>';
    if(e.type==='place'){
      h+='<tr class="sec place"><td colspan="'+(P.length+1)+'">📍 <input class="tlname" value="'+esc(e.name)+'" onchange="setTLName(\''+e.id+'\',this.value)">'+ctl+'</td></tr>';
      var first=comp[e.id]&&comp[e.id][P[0].id]&&comp[e.id][P[0].id].first;
      h+='<tr class="initrow"><td class="col-h"><span class="tier">最初</span></td>';
      P.forEach(function(pt){ h+='<td class="bagcell">'+(first?bagInputs(e.id,pt.id,'init'):bagDisp(comp[e.id][pt.id].init))+'</td>'; });
      h+='</tr><tr><td class="col-h"><span class="tier">増減</span></td>';
      P.forEach(function(pt){ h+='<td class="bagcell">'+bagInputs(e.id,pt.id,'d')+'</td>'; });
      h+='</tr><tr class="pbrow"><td class="col-h"><span class="tier">搭乗前</span></td>';
      P.forEach(function(pt){ h+='<td class="bagcell">'+bagDisp(comp[e.id][pt.id].pb)+'</td>'; });
      h+='</tr>';
    } else {
      h+='<tr class="sec flight"><td colspan="'+(P.length+1)+'">✈️ <input class="tlname" value="'+esc(e.name)+'" onchange="setTLName(\''+e.id+'\',this.value)">'+ctl+'</td></tr>';
      var srcId=prevPlaceId(idx);
      h+='<tr class="flightrow"><td class="col-h"><span class="tier">制限/判定</span></td>';
      P.forEach(function(pt){
        var fc=(plan.flight[e.id]&&plan.flight[e.id][pt.id])||{};
        var sc=(fc.sc==null?'':fc.sc), lim=(fc.limKg==null?'':fc.limKg);
        h+='<td><div class="flim">🧳<input class="ni" type="number" step="1" value="'+esc(sc)+'" onchange="setFlight(\''+e.id+'\',\''+pt.id+'\',\'sc\',this.value)">個 ×<input class="ni kg" type="number" step="0.1" value="'+esc(lim)+'" onchange="setFlight(\''+e.id+'\',\''+pt.id+'\',\'limKg\',this.value)"><span class="unit">kg</span></div>'+flightJudge(e.id,pt.id,srcId,fc)+'</td>';
      });
      h+='</tr>';
    }
  });
  h+='</tbody></table>';
  g('grid').innerHTML=h;
}

// ── 編集 ──
function setPlace(rowId,pid,field,val){ plan.place[rowId]=plan.place[rowId]||{}; plan.place[rowId][pid]=plan.place[rowId][pid]||{}; plan.place[rowId][pid][field]=num(val); render(); scheduleSave(); }
function setFlight(rowId,pid,field,val){ plan.flight[rowId]=plan.flight[rowId]||{}; plan.flight[rowId][pid]=plan.flight[rowId][pid]||{}; plan.flight[rowId][pid][field]=num(val); render(); scheduleSave(); }
function setPName(pid,name){ var p=plan.participants.find(function(x){return x.id===pid;}); if(p){ p.name=(name||'').trim()||'参加者'; } render(); scheduleSave(); }
function setTLName(rowId,name){ var e=plan.timeline.find(function(x){return x.id===rowId;}); if(e){ e.name=(name||'').trim(); } render(); scheduleSave(); }
function addParticipant(){ plan.participants.push({id:uid(), name:'参加者'+(plan.participants.length+1)}); render(); scheduleSave(); }
function removeParticipant(pid){ if(!confirm('この参加者を削除しますか？（入力データも消えます）')) return; plan.participants=plan.participants.filter(function(x){return x.id!==pid;}); Object.keys(plan.place).forEach(function(k){ delete plan.place[k][pid]; }); Object.keys(plan.flight).forEach(function(k){ delete plan.flight[k][pid]; }); render(); scheduleSave(); }
function addRow(type){ plan.timeline.push({id:uid(), type:type, name:(type==='place'?'新しい場所':'新しい空路')}); render(); scheduleSave(); }
function removeRow(rowId){ if(!confirm('この行を削除しますか？')) return; plan.timeline=plan.timeline.filter(function(x){return x.id!==rowId;}); delete plan.place[rowId]; delete plan.flight[rowId]; render(); scheduleSave(); }
function moveRow(rowId,dir){ var i=plan.timeline.findIndex(function(x){return x.id===rowId;}); var j=i+dir; if(i<0||j<0||j>=plan.timeline.length) return; var t=plan.timeline[i]; plan.timeline[i]=plan.timeline[j]; plan.timeline[j]=t; render(); scheduleSave(); }

// ── スケジュールから再生成 ──
function deriveFlights(items){
  var fl=items.filter(function(it){ return it.travelMode==='flight'||it.category==='flight'; });
  fl.sort(function(a,b){ return ((a.date||'')+(a.time||'')).localeCompare((b.date||'')+(b.time||'')); });
  return fl.map(function(it){
    var title=(it.title||'').trim(), o=(it.placeName||'').trim(), d=(it.toName||'').trim();
    var m=title.match(/^(.+?)\s*[→\-ー—–➡]\s*(.+)$/);
    if(m){ if(!o)o=m[1].trim(); if(!d)d=m[2].trim(); }
    return { origin:o||'出発', dest:d||'到着', label:title||((o||'?')+'→'+(d||'?')) };
  });
}
function seedTimeline(flights){
  var tl=[];
  flights.forEach(function(f,idx){
    if(idx===0) tl.push({id:uid(),type:'place',name:f.origin});
    tl.push({id:uid(),type:'flight',name:f.label});
    tl.push({id:uid(),type:'place',name:f.dest});
  });
  return tl;
}
function reseedFromSchedule(){
  db.collection('events').doc(EV).collection('scheduleItems').get().then(function(snap){
    var items=snap.docs.map(function(d){ return Object.assign({id:d.id},d.data()); });
    var flights=deriveFlights(items);
    if(!flights.length){ toast('このイベントに空路の予定がありません','err'); return; }
    plan.timeline=seedTimeline(flights);
    plan.place={}; plan.flight={};
    render(); scheduleSave(); toast('スケジュールの空路からタイムラインを再生成しました');
  }).catch(function(e){ toast('取得失敗: '+e.message,'err'); });
}

// ── 保存/読込 ──
var _saveTimer=null, _dirty=false;
function docRef(){ return db.collection('events').doc(EV).collection('baggage').doc('plan'); }
function scheduleSave(){ _dirty=true; g('save-ind').textContent='未保存…'; if(_saveTimer) clearTimeout(_saveTimer); _saveTimer=setTimeout(saveNow,900); }
function saveNow(){
  if(!EV) return;
  if(_saveTimer){ clearTimeout(_saveTimer); _saveTimer=null; }
  g('save-ind').textContent='保存中…';
  docRef().set({ participants:plan.participants, timeline:plan.timeline, place:plan.place, flight:plan.flight, updatedAt:firebase.firestore.FieldValue.serverTimestamp() })
    .then(function(){ _dirty=false; g('save-ind').textContent='保存済み '+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}); })
    .catch(function(e){ g('save-ind').textContent='保存失敗'; toast('保存失敗: '+e.message,'err'); });
}
function normalize(d){
  var parts=(Array.isArray(d.participants)?d.participants:[]).map(function(p){ return (p&&p.id)?{id:p.id,name:p.name||''}:{id:uid(),name:(typeof p==='string'?p:((p&&p.name)||''))}; });
  var tl=(Array.isArray(d.timeline)?d.timeline:[]).map(function(e){ return {id:(e&&e.id)||uid(), type:((e&&e.type)==='flight'?'flight':'place'), name:(e&&e.name)||''}; });
  return { name:d.name||'', participants:parts, timeline:tl, place:d.place||{}, flight:d.flight||{} };
}
function load(){
  if(!EV){ g('grid').innerHTML='<div class="empty">イベントが指定されていません。<br>イベント管理の各イベントにある「🧳 スーツケース」から開いてください。</div>'; return; }
  Promise.all([
    db.collection('events').doc(EV).get(),
    docRef().get(),
    db.collection('events').doc(EV).collection('scheduleItems').get()
  ]).then(function(res){
    var evDoc=res[0], planDoc=res[1], schSnap=res[2];
    _ev = evDoc.exists ? Object.assign({id:evDoc.id}, evDoc.data()) : {name:''};
    if(planDoc.exists){ plan=normalize(planDoc.data()); render(); return; }
    // 初回: イベントの参加者と空路からシード
    var parts=(Array.isArray(_ev.participantsPublic)?_ev.participantsPublic:[]).map(function(p){ return {id:uid(), name:(p.nickname||p.memberId||'参加者')}; });
    var items=schSnap.docs.map(function(d){ return Object.assign({id:d.id},d.data()); });
    plan={ name:_ev.name||'', participants:parts, timeline:seedTimeline(deriveFlights(items)), place:{}, flight:{} };
    render(); saveNow(); toast('イベントから初期データを作成しました');
  }).catch(function(e){ toast('読込失敗: '+e.message,'err'); g('grid').innerHTML='<div class="empty">読込に失敗しました: '+esc(e.message)+'</div>'; });
}

g('btn-save').addEventListener('click',saveNow);
g('btn-reseed').addEventListener('click',function(){ if(!confirm('スケジュールの空路からタイムラインを作り直します（現在のタイムラインと入力した荷物データは消えます。参加者は保持）。よろしいですか？')) return; reseedFromSchedule(); });

// ── 認証 ──
AuthRole.requireStaff(auth, function(user){
  g('login-screen').style.display='none';
  g('app').style.display='block';
  load();
});
g('lbtn').addEventListener('click',function(){
  var email=(g('lemail').value||'').trim(), pass=g('lpass').value;
  g('lerr').textContent='';
  if(!email||!pass){ g('lerr').textContent='メールアドレスとパスワードを入力してください'; return; }
  g('lbtn').textContent='ログイン中...';
  auth.signInWithEmailAndPassword(email,pass).then(function(){ g('lbtn').textContent='ログイン'; })
    .catch(function(e){ g('lerr').textContent='ログイン失敗: '+e.message; g('lbtn').textContent='ログイン'; });
});
g('lpass').addEventListener('keydown',function(e){ if(e.key==='Enter') g('lbtn').click(); });
g('btn-logout').addEventListener('click',function(){ auth.signOut(); });
window.addEventListener('beforeunload',function(){ if(_dirty) saveNow(); });
</script>
</body>
