plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.tequiladojo.terminal'
    compileSdk 34

    defaultConfig {
        applicationId "com.tequiladojo.terminal"
        minSdk 26          // Stripe Terminal SDK は API 26+ を要求
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    // ── Stripe Terminal SDK（WisePad 3 = BBPOS Bluetooth 端末） ──
    // ※ バージョンは必ず最新の安定版を確認して合わせてください（API が変わります）。
    //   https://github.com/stripe/stripe-terminal-android/releases
    def terminal = '4.4.0'
    implementation "com.stripe:stripeterminal-core:$terminal"
    implementation "com.stripe:stripeterminal-bbpos:$terminal"

    // ── Firebase（接続トークン/PaymentIntent取得のためFunctions＋Auth） ──
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-auth-ktx'
    implementation 'com.google.firebase:firebase-functions-ktx'

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
}
