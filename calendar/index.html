<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>今月のカレンダー｜テキーラ道場</title>
<script>
/* 今月のカレンダーへ飛ぶ固定リンク。/calendar/ にアクセスすると、
   その時点の「今月」の営業カレンダーへ自動リダイレクトする。
   ・当月のカレンダーは必ず生成される前提なので上限は設けない（＝月の追加でこのファイルを更新する必要なし）。
   ・MIN は最古の生成済み月（固定値・更新不要）。端末時計が大きく過去にずれていた場合の保険のみ。
   ・?list（または #list）を付けるとリスト表示版へ。 */
(function(){
  var MIN='202604'; // 最古の生成済みカレンダー（固定・更新不要）
  var d=new Date();
  var ym=d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2);
  if(ym<MIN) ym=MIN; // 想定外に古い月のみ最古へ。当月は常に存在する前提なので上限クランプはしない。
  var q=(location.search+location.hash).toLowerCase();
  var file='./'+ym+((q.indexOf('list')>=0)?'listcal':'calendar')+'.html';
  try{ var a=document.getElementById('go'); if(a) a.href=file; }catch(e){}
  location.replace(file);
})();
</script>
<style>
  body{font-family:sans-serif;background:#f9f7f2;color:#333;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center}
  .box{text-align:center;padding:24px}
  a{color:#185FA5;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div class="box">
  🌵 今月のカレンダーへ移動します…<br>
  <a id="go" href="https://www.tequiladojo.com/">開かない場合はこちら</a>
  <noscript><div style="margin-top:10px">カレンダーの表示にはJavaScriptを有効にしてください。<br><a href="https://www.tequiladojo.com/">テキーラ道場トップへ</a></div></noscript>
</div>
</body>
</html>
