<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>テキーラ道場 — オンライン奢り管理</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-functions-compat.js"></script>
<script src="/auth-role.js?v=20260829"></script>
<script>
var FIREBASE_CONFIG={apiKey:"AIzaSyD6a3i-N1RyXyAfXmztPQrYtx4x62YGth0",authDomain:"tequiladojo.firebaseapp.com",projectId:"tequiladojo",storageBucket:"tequiladojo.firebasestorage.app",messagingSenderId:"56663296233",appId:"1:56663296233:web:c8cac2fcbeb4faa09e0878"};
</script>
<style>
:root{--ink:#18110a;--ink2:#3a2c14;--ink3:#6b5a44;--gold:#c8921e;--gold-l:#e8b84a;--gold-d:#7a5610;--teal:#1a6e58;--red:#8c2818;--red-l:#fae8e4;--cream:#faf7f1;--cream2:#f0ebe0;--cream3:#e4ddd0;--white:#fff;--border:rgba(160,130,100,.18);--border2:rgba(160,130,100,.32);--shadow:0 1px 12px rgba(24,17,10,.07);--shadow-lg:0 6px 36px rgba(24,17,10,.13);--r:6px;--rl:12px;--sans:'Noto Sans JP',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--cream);color:var(--ink);min-height:100vh}
button{cursor:pointer;font-family:var(--sans)}
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center}
.lcard{width:100%;max-width:360px;background:var(--white);border:1px solid var(--border2);border-radius:var(--rl);padding:40px 30px;box-shadow:var(--shadow-lg)}
.lbrand{font-size:22px;font-weight:600;color:var(--gold-d);text-align:center;margin-bottom:24px}
.lcard label{display:block;font-size:11px;color:var(--ink3);margin:10px 0 4px}
.lcard input{width:100%;padding:10px 12px;border:1px solid var(--border2);border-radius:var(--r);font-size:13px;background:var(--cream)}
.lbtn{width:100%;margin-top:18px;padding:12px;background:var(--gold-d);color:var(--cream);border:none;border-radius:var(--r);font-size:13px}
.lerr{min-height:16px;font-size:12px;color:var(--red);margin-top:8px;text-align:center}
.topbar{background:var(--ink);display:flex;align-items:center;padding:10px 18px;gap:10px;position:sticky;top:0;z-index:200}
.topbar .t{color:var(--gold-l);font-size:14px;font-weight:600}
.tlogout{padding:5px 12px;border:1px solid rgba(255,255,255,.28);border-radius:var(--r);background:none;color:rgba(255,255,255,.72);font-size:11px;text-decoration:none}
.content{padding:20px 18px 50px;max-width:760px;margin:0 auto}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;padding:10px;border:1px solid var(--border2);border-radius:var(--r);background:var(--white);color:var(--ink2);font-size:13px;font-weight:700}
.tab.on{background:var(--gold-d);color:#fff;border-color:var(--gold-d)}
.tab .b{display:inline-block;min-width:18px;background:#e23b2e;color:#fff;border-radius:9px;font-size:10px;padding:0 5px;margin-left:5px}
.tab.on .b{background:rgba(255,255,255,.3)}
.filters{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.fchip{padding:5px 11px;border:1px solid var(--border2);border-radius:16px;background:var(--white);font-size:12px;font-weight:600;color:var(--ink2)}
.fchip.on{background:var(--gold-d);color:#fff;border-color:var(--gold-d)}
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--rl);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:11px}
.c-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.c-who{font-size:15px;font-weight:700}
.st{font-size:10px;font-weight:700;border-radius:10px;padding:2px 9px;white-space:nowrap}
.st-created{background:#eee;color:#777}.st-paid{background:#fde7cf;color:#8a5a10}.st-approved{background:#dcefe1;color:#1a6640}.st-served{background:#d7ecff;color:#0c4a7c}.st-cancelled{background:#f3d9d4;color:#8c2818}
.c-meta{font-size:12.5px;color:var(--ink2);margin-top:6px;line-height:1.55}
.c-sub{font-size:11px;color:var(--ink3);margin-top:3px;font-variant-numeric:tabular-nums}
.c-msg{font-size:12.5px;color:var(--ink2);background:var(--cream);border-radius:8px;padding:7px 10px;margin-top:8px;line-height:1.5}
.c-reply{font-size:12.5px;color:#0c4a7c;background:#eef6ff;border-radius:8px;padding:7px 10px;margin-top:6px;line-height:1.5}
.c-acts{display:flex;gap:8px;margin-top:11px}
.c-acts button{flex:0 0 auto;font-size:13px;font-weight:700;border-radius:18px;padding:8px 18px;border:none}
.btn-ok{background:var(--gold-d);color:#fff}
.btn-cancel{background:var(--red-l);color:var(--red);border:1px solid #e0b0a5!important}
.ec{text-align:center;color:var(--ink3);font-size:13px;padding:36px 0}
#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:6px;width:calc(100% - 32px);max-width:380px}
.toast{background:#241c0e;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;text-align:center;box-shadow:var(--shadow-lg)}
.toast.err{background:#8c2818}
</style>
</head>
<body>

<div id="login-screen">
  <div class="lcard">
    <div class="lbrand">オンライン奢り管理</div>
    <label>メールアドレス</label><input id="lemail" type="email">
    <label>パスワード</label><input id="lpass" type="password">
    <div class="lerr" id="lerr"></div>
    <button class="lbtn" id="lbtn">ログイン</button>
  </div>
</div>

<div id="app" style="display:none">
  <div class="topbar"><span class="t">🥃 オンライン奢り管理</span><span id="temail" style="color:rgba(255,255,255,.6);font-size:11px;flex:1"></span><a class="tlogout" href="/tdhome.html">🏠 管理TOP</a><button class="tlogout" id="btn-logout">ログアウト</button></div>
  <div class="content">
    <div class="tabs">
      <button class="tab on" id="tab-pending" onclick="setTab('pending')">承認待ち<span class="b" id="pend-badge" style="display:none">0</span></button>
      <button class="tab" id="tab-records" onclick="setTab('records')">奢り実績</button>
    </div>

    <div id="view-pending">
      <div id="pending-list"><div class="ec">読み込み中...</div></div>
    </div>

    <div id="view-records" style="display:none">
      <div class="filters" id="rec-filters">
        <span class="fchip on" data-st="" onclick="setRecFilter('')">すべて</span>
        <span class="fchip" data-st="paid" onclick="setRecFilter('paid')">承認待ち</span>
        <span class="fchip" data-st="approved" onclick="setRecFilter('approved')">提供準備中</span>
        <span class="fchip" data-st="served" onclick="setRecFilter('served')">提供済み</span>
        <span class="fchip" data-st="cancelled" onclick="setRecFilter('cancelled')">キャンセル</span>
      </div>
      <div id="records-list"><div class="ec">読み込み中...</div></div>
    </div>
  </div>
</div>

<div id="toasts"></div>

<script>
if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
var auth=firebase.auth(), db=firebase.firestore();
var fnsC=firebase.app().functions(); // us-central1: approve/cancel
function g(id){return document.getElementById(id);}
function gv(id){var e=g(id);return e?String(e.value).trim():"";}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function toast(m,t){var d=document.createElement("div");d.className="toast"+(t?" "+t:"");d.textContent=m;g("toasts").appendChild(d);setTimeout(function(){d.remove();},3200);}
function tsStr(ts){ try{ var d=ts&&ts.toDate?ts.toDate():null; if(!d)return""; var p=function(n){return String(n).padStart(2,"0");}; return (d.getFullYear())+"/"+p(d.getMonth()+1)+"/"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes()); }catch(e){ return ""; } }

var allTreats=[], curTab='pending', recFilter='';
function stLabel(s){ return {created:'決済前',paid:'承認待ち',approved:'提供準備中',served:'提供済み',cancelled:'キャンセル'}[s]||s; }
function tsMs(t){ return (t.createdAt&&t.createdAt.seconds)?t.createdAt.seconds:0; }
function treatLine(t){ return (t.style==='soda'?'ソーダ割り':'ストレート')+' '+t.ml+'ml・'+esc(t.baseName||'')+'（NOM '+esc(t.nom||'')+'）'; }

function setTab(tab){
  curTab=tab;
  g('tab-pending').classList.toggle('on',tab==='pending');
  g('tab-records').classList.toggle('on',tab==='records');
  g('view-pending').style.display=tab==='pending'?'block':'none';
  g('view-records').style.display=tab==='records'?'block':'none';
  render();
}
function setRecFilter(st){ recFilter=st; [].forEach.call(g('rec-filters').children,function(c){ c.classList.toggle('on',c.dataset.st===st); }); render(); }

function cardHtml(t, withActions){
  var msg=t.message?'<div class="c-msg">💬 '+esc(t.message)+'</div>':'';
  var rep=t.reply?'<div class="c-reply">↩ '+esc(t.toMemberName||'相手')+'より：'+esc(t.reply)+'</div>':'';
  var amt='¥'+Number(t.amount||0).toLocaleString()+(t.soda?'（テキーラ¥'+Number(t.tequilaAmount||0).toLocaleString()+' + ソーダ¥100）':'');
  var sub='作成: '+tsStr(t.createdAt)+(t.paidAt?' ／ 決済: '+tsStr(t.paidAt):'')+(t.approvedAt?' ／ 承認: '+tsStr(t.approvedAt):'')+(t.servedAt?' ／ 提供: '+tsStr(t.servedAt):'')+(t.cancelledAt?' ／ 取消: '+tsStr(t.cancelledAt):'');
  var closed=(t.storeOpenAtCreate===false)?'<span class="st" style="background:#fbeee0;color:#8a5a10">閉店中の奢り</span>':'';
  var acts='';
  if(withActions && t.status==='paid'){
    acts='<div class="c-acts"><button class="btn-ok" onclick="approve(\''+esc(t.treatId)+'\',this)">承認する</button>'
      +'<button class="btn-cancel" onclick="cancel(\''+esc(t.treatId)+'\',this)">キャンセル（返金）</button></div>';
  }
  return '<div class="card"><div class="c-top"><span class="c-who">'+esc(t.fromMemberName||'')+' → '+esc(t.toMemberName||'')+'</span>'
    +'<span class="st st-'+t.status+'">'+stLabel(t.status)+'</span>'+closed+'</div>'
    +'<div class="c-meta">'+treatLine(t)+' ／ <b>'+amt+'</b></div>'
    +'<div class="c-sub">'+esc(sub)+(t.refundId?' ／ 返金済':'')+'</div>'
    +msg+rep+acts+'</div>';
}
function render(){
  var pend=allTreats.filter(function(t){return t.status==='paid';}).sort(function(a,b){return tsMs(a)-tsMs(b);});
  var pb=g('pend-badge'); if(pb){ pb.style.display=pend.length?'inline-block':'none'; pb.textContent=pend.length; }
  if(curTab==='pending'){
    g('pending-list').innerHTML=pend.length?pend.map(function(t){return cardHtml(t,true);}).join(''):'<div class="ec">承認待ちの奢りはありません</div>';
  }else{
    var list=allTreats.slice().sort(function(a,b){return tsMs(b)-tsMs(a);});
    if(recFilter) list=list.filter(function(t){return t.status===recFilter;});
    g('records-list').innerHTML=list.length?list.map(function(t){return cardHtml(t,false);}).join(''):'<div class="ec">該当する奢りはありません</div>';
  }
}

async function approve(id,btn){
  btn.disabled=true; btn.textContent='承認中…';
  try{ var r=await fnsC.httpsCallable('approveOnlineTreat')({treatId:id}); toast('承認しました。注文（未提供）に登録しました。'); }
  catch(e){ toast('承認できません: '+((e&&e.message)||e),'err'); btn.disabled=false; btn.textContent='承認する'; }
}
async function cancel(id,btn){
  if(!confirm('この奢りをキャンセルしますか？（決済済みは返金されます）')) return;
  btn.disabled=true; btn.textContent='処理中…';
  try{ await fnsC.httpsCallable('cancelOnlineTreat')({treatId:id}); toast('キャンセル（返金）しました。'); }
  catch(e){ toast('キャンセルできません: '+((e&&e.message)||e),'err'); btn.disabled=false; btn.textContent='キャンセル（返金）'; }
}

function subscribe(){
  db.collection('onlineTreats').onSnapshot(function(snap){
    allTreats=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});
    render();
  },function(e){ toast('読み込み失敗: '+((e&&e.message)||e),'err'); g('pending-list').innerHTML='<div class="ec">読み込みに失敗しました</div>'; });
}

AuthRole.requireStaff(auth,function(user){
  g('login-screen').style.display='none'; g('app').style.display='block'; g('temail').textContent=user.email;
  subscribe();
},function(){ g('login-screen').style.display='flex'; g('app').style.display='none'; });
g('lbtn').addEventListener('click',function(){
  var e=gv('lemail'),p=g('lpass').value; g('lerr').textContent='';
  auth.signInWithEmailAndPassword(e,p).catch(function(err){g('lerr').textContent='ログイン失敗: '+err.message;});
});
g('lpass').addEventListener('keydown',function(e){if(e.key==='Enter')g('lbtn').click();});
g('btn-logout').addEventListener('click',function(){auth.signOut();});
</script>
</body>
</html>
