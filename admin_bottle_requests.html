<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>テキーラ道場 — ボトル登録依頼</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="/auth-role.js?v=20260828"></script>
<script>window.JOURNAL_PAGE='bottleRequests';</script>
<script src="/journal.js?v=20260706"></script>
<script>
var FIREBASE_CONFIG={apiKey:"AIzaSyD6a3i-N1RyXyAfXmztPQrYtx4x62YGth0",authDomain:"tequiladojo.firebaseapp.com",projectId:"tequiladojo",storageBucket:"tequiladojo.firebasestorage.app",messagingSenderId:"56663296233",appId:"1:56663296233:web:c8cac2fcbeb4faa09e0878"};
</script>
<style>
:root{--ink:#18110a;--ink2:#4a3820;--ink3:#9a8470;--gold:#c8921e;--gold-l:#e8b84a;--gold-d:#7a5610;--teal:#1a6e58;--red:#8c2818;--red-l:#fae8e4;--cream:#faf7f1;--cream2:#f0ebe0;--cream3:#e4ddd0;--white:#fff;--border:rgba(160,130,100,.18);--border2:rgba(160,130,100,.32);--shadow:0 1px 12px rgba(24,17,10,.07);--shadow-lg:0 6px 36px rgba(24,17,10,.13);--r:6px;--rl:12px;--sans:'Noto Sans JP',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--cream);color:var(--ink);min-height:100vh}
button{cursor:pointer;font-family:var(--sans)}
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center}
.lcard{width:100%;max-width:360px;background:var(--white);border:1px solid var(--border2);border-radius:var(--rl);padding:40px 30px;box-shadow:var(--shadow-lg)}
.lbrand{font-size:22px;font-weight:600;color:var(--gold-d);text-align:center;margin-bottom:24px}
.lcard label{display:block;font-size:11px;color:var(--ink3);margin:10px 0 4px}
.lcard input{width:100%;padding:10px 12px;border:1px solid var(--border2);border-radius:var(--r);font-size:13px;background:var(--cream)}
.lbtn{width:100%;margin-top:18px;padding:12px;background:var(--gold-d);color:var(--cream);border:none;border-radius:var(--r);font-size:13px}
.lerr{min-height:16px;font-size:12px;color:var(--red);margin-top:8px;text-align:center}
.topbar{background:var(--ink);display:flex;align-items:center;padding:10px 18px;gap:10px;position:sticky;top:0;z-index:200}
.topbar .t{color:var(--gold-l);font-size:14px;font-weight:600}
.tlogout{margin-left:auto;padding:5px 12px;border:1px solid rgba(255,255,255,.14);border-radius:var(--r);background:none;color:rgba(255,255,255,.5);font-size:11px}
.content{padding:22px;max-width:820px;margin:0 auto}
.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.toolbar .ti{font-weight:600;color:var(--gold-d);font-size:16px}
.toolbar .cnt{font-size:12px;color:var(--ink3)}
.toolbar label{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:4px;margin-left:auto}
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--rl);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:10px}
.card .nm{font-size:15px;font-weight:600}
.card .meta{font-size:11px;color:var(--ink3);margin-top:2px}
.card .note{font-size:12px;color:var(--ink2);margin-top:6px;white-space:pre-wrap;background:var(--cream);border-radius:var(--r);padding:6px 8px}
.badge{display:inline-block;font-size:10px;font-weight:600;border-radius:4px;padding:1px 7px;margin-left:6px}
.b-pend{background:#fae0c0;color:#8a5a00}.b-reg{background:#d7ecdd;color:#1a6640}.b-rej{background:#f3d4cd;color:#8c2818}
.acts{display:flex;gap:8px;margin-top:10px}
.btn{padding:7px 14px;border-radius:var(--r);font-size:12px;font-weight:500;border:none}
.bp{background:var(--gold-d);color:var(--cream)}.bs{background:var(--cream2);color:var(--ink2);border:1px solid var(--border2)}.bd{background:var(--red-l);color:var(--red);border:1px solid rgba(140,40,24,.2)}
.linked{font-size:12px;color:var(--teal);margin-top:6px}
.ec{text-align:center;color:var(--ink3);padding:26px}
.mbg{position:fixed;inset:0;background:rgba(24,17,10,.52);z-index:1000;display:none;align-items:center;justify-content:center;padding:16px}
.mbg.open{display:flex}
.modal{background:var(--white);border-radius:var(--rl);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)}
.mtitle{font-size:16px;font-weight:600;color:var(--gold-d)}
.mx{background:none;border:none;font-size:20px;color:var(--ink3)}
.mbody{padding:16px 20px}
.mbody input{width:100%;padding:10px 12px;border:1px solid var(--border2);border-radius:var(--r);font-size:14px;background:var(--cream);margin-bottom:10px}
#link-list{max-height:56vh;overflow-y:auto;border:1px solid var(--border2);border-radius:var(--r)}
.brow{padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer}
.brow .bn{font-size:14px;font-weight:600}.brow .bb{font-size:11px;color:var(--ink3)}
#toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:3000;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:#fff;font-size:13px;padding:9px 16px;border-radius:18px;box-shadow:var(--shadow-lg)}
.toast.err{background:var(--red)}.toast.inf{background:var(--teal)}
</style>
</head>
<body>

<div id="login-screen">
  <div class="lcard">
    <div class="lbrand">ボトル登録依頼</div>
    <label>メールアドレス</label><input id="lemail" type="email">
    <label>パスワード</label><input id="lpass" type="password">
    <div class="lerr" id="lerr"></div>
    <button class="lbtn" id="lbtn">ログイン</button>
  </div>
</div>

<div id="app" style="display:none">
  <div class="topbar"><span class="t">🥃 ボトル登録依頼</span><span id="temail" style="color:rgba(255,255,255,.4);font-size:11px"></span><button class="tlogout" onclick="history.back()">← 戻る</button><a class="tlogout" href="/tdhome.html" style="text-decoration:none">🏠 管理TOP</a><button class="tlogout" id="btn-logout">ログアウト</button></div>
  <div class="content">
    <div class="toolbar">
      <span class="ti">登録依頼</span><span class="cnt" id="cnt">—</span>
      <label><input type="checkbox" id="show-all"> 処理済みも表示</label>
    </div>
    <div id="list"><div class="ec">読み込み中...</div></div>
  </div>
</div>

<!-- 紐付けモーダル -->
<div class="mbg" id="m-link"><div class="modal">
  <div class="mhead"><div class="mtitle">マスタ銘柄を紐付けて登録</div><button class="mx" data-close>✕</button></div>
  <div class="mbody">
    <div id="link-req" style="font-size:13px;color:var(--ink2);margin-bottom:10px">—</div>
    <input id="link-search" placeholder="マスタの銘柄名・NOM(4桁)で検索...">
    <div id="link-list"></div>
  </div>
</div></div>

<div id="toasts"></div>

<script>
if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
var auth=firebase.auth(), db=firebase.firestore();
function g(id){return document.getElementById(id);}
function gv(id){var e=g(id);return e?String(e.value).trim():"";}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function toast(m,t){var d=document.createElement("div");d.className="toast"+(t?" "+t:"");d.textContent=m;g("toasts").appendChild(d);setTimeout(function(){d.remove();},2800);}
function tsStr(ts){ try{ var d=ts&&ts.toDate?ts.toDate():null; return d?(d.getFullYear()+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+String(d.getDate()).padStart(2,"0")):""; }catch(e){ return ""; } }

var reqs=[], bottles=[], brandsMap={}, linkReqId=null;

function bottleFull(b){ var brand=brandsMap[b.brandId]||{}; var brn=brand.brandEs||brand.brandJa||""; var bn=b.bottleEs||b.bottleJa||b.bottleEn||b.id; return (brn?brn+" ":"")+bn; }
function bottleFullById(id){ var b=bottles.find(function(x){return x.id===id;}); return b?bottleFull(b):id; }

AuthRole.requireOwner(auth,function(user){
  g("login-screen").style.display="none";g("app").style.display="block";g("temail").textContent=user.email;
  loadAll();
},function(){ g("login-screen").style.display="flex";g("app").style.display="none"; });
g("lbtn").addEventListener("click",function(){
  var e=gv("lemail"),p=g("lpass").value;g("lerr").textContent="";
  if(!e||!p){g("lerr").textContent="入力してください";return;}
  auth.signInWithEmailAndPassword(e,p).catch(function(err){g("lerr").textContent="ログイン失敗: "+err.message;});
});
g("lpass").addEventListener("keydown",function(e){if(e.key==="Enter")g("lbtn").click();});
g("btn-logout").addEventListener("click",function(){auth.signOut();});
g("show-all").addEventListener("change",render);

async function loadAll(){
  try{
    var rs=await db.collection("bottleRequests").get();
    reqs=rs.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); })
      .sort(function(a,b){ var ta=a.createdAt&&a.createdAt.seconds||0, tb=b.createdAt&&b.createdAt.seconds||0; return tb-ta; });
    var bs=await db.collection("bottles").get();
    bottles=bs.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    var br=await db.collection("brands").get();
    br.docs.forEach(function(d){ brandsMap[d.id]=d.data(); });
    render();
  }catch(e){ g("list").innerHTML="<div class='ec'>読み込み失敗: "+esc(e.message)+"</div>"; }
}

function render(){
  var showAll=g("show-all").checked;
  var list=reqs.filter(function(r){ return showAll || r.status==="pending"; });
  var pend=reqs.filter(function(r){return r.status==="pending";}).length;
  g("cnt").textContent="未処理 "+pend+" 件"+(showAll?(" / 全 "+reqs.length+" 件"):"");
  if(!list.length){ g("list").innerHTML="<div class='ec'>依頼はありません</div>"; return; }
  g("list").innerHTML=list.map(function(r){
    var badge=r.status==="pending"?"<span class='badge b-pend'>未処理</span>":(r.status==="registered"?"<span class='badge b-reg'>登録済</span>":"<span class='badge b-rej'>却下</span>");
    var h="<div class='card'><div class='nm'>"+esc(r.name||"—")+badge+"</div>"
      +"<div class='meta'>申請: "+esc(r.memberName||"")+"（"+esc(r.memberId||"")+"）・"+esc(tsStr(r.createdAt))+"</div>";
    if(r.note) h+="<div class='note'>"+esc(r.note)+"</div>";
    if(r.status==="registered"&&r.bottleId) h+="<div class='linked'>→ 紐付け: "+esc(bottleFullById(r.bottleId))+"（"+esc(r.bottleId)+"）</div>";
    if(r.status==="pending"){
      h+="<div class='acts'><button class='btn bp' data-link='"+esc(r.id)+"'>銘柄を紐付けて登録</button><button class='btn bd' data-reject='"+esc(r.id)+"'>却下</button></div>";
    } else {
      h+="<div class='acts'><button class='btn bs' data-reopen='"+esc(r.id)+"'>未処理に戻す</button></div>";
    }
    return h+"</div>";
  }).join("");
}

document.addEventListener("click",function(e){
  var b=e.target.closest("button");
  var c=e.target.closest("[data-close]"); if(c){ g("m-link").classList.remove("open"); return; }
  if(e.target.classList.contains("mbg")){ e.target.classList.remove("open"); return; }
  if(!b) return;
  if(b.dataset.link){ openLink(b.dataset.link); return; }
  if(b.dataset.reject){ rejectReq(b.dataset.reject); return; }
  if(b.dataset.reopen){ setStatus(b.dataset.reopen,"pending",null); return; }
});

function setStatus(reqId,status,bottleId){
  var data={status:status,updatedAt:firebase.firestore.FieldValue.serverTimestamp()};
  if(bottleId!==undefined) data.bottleId=bottleId;
  journaledSet("bottleRequests",reqId,data,{merge:true})
    .then(function(){ toast(status==="registered"?"登録しました":(status==="rejected"?"却下しました":"戻しました")); g("m-link").classList.remove("open"); loadAll(); })
    .catch(function(e){ toast("更新失敗: "+e.message,"err"); });
}
function rejectReq(reqId){ if(!confirm("この依頼を却下しますか？")) return; setStatus(reqId,"rejected"); }

function openLink(reqId){
  linkReqId=reqId;
  var r=reqs.find(function(x){return x.id===reqId;});
  g("link-req").innerHTML="依頼銘柄: <b>"+esc(r?r.name:"")+"</b>"+(r&&r.note?"<div style='font-size:11px;color:var(--ink3);margin-top:2px'>"+esc(r.note)+"</div>":"");
  g("link-search").value=r?(r.name||""):""; renderLinkList(g("link-search").value);
  g("m-link").classList.add("open");
  setTimeout(function(){ g("link-search").focus(); },50);
}
function renderLinkList(q){
  q=(q||"").toLowerCase();
  var list=bottles.map(function(b){ return {id:b.id, full:bottleFull(b), nom:String(b.id).slice(0,4)}; })
    .filter(function(b){ return !q || (b.full+" "+b.nom).toLowerCase().indexOf(q)>=0; })
    .sort(function(a,b){ return a.full.localeCompare(b.full); }).slice(0,200);
  if(!list.length){ g("link-list").innerHTML="<div class='ec'>該当する銘柄がありません（先にボトルマスタで登録してください）</div>"; return; }
  g("link-list").innerHTML=list.map(function(b){
    return "<div class='brow' data-id='"+esc(b.id)+"'><div class='bn'>"+esc(b.full)+"</div><div class='bb'>NOM "+esc(b.nom)+" ・ "+esc(b.id)+"</div></div>";
  }).join("");
}
g("link-search").addEventListener("input",function(){ renderLinkList(this.value); });
g("link-list").addEventListener("click",function(e){
  var row=e.target.closest(".brow"); if(!row) return;
  var bid=row.getAttribute("data-id");
  var r=reqs.find(function(x){return x.id===linkReqId;});
  if(!confirm("この依頼を「"+bottleFullById(bid)+"」として登録しますか？\n各会員のログが自動でこの銘柄に置き換わります。")) return;
  setStatus(linkReqId,"registered",bid);
});
</script>
</body>
</html>
