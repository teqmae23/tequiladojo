<style>
:root{--ink:#18110a;--ink2:#4a3820;--ink3:#9a8470;--gold:#c8921e;--gold-l:#e8b84a;--gold-d:#7a5610;--teal:#1a6e58;--red:#8c2818;--red-l:#fae8e4;--cream:#faf7f1;--cream2:#f0ebe0;--cream3:#e4ddd0;--white:#fff;--border:rgba(160,130,100,.18);--border2:rgba(160,130,100,.32);--shadow:0 1px 12px rgba(24,17,10,.07);--shadow-lg:0 6px 36px rgba(24,17,10,.13);--r:6px;--rl:12px;--sans:'Noto Sans JP',system-ui,sans-serif;--mono:'DM Mono',monospace}

<script>
if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
var auth=firebase.auth(), db=firebase.firestore();
function g(id){return document.getElementById(id);}
function gv(id){var e=g(id);return e?String(e.value).trim():"";}
function sv(id,v){var e=g(id);if(e)e.value=(v==null?"":v);}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function toast(m,t){var d=document.createElement("div");d.className="toast"+(t?" "+t:"");d.textContent=m;g("toasts").appendChild(d);setTimeout(function(){d.remove();},2800);}
function pad(n,l){return String(n).padStart(l,"0");}

var bars=[],countries=[],regions=[],cities=[],curTab="bars";

// 表示名: BAR=JP>EN>ES / 地理=JP>EN
function barName(b){return b.nameJa||b.nameEn||b.nameEs||b.id;}
function geoName(x){return x?(x.nameJa||x.nameEn||x.id):"";}
// アメリカ・メキシコの州の略称（nameEnで照合）
var REGION_ABBR={
  "Alabama":"AL","Alaska":"AK","Arizona":"AZ","Arkansas":"AR","California":"CA","Colorado":"CO","Connecticut":"CT","Delaware":"DE","Florida":"FL","Georgia":"GA","Hawaii":"HI","Idaho":"ID","Illinois":"IL","Indiana":"IN","Iowa":"IA","Kansas":"KS","Kentucky":"KY","Louisiana":"LA","Maine":"ME","Maryland":"MD","Massachusetts":"MA","Michigan":"MI","Minnesota":"MN","Mississippi":"MS","Missouri":"MO","Montana":"MT","Nebraska":"NE","Nevada":"NV","New Hampshire":"NH","New Jersey":"NJ","New Mexico":"NM","New York":"NY","North Carolina":"NC","North Dakota":"ND","Ohio":"OH","Oklahoma":"OK","Oregon":"OR","Pennsylvania":"PA","Rhode Island":"RI","South Carolina":"SC","South Dakota":"SD","Tennessee":"TN","Texas":"TX","Utah":"UT","Vermont":"VT","Virginia":"VA","Washington":"WA","West Virginia":"WV","Wisconsin":"WI","Wyoming":"WY",
  "Aguascalientes":"AGU","Baja California":"BCN","Baja California Sur":"BCS","Campeche":"CAM","Chiapas":"CHP","Chihuahua":"CHH","Coahuila":"COA","Colima":"COL","Durango":"DUR","Guanajuato":"GUA","Guerrero":"GRO","Hidalgo":"HID","Jalisco":"JAL","Mexico City":"CMX","Mexico State":"MEX","Michoacan":"MIC","Morelos":"MOR","Nayarit":"NAY","Nuevo Leon":"NLE","Oaxaca":"OAX","Puebla":"PUE","Queretaro":"QUE","Quintana Roo":"ROO","San Luis Potosi":"SLP","Sinaloa":"SIN","Sonora":"SON","Tabasco":"TAB","Tamaulipas":"TAM","Tlaxcala":"TLA","Veracruz":"VER","Yucatan":"YUC","Zacatecas":"ZAC"
};
function regionAbbr(r){ return r?(REGION_ABBR[r.nameEn]||""):""; }
// リスト表示用: 略称があれば略称、無ければ通常名
function regionShort(r){ if(!r) return ""; return regionAbbr(r)||geoName(r); }
function countryOf(id){return countries.find(function(c){return c.id===id;});}
function regionOf(id){return regions.find(function(r){return r.id===id;});}
function cityOf(id){return cities.find(function(c){return c.id===id;});}
function barCountFor(field,val){return bars.filter(function(b){return b[field]===val;}).length;}
// 2点間の距離(m)。重複チェックの近接判定に使用。
function distMeters(la1,lo1,la2,lo2){
  if(la1==null||lo1==null||la2==null||lo2==null) return Infinity;
  var R=6371000,tr=Math.PI/180;
  var dLa=(la2-la1)*tr,dLo=(lo2-lo1)*tr;
  var a=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(la1*tr)*Math.cos(la2*tr)*Math.sin(dLo/2)*Math.sin(dLo/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function normName(s){return String(s==null?"":s).trim().toLowerCase();}

// ── 認証 ─────────────────────────────────────────────
AuthRole.requireOwner(auth,function(user){
  g("login-screen").style.display="none";g("app").style.display="block";g("temail").textContent=user.email;
  loadAll();
},function(){ g("login-screen").style.display="flex";g("app").style.display="none"; });
g("lbtn").addEventListener("click",function(){
  var e=gv("lemail"),p=g("lpass").value;g("lerr").textContent="";
  if(!e||!p){g("lerr").textContent="入力してください";return;}
  auth.signInWithEmailAndPassword(e,p).catch(function(err){g("lerr").textContent="ログイン失敗: "+err.message;});
});
g("lpass").addEventListener("keydown",function(e){if(e.key==="Enter")g("lbtn").click();});
g("btn-logout").addEventListener("click",function(){auth.signOut();});
// 郵便番号のペースト時に〒・ハイフン・空白・全角を除去して数字のみに
g("bar-postal").addEventListener("paste",function(e){
  e.preventDefault();
  var t=((e.clipboardData||window.clipboardData).getData("text")||"")
    .replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFEE0);});
  this.value=t.replace(/[^0-9]/g,"").slice(0,7);
});

function loadAll(){
  Promise.all([
    db.collection("bars").get(),db.collection("countries").get(),
    db.collection("regions").get(),db.collection("cities").get()
  ]).then(function(r){
    bars=r[0].docs.map(function(d){return Object.assign({id:d.id},d.data());});
    countries=r[1].docs.map(function(d){return Object.assign({id:d.id},d.data());});

// ── geoユーティリティ ────────────────────────────────
function parseLatLng(url){
  if(!url) return null;
  // 施設ピンの正確な座標(!3d..!4d..) を最優先。次にクエリ座標。最後に地図中心(@..)。
  // 地図中心(@)は店の位置とズレることがあるため優先度を下げる。
  var m=url.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)
    ||url.match(/[?&](?:q|query|ll|sll|daddr|destination)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/)
    ||url.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
  return m?{lat:parseFloat(m[1]),lng:parseFloat(m[2])}:null;
}
// 地名→座標（Nominatim・無料/キー不要）。国コードで精度を上げる。
function isoOfCountry(name){ var m={'Japan':'jp','日本':'jp','United States':'us','United States of America':'us','USA':'us','アメリカ':'us','アメリカ合衆国':'us','Mexico':'mx','México':'mx','メキシコ':'mx'}; return m[(name||'').trim()]||''; }
function isoOf(cty){ if(!cty) return ''; return isoOfCountry(cty.nameEn)||isoOfCountry(cty.nameJa)||isoOfCountry(cty.nameEs); }
function phoneCcOf(iso){ var m={'jp':'+81','us':'+1','mx':'+52'}; return m[iso]||''; }
function gmapUrlOf(lat,lng){ return 'https://www.google.com/maps/search/?api=1&query='+lat+','+lng; }
// 住所コンポーネント→表示用住所文字列（国により並び順を変える）
function composeAddress(a, iso){
  if(!a) return '';
  var order = (iso==='jp')
    ? ['state','province','city','county','city_district','ward','suburb','quarter','neighbourhood','town','village','road','house_number','building']
    : ['house_number','road','neighbourhood','suburb','quarter','city','town','village','county','state','province'];
  var parts=[];
  order.forEach(function(k){ if(a[k] && parts.indexOf(a[k])<0) parts.push(a[k]); });
  if(!parts.length) return '';
  return parts.join(iso==='jp' ? '' : ' ');
}
// 評価サイトURL: 日本＝食べログ検索、米国＝Yelp検索、その他＝Google検索
function buildReviewUrl(name, iso){
  var kw=(name||'').trim();
  if(!kw) return '';
  if(iso==='jp') return 'https://tabelog.com/rstLst/?sw='+encodeURIComponent(kw);
  if(iso==='us') return 'https://www.yelp.com/search?find_desc='+encodeURIComponent(kw);
  return 'https://www.google.com/search?q='+encodeURIComponent(kw+' review');
}
async function geocodeName(query, iso){
  var url='https://nominatim.openstreetmap.org/search?format=json&limit=1&addressdetails=1&extratags=1&q='+encodeURIComponent(query);
  if(iso) url+='&countrycodes='+iso;
  var res=await fetch(url,{headers:{'Accept-Language':'ja,en','User-Agent':'TequilaDojoAdmin/1.0'}});
  var arr=await res.json();
  if(!arr||!arr.length) return null;
  var a=arr[0].address||{}, x=arr[0].extratags||{};
  return {
    lat:parseFloat(arr[0].lat), lng:parseFloat(arr[0].lon), display:arr[0].display_name,
    postcode:a.postcode||'', address:composeAddress(a, iso),
    phone:x.phone||x['contact:phone']||x['contact:mobile']||'',
    website:x.website||x['contact:website']||''
  };
}
// 日本の住所→座標（国土地理院 住所ジオコーダ・キー不要・日本住所に高精度）。
// 住所文字列を渡すと最有力候補の座標を返す。日本以外や不発時は null。
async function geocodeJP(address){
  if(!address) return null;
  var url='https://msearch.gsi.go.jp/address-search/AddressSearch?q='+encodeURIComponent(address);
  var res=await fetch(url);
  var arr=await res.json();
  if(!arr||!arr.length) return null;
  var f=arr[0], c=f.geometry&&f.geometry.coordinates;
  if(!c||c.length<2) return null;
  return {lat:c[1], lng:c[0], display:(f.properties&&f.properties.title)||address};
}
// 住所→座標を最優先で高精度に解決（日本=GSI、それ以外/不発時=Nominatim）。
async function geocodeAddress(address, iso){
  if(iso==='jp'){ var g=await geocodeJP(address); if(g) return g; }
  return await geocodeName(address, iso);
}
// 選択中の街（無ければ地域・国）から検索の中心座標と街名を得る。
async function areaCenter(){
  var c=cityOf(gv('bar-city'));
  if(c && c.lat!=null && c.lng!=null) return {lat:Number(c.lat), lng:Number(c.lng), name:(c.nameJa||c.nameEn||'')};
  var reg=regionOf(gv('bar-region')), cty=countryOf(gv('bar-country'));
  var parts=[]; if(c) parts.push(c.nameJa||c.nameEn); if(reg) parts.push(reg.nameJa||reg.nameEn); if(cty) parts.push(cty.nameJa||cty.nameEn);
  if(!parts.length) return null;
  try{ var g=await geocodeName(parts.join(', '), isoOf(cty)); if(g) return {lat:g.lat, lng:g.lng, name:(c?(c.nameJa||c.nameEn):parts[0])}; }catch(e){}
  return null;
}
// Overpass: 中心から半径内で name 部分一致（大小無視）のPOIを面で検索。OSM登録店を拾う。
async function overpassPOI(name, center){
  if(!name||!center) return null;
  var esc=name.replace(/["\\]/g,'\\$&');
  var around='(around:3000,'+center.lat+','+center.lng+')';
  var q='[out:json][timeout:20];('
      +'node["name"~"'+esc+'",i]'+around+';'
      +'way["name"~"'+esc+'",i]'+around+';'
      +');out center 5;';
  var res=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:'data='+encodeURIComponent(q)});
  var j=await res.json();
  if(!j||!j.elements||!j.elements.length) return null;
  var el=j.elements[0];
  var lat=(el.lat!=null)?el.lat:(el.center&&el.center.lat), lng=(el.lon!=null)?el.lon:(el.center&&el.center.lon);
  if(lat==null||lng==null) return null;
  var t=el.tags||{};
  var addr=[t['addr:province'],t['addr:city'],t['addr:ward'],t['addr:suburb'],t['addr:neighbourhood'],t['addr:quarter'],t['addr:block_number'],t['addr:housenumber']].filter(Boolean).join('');
  return {lat:Number(lat), lng:Number(lng), display:(t.name||name),
    address:addr||'', postcode:t['addr:postcode']||'', phone:t.phone||t['contact:phone']||t['contact:mobile']||''};
}
// 店名＋街から座標/住所を特定（無料）。Nominatim(名前+街名) → Overpass(面検索)。
async function geocodePOI(name, iso){
  var center=await areaCenter();
  var cityName=center&&center.name?center.name:'';
  var r=null;
  try{ r=await geocodeName([name,cityName].filter(Boolean).join(' '), iso); }catch(e){}
  if(r) return r;
  if(center){ try{ var o=await overpassPOI(name, center); if(o) return o; }catch(e){} }
  return null;
}

function barMapFromCoords(){

// 標高取得: SRTM30m(30m・沿岸低地に強い)を優先し、無ければ open-meteo(90m)へ。
// 沿岸の点で 0m/null しか返らない場合は他方を試し、より妥当な値を採用する。
async function getElevation(lat,lng){
  var vals=[];
  // 1) OpenTopoData SRTM30m
  try{
    var r=await fetch("https://api.opentopodata.org/v1/srtm30m?locations="+lat+","+lng);
    var j=await r.json();
    if(j&&j.results&&j.results.length&&j.results[0].elevation!=null) vals.push(j.results[0].elevation);
  }catch(e){}
  // 2) open-meteo (Copernicus 90m)
  try{
    var r2=await fetch("https://api.open-meteo.com/v1/elevation?latitude="+lat+"&longitude="+lng);
    var j2=await r2.json();
    if(j2&&j2.elevation&&j2.elevation.length) vals.push(j2.elevation[0]);
  }catch(e){}
  if(!vals.length) return null;
  // 0(海判定)より、非0の値があればそちらを優先
  var nonZero=vals.filter(function(v){return Math.abs(v)>0.5;});
  return nonZero.length?nonZero[0]:vals[0];
}
// 座標→タイムゾーン(IANA)。open-meteoの timezone=auto を利用（キー不要）。
async function fetchTimezone(lat,lng){
  try{
    var r=await fetch("https://api.open-meteo.com/v1/forecast?latitude="+lat+"&longitude="+lng+"&current=temperature_2m&timezone=auto");
    var j=await r.json();
    if(j&&j.timezone) return j.timezone;
  }catch(e){}
  return null;
}
async function fetchTzInto(latId,lngId,tzId){

  if(isNaN(lat)||isNaN(lng)){toast("先に緯度経度を入れてください","err");return;}
  toast("TZ取得中...","inf");
  var tz=await fetchTimezone(lat,lng);
  if(tz){sv(tzId,tz);toast("TZ: "+tz,"inf");}else toast("TZ取得失敗","err");
}
async function fetchElevInto(latId,lngId,elevId){
  var lat=parseFloat(gv(latId)),lng=parseFloat(gv(lngId));
  if(isNaN(lat)||isNaN(lng)){toast("先に緯度経度を入れてください","err");return;}
  toast("標高取得中...","inf");

    var v=await getElevation(lat,lng);
    if(v==null){toast("標高取得失敗","err");return;}
    sv(elevId,Math.round(v));toast("標高: "+Math.round(v)+"m","inf");

}

function approveBar(id){
  approveTargetId=id;
  var b=bars.find(function(x){return x.id===id;});
  g("ap-name").textContent=(b?barName(b):id)+"（"+id+"）";
  g("ap-sub").textContent=(b&&b.createdByName?"申請者: "+b.createdByName:"");

function setBarStatus(status){
  var id=approveTargetId; if(!id) return; closeM("m-approve");
  journaledSet("bars",id,{status:status,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true})
    .then(function(){toast(status==="approved"?"承認しました":"非承認にしました");loadAll();}).catch(function(e){toast("更新失敗: "+e.message,"err");});
}
function deleteApproveTarget(){
  var id=approveTargetId; if(!id) return;
  if(!confirm("このレコードを削除します（番号は空番になります）。よろしいですか？")) return;
  closeM("m-approve"); delDoc("bars",id);
}

// 郵便番号(7桁)→住所（zipcloud）。国=日本・都道府県を自動選択し住所欄に市区町村以下をセット。
async function barZipSearch(){
  var zip=gv("bar-postal").replace(/[^0-9]/g,"");
  if(zip.length!==7){ toast("郵便番号は半角数字7桁で入力してください","err"); return; }
  sv("bar-postal",zip);
  toast("住所を検索中...","inf");
  try{
    var res=await fetch("https://zipcloud.ibsnet.co.jp/api/search?zipcode="+zip);
    var j=await res.json();
    if(!j||!j.results||!j.results.length){ toast("該当する住所が見つかりませんでした","err"); return; }
    var r=j.results[0];
    var jp=countries.find(function(c){ return isoOfCountry(c.nameEn||c.nameJa)==="jp"; });
    if(jp){ sv("bar-country",jp.id); fillRegionSel("bar-region",jp.id,""); }
    var reg=regions.find(function(x){ return (!jp||x.countryId===jp.id) && (geoName(x)===r.address1 || x.nameJa===r.address1); });
    if(reg){ sv("bar-region",reg.id); fillCitySel("bar-city",reg.id,""); }
    sv("bar-address",(reg?"":(r.address1||""))+(r.address2||"")+(r.address3||""));
    if(!gv("bar-phoneCc")) sv("bar-phoneCc","+81");
    toast("住所をセットしました","inf");
  }catch(e){ toast("住所検索に失敗しました（通信）","err"); }
}

g("btn-save-bar").addEventListener("click",function(){
  var id=editBarId||nextBarId();
  var nameJa=gv("bar-nameJa"),nameEn=gv("bar-nameEn"),nameEs=nameEn;   // 英・墨は1欄に統一
  if(!nameJa&&!nameEn){toast("名前を1つ以上入力してください","err");return;}
  // 重複チェック（同名 / 住所一致 / 座標が近接80m以内）
  var _blat=gv("bar-lat")!==""?parseFloat(gv("bar-lat")):null,_blng=gv("bar-lng")!==""?parseFloat(gv("bar-lng")):null;
  var _bnames=[nameJa,nameEn,nameEs].filter(Boolean).map(normName);
  var _baddr=normName(gv("bar-address"));
  var dupBar=bars.find(function(b){
    if(b.id===id||b.id==="B00000"||b.id==="B900001"||b.id==="B90001") return false;
    var bn=[b.nameJa,b.nameEn,b.nameEs].filter(Boolean).map(normName);
    var sameName=_bnames.some(function(x){return bn.indexOf(x)>=0;});
    var sameAddr=_baddr&&normName(b.address)===_baddr;
    var near=(_blat!=null&&_blng!=null)&&distMeters(_blat,_blng,b.lat,b.lng)<=80;
    return sameName||sameAddr||near;
  });
  if(dupBar){
    var _r=dupBar.lat!=null&&_blat!=null?Math.round(distMeters(_blat,_blng,dupBar.lat,dupBar.lng)):null;
    if(!confirm("⚠ 重複の可能性があります。\n既存: "+dupBar.id+"「"+barName(dupBar)+"」"+(dupBar.address?"\n"+dupBar.address:"")+(_r!=null?"\n距離 約"+_r+"m":"")+"\n\nこのまま登録しますか？")) return;
  }
  var data={barId:id,nameJa:nameJa||null,nameEn:nameEn||null,nameEs:nameEs||null,
    nameKana:gv("bar-kana")||null,
    countryId:gv("bar-country")||null,regionId:gv("bar-region")||null,cityId:gv("bar-city")||null,
    postalCode:gv("bar-postal").replace(/[^0-9]/g,"")||null,address:gv("bar-address")||null,
    phoneCountryCode:gv("bar-phoneCc")||null,phone:gv("bar-phone")||null,
    reviewUrl:gv("bar-review")||null,
    mapUrl:gv("bar-mapUrl")||null,
    lat:gv("bar-lat")!==""?parseFloat(gv("bar-lat")):null,lng:gv("bar-lng")!==""?parseFloat(gv("bar-lng")):null,
    elevation:gv("bar-elev")!==""?parseInt(gv("bar-elev")):null,
    updatedAt:firebase.firestore.FieldValue.serverTimestamp()};
  journaledSet("bars",id,data,{merge:true}).then(function(){toast("保存しました（"+id+"）");closeM("m-bar");loadAll();}).catch(function(e){toast("保存失敗: "+e.message,"err");});
});

g("btn-init").addEventListener("click",async function(){
  if(!confirm("日本・アメリカ・メキシコの国と地域（都道府県/州）を生成します。\n既存の同名は重複追加しません。よろしいですか？")) return;
  try{
    var made=0;
    for(var i=0;i<INIT.length;i++){
      var C=INIT[i];
      var ex=countries.find(function(c){return c.nameEn===C.en;});
      var cid;
      if(ex){cid=ex.id;}else{cid=nextCountryId();await db.collection("countries").doc(cid).set({countryId:cid,nameEn:C.en,nameJa:C.ja});countries.push({id:cid,countryId:cid,nameEn:C.en,nameJa:C.ja});made++;}
      for(var j=0;j<C.regions.length;j++){
        var rEn=C.regions[j][0],rJa=C.regions[j][1];
        if(regions.find(function(r){return r.countryId===cid&&r.nameEn===rEn;})) continue;
        var rid=nextRegionId(cid);
        await db.collection("regions").doc(rid).set({regionId:rid,countryId:cid,nameEn:rEn,nameJa:rJa});
        regions.push({id:rid,regionId:rid,countryId:cid,nameEn:rEn,nameJa:rJa});made++;
      }
    }
    // テキーラ道場(B00000)・その他(B90001) を用意
    if(!bars.find(function(b){return b.id==="B00000";})){
      var jp=countries.find(function(c){return c.nameEn==="Japan";});
      await db.collection("bars").doc("B00000").set({barId:"B00000",nameJa:"テキーラ道場",nameEn:"Tequila Dojo",countryId:jp?jp.id:null});
      made++;
    }
    if(!bars.find(function(b){return b.id==="B900001"||b.id==="B90001";})){
      await db.collection("bars").doc("B90001").set({barId:"B90001",nameJa:"その他（自由入力）",nameEn:"Other"});
      made++;
    }
    toast("初期データ生成 完了（"+made+"件追加）","inf");
    loadAll();
  }catch(e){toast("生成失敗: "+e.message,"err");}
});
</script>
