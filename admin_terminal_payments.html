<style>
:root{--ink:#18110a;--ink2:#4a3820;--ink3:#9a8470;--gold:#c8921e;--gold-l:#e8b84a;--gold-d:#7a5610;--teal:#1a6e58;--red:#8c2818;--red-l:#fae8e4;--cream:#faf7f1;--cream2:#f0ebe0;--cream3:#e4ddd0;--white:#fff;--border:rgba(160,130,100,.18);--border2:rgba(160,130,100,.32);--shadow:0 1px 12px rgba(24,17,10,.07);--shadow-lg:0 6px 36px rgba(24,17,10,.13);--r:6px;--rl:12px;--sans:'Noto Sans JP',system-ui,sans-serif;--mono:'DM Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--cream);color:var(--ink);min-height:100vh}
button{cursor:pointer;font-family:var(--sans)}
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center}
.lcard{width:100%;max-width:360px;background:var(--white);border:1px solid var(--border2);border-radius:var(--rl);padding:40px 30px;box-shadow:var(--shadow-lg)}
.lbrand{font-size:22px;font-weight:600;color:var(--gold-d);text-align:center;margin-bottom:24px}
.lcard label{display:block;font-size:11px;color:var(--ink3);margin:10px 0 4px}
.lcard input{width:100%;padding:10px 12px;border:1px solid var(--border2);border-radius:var(--r);font-size:13px;background:var(--cream)}
.lbtn{width:100%;margin-top:18px;padding:12px;background:var(--gold-d);color:var(--cream);border:none;border-radius:var(--r);font-size:13px}
.lerr{min-height:16px;font-size:12px;color:var(--red);margin-top:8px;text-align:center}
.topbar{background:var(--ink);display:flex;align-items:center;padding:10px 18px;gap:10px;position:sticky;top:0;z-index:200}
.topbar .t{color:var(--gold-l);font-size:14px;font-weight:600}
.tlogout{margin-left:auto;padding:5px 12px;border:1px solid rgba(255,255,255,.14);border-radius:var(--r);background:none;color:rgba(255,255,255,.5);font-size:11px}
.content{padding:22px;max-width:1080px;margin:0 auto}
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--rl);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:14px}
.toolbar2{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.toolbar2 label{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:4px}
.toolbar2 input,.toolbar2 select{padding:7px 10px;border:1px solid var(--border2);border-radius:var(--r);font-size:13px;background:var(--cream);font-family:var(--sans)}
.btn{padding:9px 16px;border-radius:var(--r);font-size:13px;font-weight:500;border:none}
.bp{background:var(--gold-d);color:var(--cream)}.bs{background:var(--cream2);color:var(--ink2);border:1px solid var(--border2)}
.btn:disabled{opacity:.5}
.summary{display:flex;gap:22px;flex-wrap:wrap;font-size:13px;margin-top:4px}
.summary .it{display:flex;flex-direction:column;gap:1px}
.summary .lb{font-size:10px;color:var(--ink3);letter-spacing:.05em;text-transform:uppercase}
.summary b{font-size:19px}
.badge{display:inline-block;font-size:11px;font-weight:600;border-radius:5px;padding:2px 9px;white-space:nowrap}
.b-ok{background:#d7ecdd;color:#1a6640}.b-ng{background:var(--red-l);color:var(--red)}
.b-cancel{background:#ece7de;color:#9a8470}.b-wait{background:#f6ecd0;color:#8a6a1a}
.b-src-pos{background:#dde8f3;color:#0c447c}.b-src-app{background:#efe3d4;color:#8a5a1a}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:8px 10px;text-align:left;font-size:10px;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;border-bottom:1px solid var(--border2)}
td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.mono{font-family:var(--mono);font-size:11px}
.amt{font-family:var(--mono);text-align:right;white-space:nowrap}
.dim{color:var(--ink3)}
.err-txt{color:var(--red);font-size:11px;max-width:280px;white-space:normal;word-break:break-word}
.ec{text-align:center;color:var(--ink3);padding:26px}
tr.r-ng{background:#fdf6f4}
.copy{cursor:pointer;border:none;background:none;color:var(--gold-d);font-size:11px;padding:0 2px}
#toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:3000;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:#fff;font-size:13px;padding:9px 16px;border-radius:18px;box-shadow:var(--shadow-lg)}
.toast.err{background:var(--red)}.toast.inf{background:var(--teal)}
.btn.sm{padding:5px 10px;font-size:11px}
.b-card{background:#dde8f3;color:#0c447c}
#link-modal{position:fixed;inset:0;background:rgba(24,17,10,.45);z-index:1000;display:none;align-items:flex-start;justify-content:center;padding:24px;overflow-y:auto}
.lm-card{width:100%;max-width:520px;background:var(--white);border-radius:var(--rl);box-shadow:var(--shadow-lg);margin-top:30px}
.lm-head{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border);font-weight:600;font-size:15px}
.lm-head button{margin-left:auto;border:none;background:none;font-size:20px;color:var(--ink3);cursor:pointer}
.lm-body{padding:16px 18px}
.lm-pay{background:var(--cream2);border-radius:var(--r);padding:9px 12px;font-size:13px;margin-bottom:12px}
.lm-row{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.lm-row input[type=date]{padding:8px 10px;border:1px solid var(--border2);border-radius:var(--r);font-size:13px;background:var(--cream);font-family:var(--sans)}
.lm-visits{border:1px solid var(--border2);border-radius:var(--r);max-height:340px;overflow-y:auto}
.vrow{padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer;font-size:13px}
.vrow:last-child{border-bottom:none}
.vrow:hover{background:var(--cream)}
</style>
</head>
<body>

<div id="login-screen">
  <div class="lcard">
    <div class="lbrand">カード決済ログ</div>
    <label>メールアドレス</label><input id="lemail" type="email">
    <label>パスワード</label><input id="lpass" type="password">
    <div class="lerr" id="lerr"></div>
    <button class="lbtn" id="lbtn">ログイン</button>
  </div>
</div>

<div id="app" style="display:none">
  <div class="topbar"><span class="t">💳 カード決済ログ</span><span id="temail" style="color:rgba(255,255,255,.4);font-size:11px"></span><button class="tlogout" id="btn-logout">ログアウト</button></div>
  <div class="content">
    <div class="card">
      <div class="toolbar2">
        <label>期間
          <select id="f-range">
            <option value="today">今日</option>
            <option value="7">直近7日</option>
            <option value="30" selected>直近30日</option>
            <option value="all">全期間</option>
          </select>
        </label>
        <label>状態
          <select id="f-status">
            <option value="all">すべて</option>
            <option value="succeeded">成功</option>
            <option value="failed">失敗</option>
            <option value="canceled">中止</option>
            <option value="pending">処理中/未処理</option>
          </select>
        </label>
        <button class="btn bp" id="btn-reload">🔄 更新</button>
      </div>
      <div class="summary" id="summary" style="display:none"></div>
    </div>

    <div class="card">
      <div class="tw"><table id="tbl">
        <thead><tr>
          <th>日時</th><th>状態</th><th>経路</th><th style="text-align:right">金額</th>
          <th>ブランド</th><th>PaymentIntent</th><th>対象来場</th><th>エラー/備考</th>
        </tr></thead>
        <tbody id="rows"><tr><td colspan="8" class="ec">読込中…</td></tr></tbody>
      </table></div>
    </div>
  </div>
</div>

<div id="link-modal">
  <div class="lm-card">
    <div class="lm-head">決済を来場に紐づけ<button id="lm-close">×</button></div>
    <div class="lm-body">
      <div class="lm-pay" id="lm-pay"></div>
      <div class="lm-row">
        <label style="font-size:12px;color:var(--ink2)">日付</label>
        <input type="date" id="lm-date">
        <button class="btn bp sm" id="lm-search">この日の来場を表示</button>
      </div>
      <div class="lm-visits" id="lm-visits"></div>
    </div>
  </div>
</div>

<div id="toasts"></div>

<script>
if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
var auth=firebase.auth(), db=firebase.firestore();
var fbFunctions=firebase.app().functions('us-central1'); // 決済系関数は us-central1
function g(id){return document.getElementById(id);}
function gv(id){var e=g(id);return e?String(e.value).trim():"";}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function toast(m,t){var d=document.createElement("div");d.className="toast"+(t?" "+t:"");d.textContent=m;g("toasts").appendChild(d);setTimeout(function(){d.remove();},3200);}

var allRows=[], members=[];

// ── 認証 ─────────────────────────────────────────────
AuthRole.requireOwner(auth,function(user){
  g("login-screen").style.display="none";g("app").style.display="block";g("temail").textContent=user.email;
  loadMembers();
  load();
},function(){ g("login-screen").style.display="flex";g("app").style.display="none"; });
g("lbtn").addEventListener("click",function(){
  var e=gv("lemail"),p=g("lpass").value;g("lerr").textContent="";
  if(!e||!p){g("lerr").textContent="入力してください";return;}
  auth.signInWithEmailAndPassword(e,p).catch(function(err){g("lerr").textContent="ログイン失敗: "+err.message;});
});
g("lpass").addEventListener("keydown",function(e){if(e.key==="Enter")g("lbtn").click();});
g("btn-logout").addEventListener("click",function(){auth.signOut();});
g("btn-reload").addEventListener("click",load);
g("f-range").addEventListener("change",load);
g("f-status").addEventListener("change",render);

function pad2(n){return(n<10?"0":"")+n;}
function fmtTs(ts){
  if(!ts||!ts.toDate) return "—";
  var d=ts.toDate();
  return d.getFullYear()+"/"+pad2(d.getMonth()+1)+"/"+pad2(d.getDate())+" "+pad2(d.getHours())+":"+pad2(d.getMinutes())+":"+pad2(d.getSeconds());
}
function statusBadge(s){
  if(s==="succeeded") return "<span class='badge b-ok'>成功</span>";
  if(s==="failed")    return "<span class='badge b-ng'>失敗</span>";
  if(s==="canceled")  return "<span class='badge b-cancel'>中止</span>";
  if(s==="processing")return "<span class='badge b-wait'>処理中</span>";
  return "<span class='badge b-wait'>未処理</span>"; // pending
}
// 経路: app=アプリ手入力 / checkout=会計画面 / 旧データ(未設定)=会計画面扱い
function sourceBadge(src){
  if(src==="app") return "<span class='badge b-src-app'>手入力</span>";
  return "<span class='badge b-src-pos'>会計画面</span>";
}
// 会計方法コード → ラベル（checkin.html と対応）
var PAY_LABEL={"0":"現金","1":"PayPay","2":"カード","3":"PayPal","5":"ツケ","6":"デポジット","9":"その他"};
function payLabel(code){
  if(code==null||code==="") return "<span class='dim'>未会計</span>";
  var l=PAY_LABEL[String(code)]||("方法"+esc(code));
  return code==="2"?("<span class='badge b-card'>"+l+"</span>"):("<span class='dim'>"+l+"</span>");
}
function fmtHM(t){ t=String(t||""); return t.length>=4?(t.slice(0,2)+":"+t.slice(2,4)):"—"; }
async function loadMembers(){
  try{ var ms=await db.collection("members").get(); members=ms.docs.map(function(d){return Object.assign({id:d.id},d.data());}); }catch(e){}
}
function memberName(mid){
  if(!mid) return "非会員";
  var m=members.find(function(x){ return x.id===mid||x.memberId===mid||x.realId===mid||x.displayId===mid; });
  return m?(m.nickname||m.name||m.displayId||m.memberId||m.id):String(mid);
}

// ── カードブランド／読み取り方法（Stripeから取得） ─────────────
var BRAND_LABEL={visa:"Visa",mastercard:"Mastercard",amex:"Amex",american_express:"Amex",jcb:"JCB",discover:"Discover",diners:"Diners",diners_club:"Diners",unionpay:"UnionPay",interac:"Interac"};
function brandLabel(b){ if(!b) return ""; return BRAND_LABEL[String(b).toLowerCase()]||String(b); }
function readMethodLabel(rm){
  if(!rm) return "";
  rm=String(rm);
  if(rm.indexOf("contactless")===0) return "タッチ";
  if(rm==="contact_emv") return "挿入(IC)";
  if(rm.indexOf("magnetic")===0) return "スワイプ";
  return rm;
}
function brandCell(r){
  if(r.status!=="succeeded"||!r.paymentIntentId) return "<span class='dim'>—</span>";
  if(!r.cardInfoFetched) return "<span class='dim'>取得中…</span>";
  var b=brandLabel(r.cardBrand), rm=readMethodLabel(r.cardReadMethod);
  if(!b&&!rm) return "<span class='dim'>不明</span>";
  var last4=r.cardLast4?(" <span class='dim mono'>****"+esc(r.cardLast4)+"</span>"):"";
  return "<b>"+esc(b||"?")+"</b>"+(rm?" <span class='dim'>("+esc(rm)+")</span>":"")+last4;
}
// 成功・PaymentIntentあり・未取得 の行について、Stripeからブランドを取得して保存(キャッシュ)する。
var _enriching=false;
async function enrichBrands(rows){
  if(_enriching) return; _enriching=true;
  try{
    for(var i=0;i<rows.length;i++){
      var r=rows[i];
      if(r.status!=="succeeded"||!r.paymentIntentId||r.cardInfoFetched) continue;
      try{
        var res=await fbFunctions.httpsCallable("terminalChargeInfo")({paymentIntentId:r.paymentIntentId});
        var d=res.data||{};
        r.cardBrand=d.brand||""; r.cardReadMethod=d.readMethod||""; r.cardLast4=d.last4||""; r.cardInfoFetched=true;
        db.collection("terminalPayments").doc(r.id).update({
          cardBrand:r.cardBrand, cardReadMethod:r.cardReadMethod, cardLast4:r.cardLast4, cardInfoFetched:true
        }).catch(function(){});
        var cell=document.querySelector("[data-brand='"+r.id+"']");
        if(cell) cell.innerHTML=brandCell(r);
      }catch(e){ /* 1件失敗しても続行 */ }
    }
  } finally { _enriching=false; }
}

async function load(){
  g("rows").innerHTML="<tr><td colspan='8' class='ec'>読込中…</td></tr>";
  g("summary").style.display="none";
  try{
    var q=db.collection("terminalPayments").orderBy("createdAt","desc");
    var range=gv("f-range");
    if(range!=="all"){
      var days=(range==="today"?0:parseInt(range,10));
      var since=new Date(); since.setHours(0,0,0,0); since.setDate(since.getDate()-days);
      q=q.where("createdAt",">=",firebase.firestore.Timestamp.fromDate(since));
    }
    q=q.limit(500);
    var snap=await q.get();
    allRows=snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    render();
  }catch(e){
    g("rows").innerHTML="<tr><td colspan='8' class='ec'>読込失敗: "+esc(e.message)+"</td></tr>";
  }
}

function render(){
  var fs=gv("f-status");
  var rows=allRows.filter(function(r){ return fs==="all" || String(r.status)===fs; });

  // 集計（成功のみ金額合計）
  var okCnt=0, okSum=0, ngCnt=0, otherCnt=0;
  allRows.forEach(function(r){
    if(r.status==="succeeded"){ okCnt++; okSum+=Number(r.amount)||0; }
    else if(r.status==="failed") ngCnt++;
    else otherCnt++;
  });
  g("summary").style.display="flex";
  g("summary").innerHTML=
    "<div class='it'><span class='lb'>成功</span><b style='color:var(--teal)'>"+okCnt+"件</b></div>"+
    "<div class='it'><span class='lb'>成功金額計</span><b>¥"+okSum.toLocaleString()+"</b></div>"+
    "<div class='it'><span class='lb'>失敗</span><b style='color:var(--red)'>"+ngCnt+"件</b></div>"+
    "<div class='it'><span class='lb'>中止/処理中</span><b class='dim'>"+otherCnt+"件</b></div>";

  if(!rows.length){ g("rows").innerHTML="<tr><td colspan='8' class='ec'>該当する決済ログがありません</td></tr>"; return; }

  g("rows").innerHTML=rows.map(function(r){
    var pi=r.paymentIntentId?("<span class='mono'>"+esc(r.paymentIntentId)+"</span> <button class='copy' data-copy='"+esc(r.paymentIntentId)+"'>📋</button>"):"<span class='dim'>—</span>";
    var hasVk=r.visitKeys&&r.visitKeys.length;
    // 手入力(app)・成功・未紐づけ の決済は、後から来場に紐づけられる
    var canLink=(r.source==="app")&&(r.status==="succeeded")&&!hasVk;
    var vks=hasVk?("<span class='mono'>"+r.visitKeys.map(esc).join(", ")+"</span>")
           :(canLink?("<button class='btn bs sm' data-link='"+esc(r.id)+"'>🔗紐づけ</button>")
                    :"<span class='dim'>—</span>");
    var note=r.status==="failed"?("<span class='err-txt'>"+esc(r.errorMessage||"不明なエラー")+"</span>")
            :(r.status==="canceled"?"<span class='dim'>会計画面で中止</span>":"<span class='dim'>"+esc(r.description||"")+"</span>");
    return "<tr class='"+(r.status==="failed"?"r-ng":"")+"'>"+
      "<td class='mono'>"+esc(fmtTs(r.createdAt))+"</td>"+
      "<td>"+statusBadge(r.status)+"</td>"+
      "<td>"+sourceBadge(r.source)+"</td>"+
      "<td class='amt'>¥"+(Number(r.amount)||0).toLocaleString()+"</td>"+
      "<td data-brand='"+esc(r.id)+"'>"+brandCell(r)+"</td>"+
      "<td>"+pi+"</td>"+
      "<td>"+vks+"</td>"+
      "<td>"+note+"</td>"+
    "</tr>";
  }).join("");

  // 未取得のカードブランドを Stripe から取得（保存キャッシュ）。表示中の行のみ。
  enrichBrands(rows.slice());
}

g("rows").addEventListener("click",function(e){
  var cp=e.target.closest(".copy");
  if(cp){
    var t=cp.getAttribute("data-copy")||"";
    if(navigator.clipboard){ navigator.clipboard.writeText(t).then(function(){toast("コピーしました","inf");}); }
    return;
  }
  var lk=e.target.closest("[data-link]");
  if(lk){ openLink(lk.getAttribute("data-link")); }
});

// ── 手入力決済を来場に紐づけ ─────────────────────────────
var linkPayId=null;
function openLink(payId){
  var r=allRows.find(function(x){ return x.id===payId; }); if(!r) return;
  linkPayId=payId;
  g("lm-pay").innerHTML="決済: <b>¥"+(Number(r.amount)||0).toLocaleString()+"</b> ／ "+esc(fmtTs(r.createdAt));
  var d=(r.createdAt&&r.createdAt.toDate)?r.createdAt.toDate():new Date();
  g("lm-date").value=d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
  g("lm-visits").innerHTML="";
  g("link-modal").style.display="flex";
  searchVisits();
}
function closeLink(){ g("link-modal").style.display="none"; linkPayId=null; }
g("lm-close").addEventListener("click",closeLink);
g("link-modal").addEventListener("click",function(e){ if(e.target===g("link-modal")) closeLink(); });
g("lm-search").addEventListener("click",searchVisits);
g("lm-date").addEventListener("change",searchVisits);

async function searchVisits(){
  var dv=g("lm-date").value; if(!dv){ toast("日付を選択してください","err"); return; }
  var p=dv.split("-"); var yymmdd=p[0].slice(2)+p[1]+p[2];
  g("lm-visits").innerHTML="<div class='ec'>検索中…</div>";
  try{
    var snap=await db.collection("visits").where("visitDate","==",yymmdd).get();
    var vs=snap.docs.map(function(d){ return Object.assign({id:d.id},d.data()); });
    vs.sort(function(a,b){ return String(a.visitTime||a.id).localeCompare(String(b.visitTime||b.id)); });
    if(!vs.length){ g("lm-visits").innerHTML="<div class='ec'>この日の来場はありません</div>"; return; }
    g("lm-visits").innerHTML=vs.map(function(v){
      var amt=(v.amount!=null)?("¥"+Number(v.amount).toLocaleString()):"<span class='dim'>未会計</span>";
      var staff=v.isStaff?" <span class='badge b-src-app'>スタッフ</span>":"";
      return "<div class='vrow' data-vid='"+esc(v.id)+"'>"+
        "<span class='mono'>"+esc(fmtHM(v.visitTime))+"</span> <b>"+esc(memberName(v.memberId))+"</b>"+staff+
        " <span class='dim mono'>"+esc(v.id)+"</span>"+
        "<span style='float:right'>"+amt+" "+payLabel(v.payment)+"</span>"+
      "</div>";
    }).join("");
  }catch(e){ g("lm-visits").innerHTML="<div class='ec'>読込失敗: "+esc(e.message)+"</div>"; }
}

g("lm-visits").addEventListener("click",function(e){
  var row=e.target.closest(".vrow"); if(!row) return;
  confirmLink(row.getAttribute("data-vid"));
});

async function confirmLink(vid){
  var r=allRows.find(function(x){ return x.id===linkPayId; }); if(!r){ return; }
  try{
    var vsnap=await db.collection("visits").doc(vid).get();
    if(!vsnap.exists){ toast("来場が見つかりません","err"); return; }
    var v=vsnap.data();
    var payAmt=Number(r.amount)||0;
    var visitAmt=(v.amount!=null)?Number(v.amount):null;
    if(visitAmt===null || visitAmt!==payAmt){
      var msg="金額が違いますがよろしいですか？\n\n来場の金額: "+(visitAmt===null?"未会計":("¥"+visitAmt.toLocaleString()))
             +"\n決済の金額: ¥"+payAmt.toLocaleString();
      if(!window.confirm(msg)) return;
    }
    var batch=db.batch();
    batch.update(db.collection("terminalPayments").doc(linkPayId),{
      visitKeys:[vid],
      linkedVisitAt:firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    batch.update(db.collection("visits").doc(vid),{ payment:"2" });
    await batch.commit();
    toast(memberName(v.memberId)+" に紐づけました（会計方法=カード）","inf");
    closeLink();
    load();
  }catch(e){ toast("紐づけ失敗: "+e.message,"err"); }
}
</script>
