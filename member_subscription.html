<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>テキーラ道場 — 会員プラン</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-functions-compat.js"></script>
<script>
var FIREBASE_CONFIG={
  apiKey:"AIzaSyD6a3i-N1RyXyAfXmztPQrYtx4x62YGth0",
  authDomain:"tequiladojo.firebaseapp.com",
  projectId:"tequiladojo",
  storageBucket:"tequiladojo.firebasestorage.app",
  messagingSenderId:"56663296233",

<style>
:root{
  --ink:#18110a;--ink2:#4a3820;--ink3:#9a8470;
  --gold:#c8921e;--gold-l:#e8b84a;--gold-d:#7a5610;
  --cream:#faf7f1;--cream2:#f0ebe0;--cream3:#e4ddd0;--white:#fff;
  --red:#b03020;--teal:#1a6e58;
  --bg:#e7e2f4;--bg2:#d6cfec;
  --border:rgba(160,130,100,.18);--border2:rgba(160,130,100,.32);
  --shadow:0 1px 12px rgba(24,17,10,.07);--shadow-lg:0 6px 36px rgba(24,17,10,.13);
  --r:8px;--rl:14px;
  --serif:'Hiragino Mincho ProN','Yu Mincho',serif;
  --sans:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  --mono:'SFMono-Regular',Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:linear-gradient(180deg,var(--bg),var(--bg2));background-attachment:fixed;color:var(--ink);min-height:100vh}
button{cursor:pointer;font-family:var(--sans)}
#login-screen{display:none;min-height:100vh;align-items:center;justify-content:center;padding:24px}
.lcard{width:100%;max-width:360px;background:var(--white);border:1px solid var(--border2);border-radius:var(--rl);padding:40px 30px;box-shadow:var(--shadow-lg)}
.llogo{text-align:center;font-size:40px;margin-bottom:6px}
.lbrand{font-family:var(--serif);font-size:22px;color:var(--gold-d);letter-spacing:.1em;text-align:center}
.lsub{text-align:center;font-size:10px;letter-spacing:.18em;color:var(--ink3);margin-bottom:24px}
.lcard label{display:block;font-size:10px;color:var(--ink3);margin:12px 0 4px}
.lcard input{width:100%;padding:11px 12px;border:1px solid var(--border2);border-radius:var(--r);font-size:13px;background:var(--cream)}
.lerr{min-height:16px;font-size:12px;color:var(--red);margin-top:8px;text-align:center}
.lbtn{width:100%;margin-top:18px;padding:12px;background:var(--gold-d);color:var(--cream);border:none;border-radius:var(--r);font-size:13px}
.hdr{background:var(--ink);padding:0 16px;height:56px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:40;border-bottom:2px solid var(--gold-d);box-shadow:0 2px 14px rgba(24,17,10,.25)}
.hdr-title{font-family:var(--serif);font-size:18px;color:var(--gold-l);letter-spacing:.06em}
.hdr-right{margin-left:auto}
.hdr-nav{padding:6px 11px;border:1px solid rgba(255,255,255,.16);border-radius:6px;color:var(--gold-l);font-size:11px;text-decoration:none}
#app{display:none}
.wrap{max-width:760px;margin:0 auto;padding:18px 14px 60px}
.banner{border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:16px}
.banner.ok{background:#e5f2ec;color:var(--teal);border:1px solid #b7dccb}
.banner.warn{background:#fbf1d5;color:var(--gold-d);border:1px solid #ecd9a0}
.cur{background:var(--white);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:18px 20px;margin-bottom:22px}
.cur-lbl{font-size:11px;color:var(--ink2)}
.cur-name{font-family:var(--serif);font-size:22px;color:var(--gold-d);margin-top:2px}
.cur-sub{font-size:12px;color:var(--ink);margin-top:4px}
.cur-actions{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap}
/* 現在のプラン: 名前とサブスク管理ボタンを同じ行に（ボタンは右寄せ・行数削減） */
.cur-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.cur-head .cur-actions{margin-left:auto;justify-content:flex-end}
/* 有料会員: 落ち着いた金枠で強調（きらきら演出なし） */
.cur.paid{
  border:2px solid var(--gold);
  box-shadow:0 0 0 1px rgba(200,146,30,.22),0 4px 16px rgba(60,40,90,.12);
}
.btn{border:none;border-radius:var(--r);padding:9px 15px;font-size:13px;font-weight:500}
.bp{background:var(--gold-d);color:var(--cream)}
.bg2{background:var(--cream2);color:var(--ink2);border:1px solid var(--border2)}
/* セクション見出し（ヒーロー） */
.sect-hero{margin:6px 2px 18px;padding-bottom:16px;border-bottom:1px solid rgba(90,70,120,.22)}
.sect-eyebrow{font-size:10px;letter-spacing:.3em;color:#4a3382;font-weight:700;text-transform:uppercase}
.sect-title{font-family:var(--serif);font-size:25px;color:#150e1f;margin:5px 0 0;letter-spacing:.04em}
.sect-lead{font-size:13px;color:#241f31;margin-top:7px;line-height:1.7;font-weight:500}
/* プランカード：全カード等高・ボタン位置を揃える */
.plan-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:16px;align-items:stretch}
.pcard{position:relative;overflow:hidden;background:var(--white);border:2px solid var(--tier,var(--border));border-radius:16px;box-shadow:var(--shadow);padding:24px 18px 20px;display:flex;flex-direction:column;height:100%;transition:transform .18s ease,box-shadow .18s ease}
.pcard::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:var(--tier,var(--cream3))}
.pcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.pcard.current{box-shadow:0 0 0 3px rgba(200,146,30,.32),0 6px 20px rgba(60,40,90,.16)}
.pc-name{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--ink);min-height:26px}
.pc-price{font-family:var(--serif);font-size:23px;color:var(--gold-d);margin:6px 0 0;min-height:30px;letter-spacing:.01em}
.pc-price .per{font-family:var(--sans);font-size:11px;color:var(--ink2);margin-left:3px}
.pc-feats{list-style:none;margin:14px 0 16px;padding:14px 0 0;border-top:1px dashed var(--border2);font-size:12.5px;color:var(--ink);font-weight:500;display:flex;flex-direction:column;gap:8px}
.pc-feats li{display:flex;gap:8px;align-items:center}
.pc-feats li .ck{flex:none;width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:#e5f2ec;color:#1a6e58;border:1px solid #b7dccb}
.pc-feats li .fi{flex:none;width:18px;text-align:center}
.pc-feats li.off{color:#6f6152;font-weight:400}
.pc-feats li.off .ck{background:var(--cream2);color:var(--ink3);border-color:var(--border2)}
.pc-btn{padding:12px;border-radius:10px;border:none;font-size:13px;font-weight:700;letter-spacing:.02em;background:linear-gradient(135deg,#e8b84a,#c8921e);color:#3a2600;box-shadow:0 2px 10px rgba(200,146,30,.35);transition:filter .15s}
.pc-btn:hover{filter:brightness(1.06)}
.pc-btn.cur{background:var(--cream2);color:var(--ink3);cursor:default;box-shadow:none;font-weight:600}
.empty{text-align:center;color:var(--ink3);padding:40px 20px;font-size:13px;background:var(--white);border:1px dashed var(--cream3);border-radius:16px}
.note{font-size:11.5px;color:var(--ink);margin-top:22px;line-height:1.8;background:var(--white);border:1px solid var(--border);border-radius:12px;padding:15px 17px}
#toasts{position:fixed;bottom:18px;right:18px;z-index:9999;display:flex;flex-direction:column;gap:6px}
.toast{background:var(--ink);color:#fff;font-size:12px;padding:9px 14px;border-radius:8px;box-shadow:var(--shadow-lg);opacity:0;transform:translateY(8px);transition:.25s}
.toast.show{opacity:1;transform:none}
.toast.err{background:var(--red)}
</style>
</head>
<body>

<div id="login-screen">
  <div class="lcard">
    <div class="llogo">🎫</div>
    <div class="lbrand">テキーラ道場</div>
    <div class="lsub">会員プラン</div>
    <label>メールアドレス</label>
    <input type="email" id="lemail" autocomplete="username">
    <label>パスワード</label>
    <input type="password" id="lpass" autocomplete="current-password">
    <div class="lerr" id="lerr"></div>
    <button class="lbtn" id="lbtn">ログイン</button>
  </div>
</div>

<div id="app">
  <div class="hdr">
    <div class="hdr-title">🎫 会員プラン</div>
    <div class="hdr-right"><a class="hdr-nav" href="/member.html">📚 会員コンテンツ</a> <a class="hdr-nav" href="/" style="margin-left:6px">🏠 TOP</a></div>
  </div>
  <div class="wrap">
    <div id="banner"></div>
    <div class="sect-hero">
      <div class="sect-eyebrow">Membership</div>
      <h2 class="sect-title">会員プラン</h2>
      <div class="sect-lead">テキーラ道場をもっと楽しむための会員プラン。無料会員から、限定コンテンツを解放する有料プランまでご用意しています。</div>
    </div>
    <div class="cur" id="cur"></div>
    <div class="plan-grid" id="plan-grid"></div>
    <div class="empty" id="plan-empty" style="display:none;">現在ご案内できる有料プランはありません。</div>
    <div class="note">
      ・お支払いはクレジットカード（Stripe）による毎月の自動更新です。<br>
      ・解約は「サブスクを管理・解約」からいつでも可能です（次回更新日以降の課金が停止します）。<br>
      ・詳細は<a href="/tokushoho.html" style="color:var(--gold-d)">特定商取引法に基づく表記</a>をご確認ください。
    </div>
  </div>
</div>

<div id="toasts"></div>

<script>
firebase.initializeApp(FIREBASE_CONFIG);
var auth=firebase.auth(), db=firebase.firestore();
var fns=firebase.app().functions(); // us-central1（Stripe関数）
function g(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(msg,type){
  var el=document.createElement('div'); el.className='toast'+(type?' '+type:''); el.textContent=msg;
  g('toasts').appendChild(el);
  requestAnimationFrame(function(){requestAnimationFrame(function(){el.classList.add('show');});});
  setTimeout(function(){el.classList.remove('show');setTimeout(function(){el.remove();},300);},3200);
}
function errMsg(e){ return (e&&e.message)?e.message:'エラーが発生しました'; }
// 価格表示: 「¥1,000/月」の「/月」を小さめ表記に分割
function priceHtml(label, isPaid){
  var s=esc(label||(isPaid?'—':'無料'));
  var i=s.indexOf('/');
  return (i>0) ? s.slice(0,i)+'<span class="per">/'+s.slice(i+1)+'</span>' : s;
}
// プラン名称・グレードに合わせた枠線色（無料=黒）
function tierColor(p){
  var lvl=Number(p.level||0), n=String(p.name||'');
  if(lvl<=0) return '#1a1a1a';                       // 無料 = 黒
  if(/プラチ|platinum/i.test(n)) return '#7d8391';   // プラチナ
  if(/ゴール|ゴールド|gold/i.test(n)) return '#c8921e'; // ゴールド
  if(/シルバ|silver/i.test(n)) return '#9aa1a8';     // シルバー
  if(/ブロン|bronze/i.test(n)) return '#b5723a';     // ブロンズ
  return ['#1a1a1a','#b5723a','#9aa1a8','#c8921e','#7d8391'][Math.min(lvl,4)]; // フォールバック
}

var myMember={}, plans=[];

// ?checkout=success / cancel のバナー
(function(){
  var p=new URLSearchParams(location.search).get('checkout');
  if(p==='success') g('banner').innerHTML='<div class="banner ok">✓ お申し込みありがとうございます。反映まで少し時間がかかる場合があります。</div>';
  else if(p==='cancel') g('banner').innerHTML='<div class="banner warn">お手続きはキャンセルされました。</div>';
})();

AuthRole.requireMember(auth, function(user){
  g('app').style.display='block';
  init(user);
}, function(){ g('login-screen').style.display='flex'; });
g('lbtn').addEventListener('click',function(){
  auth.signInWithEmailAndPassword((g('lemail').value||'').trim(),g('lpass').value).catch(function(e){ g('lerr').textContent=e.message; });
});
g('lpass').addEventListener('keydown',function(e){ if(e.key==='Enter') g('lbtn').click(); });

async function init(user){
  try{
    var snap=await db.collection('members').where('authUid','==',user.uid).limit(1).get();
    myMember=snap.empty?{}:Object.assign({id:snap.docs[0].id},snap.docs[0].data());
    plans=await MemberPlan.loadPlans(db);
    render();
  }catch(e){ toast('読み込み失敗: '+errMsg(e),'err'); }
}

function render(){
  var eff=MemberPlan.effectivePlan(myMember, plans);
  var status=myMember.subscriptionStatus;
  var hasSub=(status==='active');
  var isPastDue=(status==='past_due');
  // 支払い遅延が1ヶ月以上続いたら「休会中」扱い（猶予は無期限・自動解約はしない）
  var pastDueMs=(myMember.subscriptionPastDueSince&&myMember.subscriptionPastDueSince.seconds)
    ? myMember.subscriptionPastDueSince.seconds*1000 : 0;
  var isSuspended=isPastDue&&pastDueMs&&((Date.now()-pastDueMs)>=30*24*3600*1000);
  // 現在のプラン
  var subInfo='';
  if(status){
    var st=isSuspended?'休会中（支払い停止中）'
      :{active:'有効',past_due:'支払い遅延',canceled:'解約済み'}[status]||status;
    subInfo='サブスク状態：'+esc(st);
    if(myMember.subscriptionPeriodEnd&&myMember.subscriptionPeriodEnd.seconds){
      var d=new Date(myMember.subscriptionPeriodEnd.seconds*1000);
      subInfo+='　/　次回更新：'+d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate();
    }
  }
  // 支払い遅延（past_due）の解消方法を明示する。1ヶ月以上経過（休会中）は文言を変える。
  var pastDueBox=isPastDue
    ? '<div class="banner warn" style="margin:12px 0 0">'
      +(isSuspended
        ? '<div style="font-weight:700;margin-bottom:4px">🛑 現在「休会中」です</div>'
          +'お支払いが1ヶ月以上確認できていないため、有料会員限定の機能は一時的にご利用いただけません。'
          +'下の<b>「お支払い方法を更新」</b>からお支払いが完了すると、その時点でプランと機能が復活します（猶予期間に期限はありません）。'
        : '<div style="font-weight:700;margin-bottom:4px">⚠️ お支払いが確認できていません</div>'
          +'カードでの引き落としに失敗しました。お支払いが完了するまで、有料会員限定の機能はご利用いただけません。'
          +'下の<b>「お支払い方法を更新」</b>からカード情報を更新すると、自動的に再請求されプランがそのまま継続されます'
          +'（未払いの請求書もその場でお支払いいただけます）。1ヶ月以上お支払いがない場合は「休会中」となります。')
      +'</div>'
    : '';
  // 有料会員（サブスク有効/遅延、または手動割当の有料プラン）のみ最上部に表示・強調。
  // 無料会員は最上部に出さず、下のプラン一覧の「無料会員」カードの「利用中」で示す。
  var isPaidMember=hasSub||isPastDue||!!(eff&&Number(eff.level||0)>0);
  var curBox=g('cur');
  if(!isPaidMember){
    curBox.className='cur';
    curBox.style.display='none';
    curBox.innerHTML='';
  } else {
    curBox.style.display='block';
    curBox.className='cur paid';
    var curActions=(isPastDue?'<button class="btn bp" onclick="openPortal()">お支払い方法を更新する</button>':'')
      +'<button class="btn bg2" onclick="openPortal()">サブスクを管理・解約</button>';
    curBox.innerHTML='<div class="cur-head">'
        +'<div>'
          +'<div class="cur-lbl">現在の会員プラン</div>'
          +'<div class="cur-name">'+esc(eff?eff.name:'—')+'</div>'
          +(subInfo?'<div class="cur-sub">'+subInfo+'</div>':'')
        +'</div>'
        +'<div class="cur-actions">'+curActions+'</div>'
      +'</div>'
      +pastDueBox;
  }

  // 表示プラン：無料会員(level0)＋購入可能な有料プラン(Stripe Price IDあり)
  // 無料会員のカードは「違いがわかるように」常に先頭へ表示する。
  // Firestore に level0 の文書が無い場合でも合成カードを出す。
  var free=MemberPlan.freePlan(plans);
  var paid=plans.filter(function(p){
    var active=(p.active===undefined||p.active===1||p.active==='1'||p.active===true);
    return active && p.stripePriceId && Number(p.level||0)>0;   // 有料：Price ID があるもの
  });
  // 無料会員カード（実データがあればそれを、無ければ合成）。名称は「無料会員」に統一。
  var freeCard=free
    ? Object.assign({}, free, {name:free.name||'無料会員'})
    : {id:'__free__', name:'無料会員', priceLabel:'無料', level:0, __synthetic:true};
  var display=[freeCard].concat(paid);
  if(!display.length){ g('plan-grid').innerHTML=''; g('plan-empty').style.display='block'; return; }
  g('plan-empty').style.display='none';
  // 機能の解放は「区分」で決める（Firestoreの個別フラグに依存しない）:
  //   無料枠 menu / map / library … 無料を含む全プランでアクティブ
  //   有料枠 movie / seminar / ptd  … 全ての有料プラン(level>0)でアクティブ
  var FREE_KEYS={menu:1,map:1,library:1};
  g('plan-grid').innerHTML=display.map(function(p){
    var isCurrent=eff ? (eff.id===p.id) : (p.id==='__free__');  // プラン未確定＝無料会員扱い
    var isPaid=Number(p.level||0)>0;
    var feats=MemberPlan.FEATURES.map(function(f){
      var on=FREE_KEYS[f.key]?true:isPaid;
      return '<li class="'+(on?'':'off')+'"><span class="ck">'+(on?'✓':'–')+'</span>'
        +'<span class="fi">'+f.icon+'</span>'+esc(f.label)+'</li>';
    }).join('');
    var btn=isCurrent
      ? '<button class="pc-btn cur" disabled>現在のプラン</button>'
      : (isPaid
        ? '<button class="pc-btn" onclick="subscribe(\''+esc(p.id)+'\',this)">このプランに申し込む</button>'
        : '<button class="pc-btn cur" disabled>登録無料で利用可</button>');
    var tc=tierColor(p);
    return '<div class="pcard'+(isCurrent?' current':'')+'" style="--tier:'+tc+';border-color:'+tc+'">'
      +'<div class="pc-name">'+esc(p.name)+'</div>'
      +'<div class="pc-price">'+priceHtml(p.priceLabel, isPaid)+'</div>'
      +'<ul class="pc-feats">'+feats+'</ul>'
      +btn
    +'</div>';
  }).join('');
}

function subscribe(planId, btn){
  if(btn){ btn.disabled=true; btn.textContent='処理中…'; }
  var _lang='ja'; try{ _lang=localStorage.getItem('td_lang')||'ja'; }catch(e){}
  fns.httpsCallable('createSubscriptionCheckout')({planId:planId, origin:location.origin, lang:_lang})
    .then(function(res){
      if(res.data&&res.data.url){ location.href=res.data.url; }
      else { toast('セッションを作成できませんでした','err'); if(btn){btn.disabled=false;btn.textContent='このプランに申し込む';} }
    })
    .catch(function(e){ toast(errMsg(e),'err'); if(btn){btn.disabled=false;btn.textContent='このプランに申し込む';} });
}
function openPortal(){
  fns.httpsCallable('createCustomerPortal')({origin:location.origin})
    .then(function(res){ if(res.data&&res.data.url) location.href=res.data.url; else toast('ポータルを開けませんでした','err'); })
    .catch(function(e){ toast(errMsg(e),'err'); });
}
</script>
<script src="/access-log.js?v=20260826"></script>
</body>
</html>
