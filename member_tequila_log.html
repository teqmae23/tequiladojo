<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>個人テキーラログ - テキーラ道場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Mono&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#18110a;--ink2:#4a3820;--ink3:#9a8470;
  --gold:#c8921e;--gold-l:#e8b84a;--gold-d:#7a5610;
  --red:#8c2818;--red-l:#fae8e4;
  --green:#1a6640;--green-l:#e4f2ea;
  --cream:#faf7f1;--cream2:#f0ebe0;--cream3:#e4ddd0;--white:#fff;
  --border:rgba(160,130,100,.18);--border2:rgba(160,130,100,.32);
  --shadow:0 1px 12px rgba(24,17,10,.07);--shadow-lg:0 6px 36px rgba(24,17,10,.13);
  --r:8px;--rl:14px;
  --sans:'Noto Sans JP',sans-serif;--mono:'DM Mono',monospace;
}
html,body{font-family:var(--sans);background:var(--cream);color:var(--ink);min-height:100vh}
button{cursor:pointer;font-family:var(--sans);border:none}
input,select,textarea{font-family:var(--sans)}
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse 80% 60% at 30% 60%,rgba(200,146,30,.07),transparent),var(--cream)}
.lcard{width:100%;max-width:360px;background:var(--white);border:1px solid var(--border2);border-radius:var(--rl);padding:40px 28px;box-shadow:var(--shadow-lg)}
.lbrand{font-size:24px;font-weight:600;color:var(--gold-d);letter-spacing:.14em;text-align:center;margin-bottom:6px}
.lsub{font-size:12px;color:var(--ink3);text-align:center;margin-bottom:28px}
.lcard label{display:block;font-size:10px;font-weight:500;color:var(--ink3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px;margin-top:14px}
.lcard input{width:100%;padding:11px 13px;border:1px solid var(--border2);border-radius:var(--r);font-size:14px;background:var(--cream);color:var(--ink);outline:none}
.lcard input:focus{border-color:var(--gold)}
.lerr{min-height:16px;font-size:12px;color:var(--red);margin-top:8px;text-align:center}
.lbtn{width:100%;margin-top:20px;padding:13px;background:var(--gold-d);color:var(--cream);border-radius:var(--r);font-size:14px;font-weight:500}
.lbtn:hover{background:var(--gold)}
.lbtn:disabled{background:var(--cream3);color:var(--ink3);cursor:not-allowed}
#main-screen{display:none;max-width:560px;margin:0 auto;padding:18px 14px 60px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:8px}
.title{font-size:20px;font-weight:700;color:var(--gold-d)}
.who{font-size:12px;color:var(--ink3)}
.linkbtn{font-size:12px;color:var(--ink2);background:var(--cream2);border:1px solid var(--border2);border-radius:var(--r);padding:6px 10px;text-decoration:none}
.addbar{display:flex;gap:8px;margin-bottom:16px}
.addbtn{flex:1;padding:13px;background:var(--gold-d);color:var(--cream);border-radius:var(--r);font-size:15px;font-weight:600}
.addbtn:hover{background:var(--gold)}
.gate{background:var(--white);border:1px solid var(--border);border-radius:var(--rl);padding:28px 20px;text-align:center;box-shadow:var(--shadow)}
.gate h2{font-size:16px;color:var(--gold-d);margin-bottom:10px}
.gate p{font-size:13px;color:var(--ink2);line-height:1.7}
/* コントロールバー（ソート・一括展開/折畳） */
.ctrlbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.ctrlbar select{padding:8px 10px;border:1px solid var(--border2);border-radius:var(--r);font-size:12px;background:var(--white);color:var(--ink2)}
.ctrlbar .spacer{flex:1}
.ctrlbar button{padding:8px 12px;border:1px solid var(--border2);border-radius:var(--r);font-size:12px;background:var(--cream2);color:var(--ink2)}
/* ツリー（折りたたみ） */
.tnode{margin-bottom:2px}
.tnode>.tbody{overflow:hidden}
.tnode[data-open="0"]>.tbody{display:none}
.thead{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.thead .caret{display:inline-block;font-size:10px;color:var(--ink3);transition:transform .15s;width:12px;text-align:center}
.tnode[data-open="0"]>.thead .caret{transform:rotate(-90deg)}
.thead .cnt{font-weight:400;color:var(--ink3);font-size:11px;margin-left:auto}
.tmh{font-size:15px;font-weight:700;color:var(--ink);padding:8px 2px;border-bottom:2px solid var(--gold-l);margin-bottom:2px}
.tmonth>.tbody{padding-left:6px}
.tdh{font-size:12px;font-weight:600;color:var(--ink2);padding:6px 2px}
.tday>.tbody{padding-left:6px;padding-bottom:4px}
.tph{font-size:12px;font-weight:600;color:var(--gold-d);padding:5px 2px}
.tplace>.tbody{padding-left:6px}
/* 明細行（1行コンパクト） */
.ent{display:flex;align-items:center;gap:6px;padding:7px 4px;border-bottom:1px solid var(--border);font-size:12px}
.ent .etime{font-family:var(--mono);font-size:11px;color:var(--ink3);flex:0 0 auto}
.ent .ename{font-weight:600;color:var(--ink);flex:1 1 auto;min-width:40px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ent .eicon{flex:0 0 auto;width:19px;height:19px;line-height:19px;text-align:center;border-radius:4px;background:var(--cream2);color:var(--gold-d);font-size:11px;font-weight:700}
.ent .eplace{flex:0 1 auto;max-width:82px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink3);font-size:11px}
.ent .eact{flex:0 0 auto;display:flex;gap:3px;margin-left:auto}
.ent .eact button{font-size:11px;padding:3px 7px;border-radius:4px;border:1px solid var(--border2);background:var(--cream2);color:var(--ink2)}
.ent .eact .del{color:var(--red);border-color:rgba(140,40,24,.3);background:var(--red-l)}
/* 詳細モーダル */
table.dtl{width:100%;border-collapse:collapse}
table.dtl th{text-align:left;font-size:11px;color:var(--ink3);font-weight:500;padding:9px 8px 9px 0;vertical-align:top;white-space:nowrap;width:56px}
table.dtl td{font-size:13px;color:var(--ink);padding:9px 0;border-bottom:1px solid var(--border);word-break:break-word}
.stars{color:var(--gold);font-size:14px;letter-spacing:1px}
.badge{display:inline-block;font-size:10px;font-weight:600;border-radius:4px;padding:1px 7px}
.b-dojo{background:#0d3d2e;color:#cdeede}
.empty{font-size:13px;color:var(--ink3);text-align:center;padding:22px}
/* モーダル */
.mbg{position:fixed;inset:0;background:rgba(24,17,10,.55);z-index:1000;display:none;align-items:flex-end;justify-content:center;padding:0}
.mbg.open{display:flex}
.modal{background:var(--white);border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--white)}
.mtitle{font-size:16px;font-weight:700;color:var(--gold-d)}
.mx{background:none;border:none;font-size:22px;color:var(--ink3)}
.mbody{padding:16px 20px}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:11px;font-weight:500;color:var(--ink3);margin-bottom:5px}
.fg input,.fg select,.fg textarea{width:100%;padding:11px 12px;border:1px solid var(--border2);border-radius:var(--r);font-size:15px;background:var(--cream);color:var(--ink);outline:none}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--gold)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{display:flex;align-items:center;gap:8px}
.pick .pv{flex:1;padding:11px 12px;border:1px solid var(--border2);border-radius:var(--r);font-size:14px;background:var(--cream);color:var(--ink);min-height:44px;display:flex;align-items:center;cursor:pointer}
.rate{display:flex;gap:4px;font-size:26px;color:var(--cream3)}
.rate span{cursor:pointer}
.rate span.on{color:var(--gold)}
.submit{width:100%;margin-top:6px;padding:14px;background:var(--gold-d);color:var(--cream);border-radius:var(--r);font-size:15px;font-weight:600}
.submit:hover{background:var(--gold)}
#bottle-list,#picker-list{max-height:56vh;overflow-y:auto;border:1px solid var(--border2);border-radius:var(--r);background:var(--white)}
.brow{padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer}
.brow .bn{font-size:14px;font-weight:600}
.brow .bb{font-size:11px;color:var(--ink3)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;padding:10px 18px;border-radius:20px;opacity:0;transition:opacity .2s;z-index:2000;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
/* 場所の街選択ボタン */
.pick .areabtn{flex:0 0 auto;padding:11px 12px;border:1px solid var(--border2);border-radius:var(--r);background:var(--cream2);color:var(--ink2);font-size:12px;white-space:nowrap}
.filternote{font-size:11px;color:var(--gold-d);margin-bottom:8px;display:none}
.filternote button{font-size:11px;color:var(--red);background:none;border:none;text-decoration:underline;padding:0 0 0 6px}
/* ボトル選択: クラス/お気に入りブランド ボタン */
.btnrow{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.chip{font-size:12px;padding:5px 10px;border:1px solid var(--border2);border-radius:14px;background:var(--white);color:var(--ink2)}
.chip.on{background:var(--gold-d);color:var(--cream);border-color:var(--gold-d)}
.chip.fav{background:var(--cream2)}
.chip.fav.on{background:var(--gold-d);color:var(--cream)}
/* ボトルツリー */
.btree .bnode{border-bottom:1px solid var(--border)}
.btree .bhead{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;padding:10px 6px}
.btree .bhead .caret{font-size:10px;color:var(--ink3);width:12px;text-align:center;transition:transform .15s}
.btree .bnode[data-open="0"]>.bhead .caret{transform:rotate(-90deg)}
.btree .bhead .bname{font-size:14px;font-weight:600;color:var(--ink);flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btree .bhead .bnom{font-size:11px;color:var(--ink3);font-family:var(--mono);flex:0 0 auto}
.btree .bnode[data-open="0"]>.bbody{display:none}
.btree .brow2{padding:9px 12px 9px 24px;border-top:1px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:8px}
.btree .brow2 .cls{flex:0 0 auto;width:19px;height:19px;line-height:19px;text-align:center;border-radius:4px;background:var(--cream2);color:var(--gold-d);font-size:11px;font-weight:700}
.btree .brow2 .bn2{font-size:13px;color:var(--ink)}
/* 設定パネル / チップ */
.setpanel{background:var(--white);border:1px solid var(--border);border-radius:var(--rl);margin-bottom:16px;box-shadow:var(--shadow)}
.sethead{display:flex;align-items:center;gap:6px;cursor:pointer;padding:11px 14px;font-size:13px;font-weight:600;color:var(--gold-d)}
.sethead .caret{font-size:10px;color:var(--ink3);transition:transform .15s}
.setpanel[data-open="0"] .sethead .caret{transform:rotate(-90deg)}
.setpanel[data-open="0"] .setbody{display:none}
.setbody{padding:0 14px 14px}
.setrow{margin-bottom:12px}
.setrow>label{display:block;font-size:11px;color:var(--ink3);margin-bottom:6px}
.setrow select{width:100%;padding:10px 12px;border:1px solid var(--border2);border-radius:var(--r);font-size:14px;background:var(--cream);color:var(--ink)}
.favchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.favchip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:5px 8px;border:1px solid var(--border2);border-radius:14px;background:var(--cream2);color:var(--ink2)}
.favchip button{background:none;border:none;color:var(--red);font-size:13px;line-height:1;padding:0}
.addchip{font-size:12px;padding:5px 10px;border:1px dashed var(--border2);border-radius:14px;background:var(--white);color:var(--gold-d)}
.pickrow{padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px}
.pickrow .pn{font-size:14px;font-weight:600;color:var(--ink)}
.pickrow .ps{font-size:11px;color:var(--ink3)}
.pickrow.on{background:var(--cream2)}
.pickrow .mk{font-size:12px;color:var(--green);font-weight:700}
/* お気に入り選択（選択済み上部・頭文字ナビ） */
.pickwrap{display:flex;gap:4px}
.picklist{flex:1;min-width:0;max-height:60vh;overflow-y:auto;border:1px solid var(--border2);border-radius:var(--r);background:var(--white)}
.navbar{flex:0 0 auto;display:flex;flex-direction:column;gap:0;align-self:flex-start}
.navb{font-size:10px;line-height:1.15;padding:1px 4px;border:none;background:none;color:var(--gold-d);border-radius:3px;cursor:pointer}
.navb.off{color:var(--cream3);cursor:default}
.pickrow.sel{background:var(--gold-d)}
.pickrow.sel .pn{color:var(--cream)}
.pickrow.sel .ps{color:rgba(255,255,255,.72)}
.pickrow .rmx{background:none;border:none;color:var(--cream);font-size:15px;line-height:1;flex:0 0 auto}
.pickdiv{height:0;border-top:2px solid var(--gold-l);margin:0}
.grphead{position:sticky;top:0;background:var(--cream2);color:var(--ink2);font-size:11px;font-weight:700;padding:3px 10px;border-bottom:1px solid var(--border);z-index:1}
/* 記録の場所選択（1行: ★ 名前 街） */
.brow1{display:flex;align-items:center;gap:6px;padding:11px 12px;border-bottom:1px solid var(--border);cursor:pointer}
.brow1 .star{color:var(--gold);font-size:12px;flex:0 0 auto}
.brow1 .nm{font-size:14px;font-weight:600;color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow1 .ct{font-size:12px;color:var(--ink3);margin-left:auto;flex:0 0 auto;white-space:nowrap}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-functions-compat.js"></script>
<script src="/member-plan.js?v=20260810"></script>
</head>
<body>

<!-- ログイン -->
<div id="login-screen">
  <div class="lcard">
    <div class="lbrand">テキーラ道場</div>
    <div class="lsub">個人テキーラログ（有料会員）</div>
    <label>会員ID または メールアドレス</label>
    <input id="l-id" type="text" autocomplete="username" placeholder="会員ID">
    <label>パスワード</label>
    <input id="l-pw" type="password" autocomplete="current-password" placeholder="パスワード">
    <div class="lerr" id="l-err"></div>
    <button class="lbtn" id="l-btn">ログイン</button>
    <div style="text-align:center;margin-top:16px;font-size:12px"><a href="/mypage.html" style="color:var(--ink3)">マイページへ</a></div>
  </div>
</div>

<!-- メイン -->
<div id="main-screen">
  <div class="topbar">
    <div><div class="title">🥃 個人テキーラログ</div><div class="who" id="who"></div></div>
    <div style="display:flex;gap:6px">
      <a class="linkbtn" href="/mypage.html">マイページ</a>
      <button class="linkbtn" id="btn-logout">ログアウト</button>
    </div>
  </div>

  <!-- 有料会員限定ゲート -->
  <div class="gate" id="gate" style="display:none">
    <h2>有料会員限定の機能です</h2>
    <p>個人テキーラログは有料会員向けの機能です。<br>ご利用にはプランのご登録が必要です。</p>
    <div style="margin-top:16px"><a class="linkbtn" href="/member_subscription.html">プランを見る</a></div>
  </div>

  <!-- ログUI -->
  <div id="log-ui" style="display:none">
    <div class="addbar">
      <button class="addbtn" id="btn-add">＋ 記録する</button>
    </div>
    <!-- 居住県（会員マスタから取得・表示） -->
    <div id="residence-line" style="font-size:12px;color:var(--ink3);margin-bottom:12px"></div>
    <!-- お気に入り設定（ブランド・店舗） -->
    <div class="setpanel" id="setpanel" data-open="0">
      <div class="sethead" onclick="toggleSet()"><span class="caret">▾</span>⭐ お気に入り設定（ブランド・店舗）</div>
      <div class="setbody">
        <div class="setrow">
          <label>お気に入りブランド（最大8・ボトル選択にボタン表示）</label>
          <div class="favchips" id="fav-brand-chips"></div>
        </div>
        <div class="setrow">
          <label>お気に入り店（場所選択の上位に表示）</label>
          <div class="favchips" id="fav-bar-chips"></div>
        </div>
      </div>
    </div>
    <!-- 有料会員登録後に1回だけ表示：過去の道場記録の取り込み -->
    <div id="backfill-banner" style="display:none;background:var(--green-l);border:1px solid #bfe0cd;border-radius:var(--r);padding:12px 14px;margin-bottom:16px">
      <div style="font-size:13px;color:var(--ink2);margin-bottom:8px;line-height:1.6">🥃 テキーラ道場で過去に飲んだ記録を、個人ログに取り込めます（初回のみ）。</div>
      <button id="btn-backfill" style="width:100%;padding:11px;background:var(--green);color:#fff;border:none;border-radius:var(--r);font-size:14px;font-weight:600">道場ログの過去分を取得</button>
    </div>
    <div class="ctrlbar" id="ctrlbar" style="display:none">
      <select id="sort-order">
        <option value="desc">新しい順</option>
        <option value="asc">古い順</option>
      </select>
      <div class="spacer"></div>
      <button id="btn-toggle-all">すべて折りたたむ</button>
    </div>
    <div id="tree"><div class="empty">読み込み中...</div></div>
  </div>
</div>

<!-- 入力/編集モーダル -->
<div class="mbg" id="m-edit">
  <div class="modal">
    <div class="mhead"><div class="mtitle" id="edit-title">テキーラを記録</div><button class="mx" id="edit-close">✕</button></div>
    <div class="mbody">
      <div class="fg" id="fg-auto-note" style="display:none;font-size:12px;color:var(--ink3);background:var(--cream2);padding:8px 10px;border-radius:var(--r)">
        道場で自動記録された分です。メモと評価のみ編集できます。
      </div>
      <div class="fg">
        <label>飲んだ日時</label>
        <input id="e-datetime" type="datetime-local">
      </div>
      <div class="fg" id="fg-bar">
        <label>飲んだ場所</label>
        <div class="pick"><div class="pv" id="e-bar-view" onclick="openBarPicker()">タップして選択</div><button type="button" class="areabtn" onclick="openAreaPicker()">街選択</button></div>
        <input id="e-bar-text" type="text" placeholder="場所名（自由入力）" style="margin-top:8px;display:none">
        <div id="e-bar-tz" style="font-size:11px;color:var(--ink3);margin-top:4px"></div>
      </div>
      <div class="fg" id="fg-bottle">
        <label>テキーラ（ボトル）</label>
        <div class="pick"><div class="pv" id="e-bottle-view" onclick="openBottlePicker()">タップして選択</div></div>
      </div>
      <div class="frow">
        <div class="fg" id="fg-style">
          <label>飲み方</label>
          <select id="e-style"></select>
        </div>
        <div class="fg" id="fg-amount">
          <label>量（ml）</label>
          <input id="e-amount" type="number" min="1" max="999" value="30">
        </div>
      </div>
      <div class="fg">
        <label>評価</label>
        <div class="rate" id="e-rate"><span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span><span data-v="4">★</span><span data-v="5">★</span></div>
      </div>
      <div class="fg">
        <label>テイスティングメモ</label>
        <textarea id="e-note" rows="3" placeholder="香り・味・余韻など"></textarea>
      </div>
      <button class="submit" id="e-save">保存する</button>
    </div>
  </div>
</div>

<!-- ボトル選択モーダル -->
<div class="mbg" id="m-bottle">
  <div class="modal">
    <div class="mhead"><div class="mtitle">ボトルを選択</div><button class="mx" id="bottle-close">✕</button></div>
    <div class="mbody">

// datetime-local(値: "YYYY-MM-DDTHH:MM") <-> 保存形式 "YYYYMMDDHHmm"
function dtLocalToStore(v){ if(!v) return ''; return v.replace(/[-T:]/g,'').slice(0,12); }
function storeToDtLocal(s){ if(!s||s.length<12) return ''; return s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8)+'T'+s.slice(8,10)+':'+s.slice(10,12); }
function nowDtLocal(){ var d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())+'T'+pad2(d.getHours())+':'+pad2(d.getMinutes()); }

// ── タイムゾーン: 現地の壁時計時刻(store形式) → JST(store形式) ──
// tzOffsetMs: 指定UTC時刻における tz のオフセット(ms) = (tzの壁時計) - UTC
function tzOffsetMs(utcMs, tz){
  try{
    var dtf=new Intl.DateTimeFormat('en-US',{timeZone:tz,hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
    var o={}; dtf.formatToParts(new Date(utcMs)).forEach(function(p){ o[p.type]=p.value; });
    var asUtc=Date.UTC(+o.year,+o.month-1,+o.day,+(o.hour==='24'?0:o.hour),+o.minute,+o.second);
    return asUtc-utcMs;
  }catch(e){ return 0; }
}
function localStoreToJst(localStore, tz){
  if(!localStore||localStore.length<12) return localStore;
  if(!tz || tz==='Asia/Tokyo') return localStore; // 既にJST相当
  var y=+localStore.slice(0,4),mo=+localStore.slice(4,6),d=+localStore.slice(6,8),h=+localStore.slice(8,10),mi=+localStore.slice(10,12);
  var guess=Date.UTC(y,mo-1,d,h,mi);
  var utc=guess-tzOffsetMs(guess,tz);       // 現地壁時計→UTC
  var jst=new Date(utc+9*3600000);          // JST = UTC+9
  return String(jst.getUTCFullYear())+pad2(jst.getUTCMonth()+1)+pad2(jst.getUTCDate())+pad2(jst.getUTCHours())+pad2(jst.getUTCMinutes());
}

function tzOfBar(id){ var b=barById(id); if(!b) return 'Asia/Tokyo'; var c=b.cityId?cities.find(function(x){return x.id===b.cityId;}):null; return (c&&c.tz)||'Asia/Tokyo'; }

async function doLogin(){
  const raw=(g('l-id').value||'').trim(), pw=g('l-pw').value;
  const btn=g('l-btn'), err=g('l-err');
  if(!raw||!pw){err.textContent='IDとパスワードを入力してください';return;}
  btn.disabled=true;btn.textContent='ログイン中...';err.textContent='';
  try{
    if(!raw.includes('@')){
      const res=await fbFunctions.httpsCallable('loginWithMemberId')({memberId:raw,password:pw});
      await auth.signInWithCustomToken(res.data.token);
    }else{ await auth.signInWithEmailAndPassword(raw,pw); }
  }catch(e){
    let msg='ログインできませんでした';
    if(e.code==='auth/invalid-credential'||e.code==='auth/wrong-password'||e.code==='auth/user-not-found'
      ||e.code==='functions/unauthenticated'||e.code==='functions/invalid-argument')msg='IDまたはパスワードが正しくありません';
    err.textContent=msg; btn.disabled=false; btn.textContent='ログイン';
  }
}

// ── マスタ読み込み ──────────────────────────────────────────
async function loadBottles(){
  try{
    const [bs, br]=await Promise.all([
      db.collection('bottles').where('production','==','0').get(),
      db.collection('brands').get()
    ]);
    br.docs.forEach(function(d){ brandsMap[d.id]=d.data(); });
    bottles=bs.docs.map(function(d){
      var b=d.data(); var brand=brandsMap[b.brandId]||{};
      var bn=b.bottleJa||b.bottleEs||b.bottleEn||d.id;
      var brn=brand.brandEs||brand.brandJa||'';
      // リスト表示はブランド名なしの銘柄名（例: 「1800 Anejo」）
      var esn=b.bottleEs||b.bottleEn||bn;
      return { id:d.id, name:bn, brand:brn, full:(brn?brn+' ':'')+bn, es:esn,
        brandId:bottleBrandId(d.id), nom:bottleNom(d.id), cls:bottleClass(d.id) };
    }).sort(function(a,b){ return a.full.localeCompare(b.full); });
  }catch(e){ console.warn('bottles load', e); bottles=[]; }
}

function bottleName(id){ var b=bottles.find(function(x){return x.id===id;}); return b?b.full:id; }
function bottleEsName(id, fallback){ var b=bottles.find(function(x){return x.id===id;}); return b?b.es:(fallback||id); }

// ── 自分のログ読み込み ──────────────────────────────────────
async function loadLogs(){
  try{
    const snap=await db.collection('tequilaLogs').where('authUid','==',auth.currentUser.uid).get();
    logs=snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    logs.sort(function(a,b){ return String(b.drunkAt||'').localeCompare(String(a.drunkAt||'')); });
    barCounts={}; logs.forEach(function(l){ var k=l.barId||''; barCounts[k]=(barCounts[k]||0)+1; });
    renderTree();
  }catch(e){ g('tree').innerHTML='<div class="empty">読み込みに失敗しました</div>'; }
}

function starStr(n){ n=Number(n)||0; var s=''; for(var i=1;i<=5;i++) s+=(i<=n?'★':'☆'); return s; }

function barLabelOf(l){
  if(l.barId==='HOME') return '自宅';
  var bmst=barById(l.barId);
  return l.barId==='B900001'?(l.barText||'その他'):(bmst?barDispName(bmst):(l.barId==='B00000'?'テキーラ道場':(l.barText||l.barId||'')));
}

function renderTree(){
  var el=g('tree');
  g('ctrlbar').style.display=logs.length?'flex':'none';
  if(!logs.length){ el.innerHTML='<div class="empty">まだ記録がありません。「＋ 記録する」から追加してください。</div>'; return; }
  var desc=(sortOrder!=='asc');
  function ord(keys){ keys.sort(); if(desc) keys.reverse(); return keys; }
  // 年月 → 日 グルーピング
  var ym={};
  logs.forEach(function(l){
    var d=String(l.drunkAt||'000000000000');
    var ymk=d.slice(0,6), day=d.slice(6,8);
    ym[ymk]=ym[ymk]||{}; (ym[ymk][day]=ym[ymk][day]||[]).push(l);
  });
  var html='';
  ord(Object.keys(ym)).forEach(function(ymk){
    var y=ymk.slice(0,4), mo=parseInt(ymk.slice(4,6),10), days=ym[ymk];
    var total=0; Object.keys(days).forEach(function(dd){ total+=days[dd].length; });
    html+='<div class="tnode tmonth" data-open="1">'
      +'<div class="thead tmh" onclick="toggleNode(this)"><span class="caret">▾</span>'+y+'年'+mo+'月<span class="cnt">'+total+'杯</span></div>'
      +'<div class="tbody">';
    ord(Object.keys(days)).forEach(function(dd){
      var items=days[dd].slice().sort(function(a,b){ var r=String(a.drunkAt||'').localeCompare(String(b.drunkAt||'')); return desc?-r:r; });
      html+='<div class="tnode tday" data-open="1">'
        +'<div class="thead tdh" onclick="toggleNode(this)"><span class="caret">▾</span>'+parseInt(dd,10)+'日<span class="cnt">'+items.length+'件</span></div>'
        +'<div class="tbody">';
      // 場所ごとにグルーピング（時刻ソート順の出現順を保持）
      var pOrder=[], pMap={};
      items.forEach(function(l){
        var pk=(l.barId==='B900001')?('B900001:'+(l.barText||'')):(l.barId||'');
        if(!pMap[pk]){ pMap[pk]={label:barLabelOf(l), items:[]}; pOrder.push(pk); }
        pMap[pk].items.push(l);
      });
      pOrder.forEach(function(pk){
        var pg=pMap[pk];
        html+='<div class="tnode tplace" data-open="1">'
          +'<div class="thead tph" onclick="toggleNode(this)"><span class="caret">▾</span>'+esc(pg.label)+'<span class="cnt">'+pg.items.length+'件</span></div>'
          +'<div class="tbody">';
        pg.items.forEach(function(l){ html+=entRow(l); });
        html+='</div></div>';
      });
      html+='</div></div>';
    });
    html+='</div></div>';
  });
  el.innerHTML=html;
  if(!allOpen) setAllOpen(false);
}

function entRow(l){
  var loc=String(l.drunkAtLocal||l.drunkAt||''); var tm=loc.length>=12?loc.slice(8,10)+':'+loc.slice(10,12):'';
  var isAuto=(l.source==='auto');
  var nm=bottleEsName(l.bottleId, l.bottleName);
  return '<div class="ent">'
    +'<span class="etime">'+tm+'</span>'
    +'<span class="ename">'+esc(nm)+'</span>'
    +'<span class="eicon" title="'+esc(STYLE_MAP[l.style]||l.style||'')+'">'+esc(styleIcon(l.style))+'</span>'
    +'<span class="eplace">'+esc(barLabelOf(l))+'</span>'
    +'<span class="eact">'
      +'<button onclick="openDetail(\''+esc(l.id)+'\')">詳</button>'
      +'<button onclick="openEdit(\''+esc(l.id)+'\')">編</button>'
      +(isAuto?'':'<button class="del" onclick="delLog(\''+esc(l.id)+'\')">削</button>')
    +'</span></div>';
}

function toggleNode(head){ var n=head.parentNode; n.setAttribute('data-open', n.getAttribute('data-open')==='1'?'0':'1'); }
function setAllOpen(open){
  allOpen=open;

function renderBottleTree(q){

    return true;
  });
  if(!list.length){ el.innerHTML='<div class="empty">該当するボトルがありません</div>'; return; }
  var order=[], map={};

    if(!map[b.brandId]){ map[b.brandId]={brandId:b.brandId, nom:b.nom, name:(b.brand||('NOM '+b.nom)), items:[]}; order.push(b.brandId); }
    map[b.brandId].items.push(b);
  });

  var autoOpen=(!!q || classActive() || !!bottleBrandFilter);

function renderBarList(q){

    return true;
  });

  pool.forEach(function(b){ rows.push({id:b.id, label:barDispName(b), city:cityNameOfBar(b), fav:false}); });
  if(q){ rows=rows.filter(function(r){ var b=barById(r.id); return (r.label+' '+r.city+' '+(b?((b.nameEn||'')+' '+(b.address||'')):'')).toLowerCase().indexOf(q)>=0; }); }

  }).join('');
}

// 選択済みを上部（濃色・✕）＋横線＋未選択（頭文字グループ）＋右ナビで頭文字ジャンプ
function renderPicker(o){
  var q=(o.query||'').trim().toLowerCase();
  var selSet={}; o.selected.forEach(function(id){selSet[id]=1;});
  var sel=[], un=[];
  o.items.forEach(function(it){
    if(q && (it.name+' '+(it.extra||'')).toLowerCase().indexOf(q)<0) return;
    (selSet[it.id]?sel:un).push(it);
  });
  function gi(x){ var i=o.groupOrder.indexOf(x); return i<0?999:i; }
  function cmp(a,b){ var d=gi(a.initial)-gi(b.initial); return d||(a.sortKey||a.name).localeCompare(b.sortKey||b.name,'ja'); }
  sel.sort(cmp); un.sort(cmp);
  var html='', present={};
  sel.forEach(function(it){ html+='<div class="pickrow sel" data-id="'+esc(it.id)+'"><div><div class="pn">'+esc(it.name)+'</div>'+(it.sub?'<div class="ps">'+esc(it.sub)+'</div>':'')+'</div><button class="rmx" data-id="'+esc(it.id)+'">✕</button></div>'; });
  if(sel.length) html+='<div class="pickdiv"></div>';
  var lastG=null;
  un.forEach(function(it){
    if(it.initial!==lastG){ html+='<div class="grphead" id="'+o.anchor+it.initial+'">'+esc(it.initial)+'</div>'; lastG=it.initial; present[it.initial]=1; }
    html+='<div class="pickrow" data-id="'+esc(it.id)+'"><div><div class="pn">'+esc(it.name)+'</div>'+(it.sub?'<div class="ps">'+esc(it.sub)+'</div>':'')+'</div></div>';
  });
  if(!sel.length && !un.length) html='<div class="empty">該当がありません</div>';
  o.listEl.innerHTML=html;
  o.navEl.innerHTML=o.groupOrder.map(function(gp){ var on=!!present[gp]; return '<button class="navb'+(on?'':' off')+'"'+(on?' data-anchor="'+o.anchor+gp+'"':'')+'>'+esc(gp)+'</button>'; }).join('');
}
function navScroll(e){ var b=e.target.closest('[data-anchor]'); if(!b) return; var a=document.getElementById(b.getAttribute('data-anchor')); if(a) a.scrollIntoView({block:'start'}); }

// お気に入りブランド選択
function brandItems(){ return brandListAll().map(function(b){ return {id:b.id, name:b.name, sub:'NOM '+(b.nom||'—'), extra:b.nom||'', initial:brandInitial(b.name)}; }); }
function openBrandPick(){ g('brandpick-search').value=''; renderBrandPick(''); g('m-brandpick').classList.add('open'); setTimeout(function(){g('brandpick-search').focus();},50); }
function renderBrandPick(q){ renderPicker({items:brandItems(), selected:favoriteBrandIds, groupOrder:BRAND_NAV, listEl:g('brandpick-list'), navEl:g('brandpick-nav'), anchor:'branav-', query:q}); }
g('brandpick-search').addEventListener('input',function(){ renderBrandPick(this.value); });
g('brandpick-close').addEventListener('click',function(){ g('m-brandpick').classList.remove('open'); });
g('brandpick-nav').addEventListener('click',navScroll);
g('brandpick-list').addEventListener('click',function(e){
  var row=e.target.closest('.pickrow'); if(!row) return;
  var id=row.getAttribute('data-id'), idx=favoriteBrandIds.indexOf(id);
  if(idx>=0){ favoriteBrandIds.splice(idx,1); }
  else { if(favoriteBrandIds.length>=8){ toast('お気に入りブランドは最大8件です'); return; } favoriteBrandIds.push(id); }
  savePref('favoriteBrandIds', favoriteBrandIds); renderBrandPick(g('brandpick-search').value); renderFavBrandChips();
});

// お気に入り店選択
function favBarItems(){ return bars.filter(function(b){return b.id!=='B900001';}).map(function(b){ var nm=barDispName(b); var kana=b.nameKana||''; return {id:b.id, name:nm, sub:cityNameOfBar(b)||b.address||'', extra:(b.nameEn||'')+' '+(b.address||'')+' '+kana, initial:barInitial(kana||nm), sortKey:(kana||nm)}; }); }
function openFavBar(){ g('favbar-search').value=''; renderFavBarPick(''); g('m-favbar').classList.add('open'); setTimeout(function(){g('favbar-search').focus();},50); }
function renderFavBarPick(q){ renderPicker({items:favBarItems(), selected:favoriteBarIds, groupOrder:BAR_NAV, listEl:g('favbar-list'), navEl:g('favbar-nav'), anchor:'barnav-', query:q}); }
g('favbar-search').addEventListener('input',function(){ renderFavBarPick(this.value); });
g('favbar-close').addEventListener('click',function(){ g('m-favbar').classList.remove('open'); });
g('favbar-nav').addEventListener('click',navScroll);
g('favbar-list').addEventListener('click',function(e){
  var row=e.target.closest('.pickrow'); if(!row) return;
  var id=row.getAttribute('data-id'), idx=favoriteBarIds.indexOf(id);
  if(idx>=0) favoriteBarIds.splice(idx,1); else favoriteBarIds.push(id);
  savePref('favoriteBarIds', favoriteBarIds); renderFavBarPick(g('favbar-search').value); renderFavBarChips();
});
</script>
</body>
