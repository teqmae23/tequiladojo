<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#18110a;--ink2:#4a3820;--ink3:#9a8470;
  --gold:#c8921e;--gold-l:#e8b84a;--gold-d:#7a5610;
  --red:#8c2818;--red-l:#fae8e4;
  --green:#1a6640;--green-l:#e4f2ea;
  --cream:#faf7f1;--cream2:#f0ebe0;--cream3:#e4ddd0;--white:#fff;
  --border:rgba(160,130,100,.18);--border2:rgba(160,130,100,.32);
  --shadow:0 1px 12px rgba(24,17,10,.07);--shadow-lg:0 6px 36px rgba(24,17,10,.13);
  --r:8px;--rl:14px;
  --sans:'Noto Sans JP',sans-serif;--mono:'DM Mono',monospace;
}
html,body{font-family:var(--sans);background:var(--cream);color:var(--ink);min-height:100vh}
button{cursor:pointer;font-family:var(--sans);border:none}
input,select,textarea{font-family:var(--sans)}
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse 80% 60% at 30% 60%,rgba(200,146,30,.07),transparent),var(--cream)}
.lcard{width:100%;max-width:360px;background:var(--white);border:1px solid var(--border2);border-radius:var(--rl);padding:40px 28px;box-shadow:var(--shadow-lg)}
.lbrand{font-size:24px;font-weight:600;color:var(--gold-d);letter-spacing:.14em;text-align:center;margin-bottom:6px}
.lsub{font-size:12px;color:var(--ink3);text-align:center;margin-bottom:28px}
.lcard label{display:block;font-size:10px;font-weight:500;color:var(--ink3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px;margin-top:14px}
.lcard input{width:100%;padding:11px 13px;border:1px solid var(--border2);border-radius:var(--r);font-size:14px;background:var(--cream);color:var(--ink);outline:none}
.lcard input:focus{border-color:var(--gold)}
.lerr{min-height:16px;font-size:12px;color:var(--red);margin-top:8px;text-align:center}
.lbtn{width:100%;margin-top:20px;padding:13px;background:var(--gold-d);color:var(--cream);border-radius:var(--r);font-size:14px;font-weight:500}
.lbtn:hover{background:var(--gold)}
.lbtn:disabled{background:var(--cream3);color:var(--ink3);cursor:not-allowed}
#main-screen{display:none;max-width:560px;margin:0 auto;padding:18px 14px 60px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:8px}
.title{font-size:20px;font-weight:700;color:var(--gold-d)}
.who{font-size:12px;color:var(--ink3)}
.linkbtn{font-size:12px;color:var(--ink2);background:var(--cream2);border:1px solid var(--border2);border-radius:var(--r);padding:6px 10px;text-decoration:none}
.addbar{display:flex;gap:8px;margin-bottom:16px}
.addbtn{flex:1;padding:13px;background:var(--gold-d);color:var(--cream);border-radius:var(--r);font-size:15px;font-weight:600}
.addbtn:hover{background:var(--gold)}
.gate{background:var(--white);border:1px solid var(--border);border-radius:var(--rl);padding:28px 20px;text-align:center;box-shadow:var(--shadow)}
.gate h2{font-size:16px;color:var(--gold-d);margin-bottom:10px}
.gate p{font-size:13px;color:var(--ink2);line-height:1.7}
/* コントロールバー（ソート・一括展開/折畳） */
.ctrlbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.ctrlbar select{padding:8px 10px;border:1px solid var(--border2);border-radius:var(--r);font-size:12px;background:var(--white);color:var(--ink2)}
.ctrlbar .spacer{flex:1}
.ctrlbar button{padding:8px 12px;border:1px solid var(--border2);border-radius:var(--r);font-size:12px;background:var(--cream2);color:var(--ink2)}
/* ツリー（折りたたみ） */
.tnode{margin-bottom:2px}
.tnode>.tbody{overflow:hidden}
.tnode[data-open="0"]>.tbody{display:none}
.thead{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.thead .caret{display:inline-block;font-size:10px;color:var(--ink3);transition:transform .15s;width:12px;text-align:center}
.tnode[data-open="0"]>.thead .caret{transform:rotate(-90deg)}
.thead .cnt{font-weight:400;color:var(--ink3);font-size:11px;margin-left:auto}
.tmh{font-size:15px;font-weight:700;color:var(--ink);padding:8px 2px;border-bottom:2px solid var(--gold-l);margin-bottom:2px}
.tmonth>.tbody{padding-left:6px}
.tdh{font-size:12px;font-weight:600;color:var(--ink2);padding:6px 2px}
.tday>.tbody{padding-left:6px;padding-bottom:4px}
/* 明細行（1行コンパクト） */
.ent{display:flex;align-items:center;gap:6px;padding:7px 4px;border-bottom:1px solid var(--border);font-size:12px}
.ent .etime{font-family:var(--mono);font-size:11px;color:var(--ink3);flex:0 0 auto}
.ent .ename{font-weight:600;color:var(--ink);flex:1 1 auto;min-width:40px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ent .eicon{flex:0 0 auto;width:19px;height:19px;line-height:19px;text-align:center;border-radius:4px;background:var(--cream2);color:var(--gold-d);font-size:11px;font-weight:700}
.ent .eplace{flex:0 1 auto;max-width:82px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink3);font-size:11px}
.ent .eact{flex:0 0 auto;display:flex;gap:3px;margin-left:auto}
.ent .eact button{font-size:11px;padding:3px 7px;border-radius:4px;border:1px solid var(--border2);background:var(--cream2);color:var(--ink2)}
.ent .eact .del{color:var(--red);border-color:rgba(140,40,24,.3);background:var(--red-l)}
/* 詳細モーダル */
table.dtl{width:100%;border-collapse:collapse}
table.dtl th{text-align:left;font-size:11px;color:var(--ink3);font-weight:500;padding:9px 8px 9px 0;vertical-align:top;white-space:nowrap;width:56px}
table.dtl td{font-size:13px;color:var(--ink);padding:9px 0;border-bottom:1px solid var(--border);word-break:break-word}
.stars{color:var(--gold);font-size:14px;letter-spacing:1px}
.badge{display:inline-block;font-size:10px;font-weight:600;border-radius:4px;padding:1px 7px}
.b-dojo{background:#0d3d2e;color:#cdeede}
.empty{font-size:13px;color:var(--ink3);text-align:center;padding:22px}
/* モーダル */
.mbg{position:fixed;inset:0;background:rgba(24,17,10,.55);z-index:1000;display:none;align-items:flex-end;justify-content:center;padding:0}
.mbg.open{display:flex}
.modal{background:var(--white);border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--white)}
.mtitle{font-size:16px;font-weight:700;color:var(--gold-d)}
.mx{background:none;border:none;font-size:22px;color:var(--ink3)}
.mbody{padding:16px 20px}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:11px;font-weight:500;color:var(--ink3);margin-bottom:5px}
.fg input,.fg select,.fg textarea{width:100%;padding:11px 12px;border:1px solid var(--border2);border-radius:var(--r);font-size:15px;background:var(--cream);color:var(--ink);outline:none}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--gold)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{display:flex;align-items:center;gap:8px}
.pick .pv{flex:1;padding:11px 12px;border:1px solid var(--border2);border-radius:var(--r);font-size:14px;background:var(--cream);color:var(--ink);min-height:44px;display:flex;align-items:center;cursor:pointer}
.rate{display:flex;gap:4px;font-size:26px;color:var(--cream3)}
.rate span{cursor:pointer}
.rate span.on{color:var(--gold)}
.submit{width:100%;margin-top:6px;padding:14px;background:var(--gold-d);color:var(--cream);border-radius:var(--r);font-size:15px;font-weight:600}
.submit:hover{background:var(--gold)}
#bottle-list,#picker-list{max-height:56vh;overflow-y:auto;border:1px solid var(--border2);border-radius:var(--r);background:var(--white)}
.brow{padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer}
.brow .bn{font-size:14px;font-weight:600}
.brow .bb{font-size:11px;color:var(--ink3)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;padding:10px 18px;border-radius:20px;opacity:0;transition:opacity .2s;z-index:2000;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
</style>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyD6a3i-N1RyXyAfXmztPQrYtx4x62YGth0",
  authDomain:"tequiladojo.firebaseapp.com",
  projectId:"tequiladojo",
  storageBucket:"tequiladojo.firebasestorage.app",
  messagingSenderId:"56663296233",
  appId:"1:56663296233:web:c8cac2fcbeb4faa09e0878"
});
const auth=firebase.auth();
const db=firebase.firestore();
const fbFunctions=firebase.app().functions('asia-northeast1');

const STYLES=[['straight','ストレート'],['soda','ソーダ割り'],['cocktail','カクテル'],['oyuwari','お湯割り'],['dashiwari','出汁割り'],['mizuwari','水割り'],['rock','ロック']];
const STYLE_MAP={}; STYLES.forEach(function(s){ STYLE_MAP[s[0]]=s[1]; });
// 飲み方の1文字アイコン（ス、ソ、水、氷、湯、他）
const STYLE_ICON={straight:'ス',soda:'ソ',mizuwari:'水',rock:'氷',oyuwari:'湯',dashiwari:'出',cocktail:'他'};
function styleIcon(s){ return STYLE_ICON[s]||'他'; }

let sortOrder='desc';   // 'desc'=新しい順 / 'asc'=古い順
let allOpen=true;       // すべて展開状態か

let currentMember=null;
let plans=[];
let bottles=[];        // {id, name, brand}
let brandsMap={};
let logs=[];
let editId=null;       // 編集中のログID（null=新規）
let editSource='manual';
let pickedBottleId='', pickedBottleName='';
let bars=[], cities=[];
let pickedBarId='B00000', pickedBarText='';
let ratingVal=0;

function g(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function toast(m){var t=g('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2600);}
function pad2(n){return String(n).padStart(2,'0');}

// datetime-local(値: "YYYY-MM-DDTHH:MM") <-> 保存形式 "YYYYMMDDHHmm"
function dtLocalToStore(v){ if(!v) return ''; return v.replace(/[-T:]/g,'').slice(0,12); }
function storeToDtLocal(s){ if(!s||s.length<12) return ''; return s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8)+'T'+s.slice(8,10)+':'+s.slice(10,12); }
function nowDtLocal(){ var d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())+'T'+pad2(d.getHours())+':'+pad2(d.getMinutes()); }

// ── タイムゾーン: 現地の壁時計時刻(store形式) → JST(store形式) ──
// tzOffsetMs: 指定UTC時刻における tz のオフセット(ms) = (tzの壁時計) - UTC
function tzOffsetMs(utcMs, tz){
  try{
    var dtf=new Intl.DateTimeFormat('en-US',{timeZone:tz,hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
    var o={}; dtf.formatToParts(new Date(utcMs)).forEach(function(p){ o[p.type]=p.value; });
    var asUtc=Date.UTC(+o.year,+o.month-1,+o.day,+(o.hour==='24'?0:o.hour),+o.minute,+o.second);
    return asUtc-utcMs;
  }catch(e){ return 0; }
}
function localStoreToJst(localStore, tz){
  if(!localStore||localStore.length<12) return localStore;
  if(!tz || tz==='Asia/Tokyo') return localStore; // 既にJST相当
  var y=+localStore.slice(0,4),mo=+localStore.slice(4,6),d=+localStore.slice(6,8),h=+localStore.slice(8,10),mi=+localStore.slice(10,12);
  var guess=Date.UTC(y,mo-1,d,h,mi);
  var utc=guess-tzOffsetMs(guess,tz);       // 現地壁時計→UTC
  var jst=new Date(utc+9*3600000);          // JST = UTC+9
  return String(jst.getUTCFullYear())+pad2(jst.getUTCMonth()+1)+pad2(jst.getUTCDate())+pad2(jst.getUTCHours())+pad2(jst.getUTCMinutes());
}
function barById(id){ return bars.find(function(b){return b.id===id;}); }
function barDispName(b){ return b?(b.nameJa||b.nameEn||b.nameEs||b.id):''; }
function tzOfBar(id){ var b=barById(id); if(!b) return 'Asia/Tokyo'; var c=b.cityId?cities.find(function(x){return x.id===b.cityId;}):null; return (c&&c.tz)||'Asia/Tokyo'; }

// ── ログイン ────────────────────────────────────────────────
async function doLogin(){
  const raw=(g('l-id').value||'').trim(), pw=g('l-pw').value;
  const btn=g('l-btn'), err=g('l-err');
  if(!raw||!pw){err.textContent='IDとパスワードを入力してください';return;}
  btn.disabled=true;btn.textContent='ログイン中...';err.textContent='';
  try{
    if(!raw.includes('@')){
      const res=await fbFunctions.httpsCallable('loginWithMemberId')({memberId:raw,password:pw});
      await auth.signInWithCustomToken(res.data.token);
    }else{ await auth.signInWithEmailAndPassword(raw,pw); }
  }catch(e){
    let msg='ログインできませんでした';
    if(e.code==='auth/invalid-credential'||e.code==='auth/wrong-password'||e.code==='auth/user-not-found'
      ||e.code==='functions/unauthenticated'||e.code==='functions/invalid-argument')msg='IDまたはパスワードが正しくありません';
    err.textContent=msg; btn.disabled=false; btn.textContent='ログイン';
  }
}
g('l-btn').addEventListener('click',doLogin);
g('l-id').addEventListener('keydown',function(e){if(e.key==='Enter')g('l-pw').focus();});
g('l-pw').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
g('btn-logout').addEventListener('click',function(){auth.signOut();});

// ── 認証状態 ────────────────────────────────────────────────
auth.onAuthStateChanged(async function(user){
  if(!user){
    g('login-screen').style.display='flex'; g('main-screen').style.display='none';
    g('l-btn').disabled=false; g('l-btn').textContent='ログイン'; currentMember=null; return;
  }
  let memberDoc=null;
  try{
    const snap=await db.collection('members').where('authUid','==',user.uid).limit(1).get();
    if(!snap.empty) memberDoc={id:snap.docs[0].id, ...snap.docs[0].data()};
  }catch(e){ console.warn('member lookup', e); }
  if(!memberDoc){ g('l-err').textContent='会員情報を確認できませんでした。'; await auth.signOut(); return; }
  currentMember=memberDoc;
  g('login-screen').style.display='none'; g('main-screen').style.display='block';
  g('who').textContent=(memberDoc.nickname||memberDoc.name||memberDoc.memberId||memberDoc.id)+' 様';
  // プラン取得 → 有料判定
  try{ plans=(typeof MemberPlan!=='undefined')?(await MemberPlan.loadPlans(db)):[]; }catch(e){ plans=[]; }
  if(!isPaid()){
    g('gate').style.display='block'; g('log-ui').style.display='none'; return;
  }
  g('gate').style.display='none'; g('log-ui').style.display='block';
  // 有料会員登録後、まだ取り込んでいなければ「道場ログの過去分を取得」を1回だけ表示
  if(!currentMember.tequilaLogBackfilledAt) g('backfill-banner').style.display='block';
  buildStyleOptions();
  await loadBottles();
  await loadBars();
  await loadLogs();
});

async function loadBars(){
  try{
    const [bs,cs]=await Promise.all([ db.collection('bars').get(), db.collection('cities').get() ]);
    bars=bs.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    cities=cs.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
  }catch(e){ console.warn('bars load', e); bars=[]; cities=[]; }
}

function isPaid(){
  if(typeof MemberPlan==='undefined') return false;
  var p=MemberPlan.effectivePlan(currentMember, plans);
  return !!(p && Number(p.level)>0);
}

// ── マスタ読み込み ──────────────────────────────────────────
async function loadBottles(){
  try{
    const [bs, br]=await Promise.all([
      db.collection('bottles').where('production','==','0').get(),
      db.collection('brands').get()
    ]);
    br.docs.forEach(function(d){ brandsMap[d.id]=d.data(); });
    bottles=bs.docs.map(function(d){
      var b=d.data(); var brand=brandsMap[b.brandId]||{};
      var bn=b.bottleJa||b.bottleEs||b.bottleEn||d.id;
      var brn=brand.brandEs||brand.brandJa||'';
      var esn=b.bottleEs||b.bottleEn||bn;
      var brEs=brand.brandEs||brn;
      return { id:d.id, name:bn, brand:brn, full:(brn?brn+' ':'')+bn, es:(brEs?brEs+' ':'')+esn };
    }).sort(function(a,b){ return a.full.localeCompare(b.full); });
  }catch(e){ console.warn('bottles load', e); bottles=[]; }
}

function bottleName(id){ var b=bottles.find(function(x){return x.id===id;}); return b?b.full:id; }
function bottleEsName(id, fallback){ var b=bottles.find(function(x){return x.id===id;}); return b?b.es:(fallback||id); }

// ── 自分のログ読み込み ──────────────────────────────────────
async function loadLogs(){
  try{
    const snap=await db.collection('tequilaLogs').where('authUid','==',auth.currentUser.uid).get();
    logs=snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    logs.sort(function(a,b){ return String(b.drunkAt||'').localeCompare(String(a.drunkAt||'')); });
    renderTree();
  }catch(e){ g('tree').innerHTML='<div class="empty">読み込みに失敗しました</div>'; }
}

function starStr(n){ n=Number(n)||0; var s=''; for(var i=1;i<=5;i++) s+=(i<=n?'★':'☆'); return s; }

function barLabelOf(l){
  var bmst=barById(l.barId);
  return l.barId==='B900001'?(l.barText||'その他'):(bmst?barDispName(bmst):(l.barId==='B00000'?'テキーラ道場':(l.barText||l.barId||'')));
}

function renderTree(){
  var el=g('tree');
  g('ctrlbar').style.display=logs.length?'flex':'none';
  if(!logs.length){ el.innerHTML='<div class="empty">まだ記録がありません。「＋ 記録する」から追加してください。</div>'; return; }
  var desc=(sortOrder!=='asc');
  function ord(keys){ keys.sort(); if(desc) keys.reverse(); return keys; }
  // 年月 → 日 グルーピング
  var ym={};
  logs.forEach(function(l){
    var d=String(l.drunkAt||'000000000000');
    var ymk=d.slice(0,6), day=d.slice(6,8);
    ym[ymk]=ym[ymk]||{}; (ym[ymk][day]=ym[ymk][day]||[]).push(l);
  });
  var html='';
  ord(Object.keys(ym)).forEach(function(ymk){
    var y=ymk.slice(0,4), mo=parseInt(ymk.slice(4,6),10), days=ym[ymk];
    var total=0; Object.keys(days).forEach(function(dd){ total+=days[dd].length; });
    html+='<div class="tnode tmonth" data-open="1">'
      +'<div class="thead tmh" onclick="toggleNode(this)"><span class="caret">▾</span>'+y+'年'+mo+'月<span class="cnt">'+total+'杯</span></div>'
      +'<div class="tbody">';
    ord(Object.keys(days)).forEach(function(dd){
      var items=days[dd].slice().sort(function(a,b){ var r=String(a.drunkAt||'').localeCompare(String(b.drunkAt||'')); return desc?-r:r; });
      html+='<div class="tnode tday" data-open="1">'
        +'<div class="thead tdh" onclick="toggleNode(this)"><span class="caret">▾</span>'+parseInt(dd,10)+'日<span class="cnt">'+items.length+'件</span></div>'
        +'<div class="tbody">';
      items.forEach(function(l){ html+=entRow(l); });
      html+='</div></div>';
    });
    html+='</div></div>';
  });
  el.innerHTML=html;
  if(!allOpen) setAllOpen(false);
}

function entRow(l){
  var loc=String(l.drunkAtLocal||l.drunkAt||''); var tm=loc.length>=12?loc.slice(8,10)+':'+loc.slice(10,12):'';
  var isAuto=(l.source==='auto');
  var nm=bottleEsName(l.bottleId, l.bottleName);
  return '<div class="ent">'
    +'<span class="etime">'+tm+'</span>'
    +'<span class="ename">'+esc(nm)+'</span>'
    +'<span class="eicon" title="'+esc(STYLE_MAP[l.style]||l.style||'')+'">'+esc(styleIcon(l.style))+'</span>'
    +'<span class="eplace">'+esc(barLabelOf(l))+'</span>'
    +'<span class="eact">'
      +'<button onclick="openDetail(\''+esc(l.id)+'\')">詳</button>'
      +'<button onclick="openEdit(\''+esc(l.id)+'\')">編</button>'
      +(isAuto?'':'<button class="del" onclick="delLog(\''+esc(l.id)+'\')">削</button>')
    +'</span></div>';
}

// ── ツリー折りたたみ / ソート / 詳細 ────────────────────────
function toggleNode(head){ var n=head.parentNode; n.setAttribute('data-open', n.getAttribute('data-open')==='1'?'0':'1'); }
function setAllOpen(open){
  allOpen=open;
  var ns=document.querySelectorAll('#tree .tnode');
  for(var i=0;i<ns.length;i++) ns[i].setAttribute('data-open', open?'1':'0');
  g('btn-toggle-all').textContent=open?'すべて折りたたむ':'すべて展開';
}
g('sort-order').addEventListener('change',function(){ sortOrder=this.value; renderTree(); });
g('btn-toggle-all').addEventListener('click',function(){ setAllOpen(!allOpen); });

function fmtStore(s){ s=String(s||''); return s.length>=12?(s.slice(0,4)+'/'+s.slice(4,6)+'/'+s.slice(6,8)+' '+s.slice(8,10)+':'+s.slice(10,12)):''; }
function openDetail(id){
  var l=logs.find(function(x){return x.id===id;}); if(!l) return;
  var locStr=fmtStore(l.drunkAtLocal||l.drunkAt), jstStr=fmtStore(l.drunkAt);
  var showJst=(l.tz&&l.tz!=='Asia/Tokyo'&&jstStr&&jstStr!==locStr);
  var dt=esc(locStr)
    +(showJst?' <span style="color:var(--ink3)">（JST '+esc(jstStr)+'）</span>':'')
    +((l.tz&&l.tz!=='Asia/Tokyo')?' <span style="color:var(--ink3);font-size:11px">'+esc(l.tz)+'</span>':'');
  var rows=[
    ['日時', dt],
    ['テキーラ', esc(bottleEsName(l.bottleId, l.bottleName))],
    ['飲み方', esc(STYLE_MAP[l.style]||l.style||'')+(l.amountMl?'（'+l.amountMl+'ml）':'')],
    ['場所', esc(barLabelOf(l))],
    ['評価', '<span class="stars">'+starStr(l.rating)+'</span>'],
    ['メモ', l.note?esc(l.note).replace(/\n/g,'<br>'):'<span style="color:var(--ink3)">—</span>']
  ];
  var html=(l.source==='auto'?'<div style="margin-bottom:10px"><span class="badge b-dojo">道場自動記録</span></div>':'');
  html+='<table class="dtl">'+rows.map(function(r){ return '<tr><th>'+r[0]+'</th><td>'+r[1]+'</td></tr>'; }).join('')+'</table>';
  html+='<button class="submit" style="margin-top:16px" onclick="g(\'m-detail\').classList.remove(\'open\');openEdit(\''+esc(l.id)+'\')">編集する</button>';
  g('detail-body').innerHTML=html;
  g('m-detail').classList.add('open');
}
g('detail-close').addEventListener('click',function(){ g('m-detail').classList.remove('open'); });

// ── 入力/編集モーダル ───────────────────────────────────────
function buildStyleOptions(){
  g('e-style').innerHTML=STYLES.map(function(s){ return '<option value="'+s[0]+'">'+s[1]+'</option>'; }).join('');
}
function setRating(v){ ratingVal=v; var sp=g('e-rate').children; for(var i=0;i<sp.length;i++){ sp[i].classList.toggle('on', (i+1)<=v); } }
g('e-rate').addEventListener('click',function(e){ var s=e.target.closest('span'); if(!s) return; setRating(parseInt(s.getAttribute('data-v'))); });
function setBar(id, text){
  pickedBarId=id||'B00000'; pickedBarText=text||'';
  var b=barById(pickedBarId);
  var label=pickedBarId==='B900001'?'その他（自由入力）':(b?barDispName(b):(pickedBarId==='B00000'?'テキーラ道場':pickedBarId));
  g('e-bar-view').textContent=label;
  var isOther=(pickedBarId==='B900001');
  g('e-bar-text').style.display=isOther?'block':'none';
  g('e-bar-text').value=pickedBarText;
  var tz=tzOfBar(pickedBarId);
  g('e-bar-tz').textContent=(tz&&tz!=='Asia/Tokyo')?('現地TZ: '+tz+' → 入力は現地時刻、JSTに換算して保存'):'';
}

function openAdd(){
  editId=null; editSource='manual';
  g('edit-title').textContent='テキーラを記録';
  g('fg-auto-note').style.display='none';
  ['fg-bottle','fg-style','fg-amount','fg-bar'].forEach(function(id){ g(id).style.display=''; });
  g('e-datetime').value=nowDtLocal();
  pickedBottleId=''; pickedBottleName=''; g('e-bottle-view').textContent='タップして選択';
  g('e-style').value='straight'; g('e-amount').value='30';
  setBar('B00000','');
  setRating(0); g('e-note').value='';
  g('m-edit').classList.add('open');
}
function openEdit(id){
  var l=logs.find(function(x){return x.id===id;}); if(!l) return;
  editId=id; editSource=l.source||'manual';
  g('edit-title').textContent='記録を編集';
  var isAuto=(editSource==='auto');
  g('fg-auto-note').style.display=isAuto?'block':'none';
  // 道場自動分は基本情報を編集不可（メモ・評価のみ）
  ['fg-bottle','fg-style','fg-amount','fg-bar'].forEach(function(fid){ g(fid).style.display=isAuto?'none':''; });
  g('e-datetime').value=storeToDtLocal(l.drunkAtLocal||l.drunkAt); g('e-datetime').disabled=isAuto;
  pickedBottleId=l.bottleId||''; pickedBottleName=l.bottleName||bottleName(l.bottleId);
  g('e-bottle-view').textContent=pickedBottleName||'タップして選択';
  g('e-style').value=l.style||'straight'; g('e-amount').value=l.amountMl||30;
  setBar(l.barId||'B00000', l.barText||'');
  setRating(Number(l.rating)||0); g('e-note').value=l.note||'';
  g('m-edit').classList.add('open');
}
g('edit-close').addEventListener('click',function(){ g('m-edit').classList.remove('open'); });
g('btn-add').addEventListener('click',openAdd);
g('btn-backfill').addEventListener('click',async function(){
  var btn=g('btn-backfill'); btn.disabled=true; var old=btn.textContent; btn.textContent='取込中...';
  try{
    var res=await fbFunctions.httpsCallable('backfillTequilaLogs')({});
    var d=res.data||{};
    toast('道場の過去分を取り込みました：新規'+(d.created||0)+'件');
    if(currentMember) currentMember.tequilaLogBackfilledAt=true;
    g('backfill-banner').style.display='none';   // 一度実行したら消す
    loadLogs();
  }catch(e){
    btn.disabled=false; btn.textContent=old;
    toast('取込に失敗しました'+(e&&e.message?'：'+e.message:''));
  }
});

g('e-save').addEventListener('click',async function(){
  var isAuto=(editSource==='auto');
  var note=(g('e-note').value||'').trim();
  var rating=ratingVal||0;
  if(isAuto){
    // メモ・評価のみ更新
    try{
      await db.collection('tequilaLogs').doc(editId).update({ note:note||null, rating:rating, updatedAt:firebase.firestore.FieldValue.serverTimestamp() });
      toast('更新しました'); g('m-edit').classList.remove('open'); loadLogs();
    }catch(e){ toast('更新に失敗しました'); }
    return;
  }
  var localStore=dtLocalToStore(g('e-datetime').value);
  if(!localStore||localStore.length<12){ toast('日時を入力してください'); return; }
  if(!pickedBottleId){ toast('ボトルを選択してください'); return; }
  var amount=parseInt(g('e-amount').value)||0;
  if(amount<=0||amount>999){ toast('量が不正です'); return; }
  var barId=pickedBarId||'B00000';
  var barText=(barId==='B900001')?(g('e-bar-text').value||'').trim():'';
  if(barId==='B900001'&&!barText){ toast('場所を入力してください'); return; }
  var tz=tzOfBar(barId);
  var dt=localStoreToJst(localStore, tz);   // 現地時刻→JST（保存はJST）
  if(dt>dtLocalToStore(nowDtLocal())){ toast('未来の日時は記録できません'); return; }

  var data={
    authUid: auth.currentUser.uid,
    memberId: String(currentMember.memberId||currentMember.id||''),
    memberName: String(currentMember.nickname||currentMember.name||''),
    drunkAt: dt,
    drunkAtLocal: localStore,
    tz: tz,
    bottleId: pickedBottleId,
    bottleName: pickedBottleName||bottleName(pickedBottleId),
    style: g('e-style').value,
    amountMl: amount,
    barId: barId,
    barText: barText||null,
    note: note||null,
    rating: rating,
    source: 'manual',
    orderRef: null,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  try{
    if(editId){
      await db.collection('tequilaLogs').doc(editId).update(data);
      toast('更新しました');
    }else{
      data.createdAt=firebase.firestore.FieldValue.serverTimestamp();
      await db.collection('tequilaLogs').add(data);
      toast('記録しました');
    }
    g('m-edit').classList.remove('open'); loadLogs();
  }catch(e){ toast('保存に失敗しました: '+(e.message||'')); }
});

function delLog(id){
  if(!confirm('この記録を削除しますか？')) return;
  db.collection('tequilaLogs').doc(id).delete()
    .then(function(){ toast('削除しました'); loadLogs(); })
    .catch(function(){ toast('削除に失敗しました'); });
}

// ── ボトル選択 ──────────────────────────────────────────────
function openBottlePicker(){
  g('bottle-search').value=''; renderBottleList('');
  g('m-bottle').classList.add('open');
  setTimeout(function(){ g('bottle-search').focus(); },50);
}
function renderBottleList(q){
  q=(q||'').toLowerCase();
  var list=bottles.filter(function(b){ return !q || b.full.toLowerCase().indexOf(q)>=0; }).slice(0,200);
  var el=g('bottle-list');
  if(!list.length){ el.innerHTML='<div class="empty">該当するボトルがありません</div>'; return; }
  el.innerHTML=list.map(function(b){
    return '<div class="brow" data-id="'+esc(b.id)+'"><div class="bn">'+esc(b.name)+'</div><div class="bb">'+esc(b.brand)+'</div></div>';
  }).join('');
}
g('bottle-search').addEventListener('input',function(){ renderBottleList(this.value); });
g('bottle-close').addEventListener('click',function(){ g('m-bottle').classList.remove('open'); });
g('bottle-list').addEventListener('click',function(e){
  var row=e.target.closest('.brow'); if(!row) return;
  pickedBottleId=row.getAttribute('data-id');
  var b=bottles.find(function(x){return x.id===pickedBottleId;});
  pickedBottleName=b?b.full:pickedBottleId;
  g('e-bottle-view').textContent=pickedBottleName;
  g('m-bottle').classList.remove('open');
});

// ── BAR選択 ─────────────────────────────────────────────────
function barsForPicker(){
  var arr=bars.slice();
  if(!arr.find(function(b){return b.id==='B00000';})) arr.unshift({id:'B00000',nameJa:'テキーラ道場'});
  if(!arr.find(function(b){return b.id==='B900001';})) arr.push({id:'B900001',nameJa:'その他（自由入力）'});
  return arr;
}
function openBarPicker(){ g('bar-search').value=''; renderBarList(''); g('m-bar').classList.add('open'); setTimeout(function(){ g('bar-search').focus(); },50); }
function renderBarList(q){
  q=(q||'').toLowerCase();
  var special=['B00000','B900001'];
  var list=barsForPicker().sort(function(a,b){
    var sa=special.indexOf(a.id), sb=special.indexOf(b.id);
    if(sa<0)sa=50; if(sb<0)sb=50;
    if(sa!==sb) return sa-sb;
    return barDispName(a).localeCompare(barDispName(b));
  }).filter(function(b){ return !q || (barDispName(b)+' '+(b.nameEn||'')+' '+(b.address||'')).toLowerCase().indexOf(q)>=0; });
  var el=g('bar-list');
  if(!list.length){ el.innerHTML='<div class="empty">該当するBARがありません</div>'; return; }
  el.innerHTML=list.slice(0,200).map(function(b){
    var sub=(b.id==='B900001')?'場所を自由入力':(b.address||b.id);
    return '<div class="brow" data-id="'+esc(b.id)+'"><div class="bn">'+esc(barDispName(b))+'</div><div class="bb">'+esc(sub)+'</div></div>';
  }).join('');
}
g('bar-search').addEventListener('input',function(){ renderBarList(this.value); });
g('bar-close').addEventListener('click',function(){ g('m-bar').classList.remove('open'); });
g('bar-list').addEventListener('click',function(e){
  var row=e.target.closest('.brow'); if(!row) return;
  setBar(row.getAttribute('data-id'), (row.getAttribute('data-id')===pickedBarId)?pickedBarText:'');
  g('m-bar').classList.remove('open');
});
</script>
