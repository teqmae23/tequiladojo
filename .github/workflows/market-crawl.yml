# ネットショップ参考相場の定期巡回（週次）。
# 各店をクロール→名寄せ→Firestore(marketPrices/marketStaging)へ取り込む。
# 事前設定(必須): リポジトリ Secrets に GCP_SA_KEY（Firestore書込権限のサービスアカウントJSON）。
# 手動実行も可（Actions画面の Run workflow）。巡回間隔を変えるなら cron を編集。
name: market-crawl
on:
  schedule:
    - cron: '17 20 * * 1'   # 毎週火 05:17 JST 相当(UTC 月20:17)。負荷分散のため:00は避ける
  workflow_dispatch:
    inputs:
      shops:
        description: '対象店（空なら既定セット）'
        required: false
        default: ''
concurrency:
  group: market-crawl
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install deps
        run: |
          python -m pip install --quiet requests beautifulsoup4
          npm install --no-save firebase-admin@12
      - name: Auth (service account)
        run: |
          echo "$GCP_SA_KEY" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      - name: Crawl / match / import
        env:
          REPO: ${{ github.workspace }}
          WORK: ${{ runner.temp }}/market-work
          NODE_PATH: ${{ github.workspace }}/node_modules
        run: |
          set -e
          bash "$REPO/tools/market/refresh_all.sh" ${{ github.event.inputs.shops }}
