<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新規登録QR — テキーラ道場</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --ink:#18110a;--ink2:#4a3820;--ink3:#9a8470;
  --gold:#c8921e;--gold-l:#e8b84a;--gold-d:#7a5610;
  --cream:#faf7f1;--cream2:#f0ebe0;--cream3:#e4ddd0;--white:#fff;
  --red:#b03020;--teal:#1a6e58;
  --border:rgba(160,130,100,.18);--border2:rgba(160,130,100,.32);
  --shadow-lg:0 6px 36px rgba(24,17,10,.13);
  --r:8px;--rl:12px;
  --serif:'Hiragino Mincho ProN','Yu Mincho',serif;
  --sans:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  --mono:'SFMono-Regular',Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--cream);color:var(--ink);min-height:100vh}
button{cursor:pointer;font-family:var(--sans)}
.hdr{background:var(--ink);padding:0 16px;height:56px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:40}
.hdr-title{font-family:var(--serif);font-size:18px;color:var(--gold-l);letter-spacing:.06em}
.hdr-right{margin-left:auto;display:flex;gap:8px}
.hdr-nav{padding:6px 11px;border:1px solid rgba(255,255,255,.16);border-radius:6px;color:var(--gold-l);font-size:11px;text-decoration:none;background:none}
.wrap{max-width:560px;margin:0 auto;padding:24px 16px 60px;text-align:center}
.ptitle{font-family:var(--serif);font-size:24px;color:var(--gold-d);margin-bottom:4px}
.pdesc{font-size:12px;color:var(--ink3);margin-bottom:20px;line-height:1.6}
.qcard{background:var(--white);border:1px solid var(--border2);border-radius:var(--rl);padding:28px 20px;box-shadow:var(--shadow-lg);display:inline-block;min-width:280px}
.qcard .qcap{font-family:var(--serif);font-size:20px;color:var(--gold-d);margin-bottom:4px}
.qcard .qsub{font-size:12px;color:var(--ink3);margin-bottom:18px}
#qrbox{display:flex;align-items:center;justify-content:center;min-height:220px}
#qrbox canvas,#qrbox img{width:220px!important;height:220px!important}
.qhint{font-size:12px;color:var(--ink2);margin-top:16px;line-height:1.6}
.urlline{font-size:11px;color:var(--ink3);font-family:var(--mono);margin-top:10px;word-break:break-all}
.btnrow{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.btn{border:none;border-radius:var(--r);padding:11px 18px;font-size:13px;font-weight:500}
.bp{background:var(--gold-d);color:var(--cream)}
.bg2{background:var(--cream2);color:var(--ink2);border:1px solid var(--border2)}
@media print{
  .hdr,.btnrow,.hdr-right,.qhint,.urlline{display:none!important}
  body{background:#fff}
  .qcard{border:none;box-shadow:none}
}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-title">🆕 新規登録QR</div>
  <div class="hdr-right">
    <a class="hdr-nav" href="/admin_checkin_qr.html">来店QR</a>
    <a class="hdr-nav" href="/tdhome.html">管理TOP</a>
  </div>
</div>

<div class="wrap">
  <div class="ptitle">新規登録QR</div>
  <div class="pdesc">このQRを店頭に掲示してください。新規のお客様がスマホで読み取ると、<br>会員新規登録ページが開きます。</div>
  <div class="qcard">
    <div class="qcap">🍾 テキーラ道場</div>
    <div class="qsub">スマホで読み取って新規会員登録</div>
    <div id="qrbox"><div style="color:var(--ink3);font-size:13px">読み込み中…</div></div>
    <div class="qhint">読み取り →「新規会員登録」ページが開きます</div>
    <div class="urlline" id="urlline"></div>
  </div>
  <div class="btnrow">
    <button class="btn bp" onclick="window.print()">🖨️ 印刷</button>
    <button class="btn bg2" onclick="copyUrl()">🔗 URLをコピー</button>
  </div>
  <div style="min-height:18px;font-size:12px;margin-top:12px;color:var(--teal)" id="msg"></div>
</div>

<script>
var REG_URL = window.location.origin + '/member_register2.html';
function g(id){ return document.getElementById(id); }
(function(){
  var box = g('qrbox');
  box.innerHTML = '';
  try{
    new QRCode(box, { text: REG_URL, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M });
  }catch(e){
    box.innerHTML = '<div style="color:var(--red);font-size:13px">QRの生成に失敗しました</div>';
  }
  g('urlline').textContent = REG_URL;
})();
function copyUrl(){
  if(navigator.clipboard){
    navigator.clipboard.writeText(REG_URL).then(function(){ g('msg').textContent = 'URLをコピーしました'; setTimeout(function(){ g('msg').textContent=''; }, 2400); });
  }
}
</script>
</body>
</html>
