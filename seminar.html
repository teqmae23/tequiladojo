<style>
:root{--bg:#141210;--panel:#1e1b18;--ink:#f4efe7;--ink3:#b8aE9c;--gold:#d8b56b;--gold-d:#b8934a;--line:rgba(255,255,255,.14)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;-webkit-user-select:none;user-select:none;overflow:hidden}
#screen{height:100%;display:flex;flex-direction:column}
.msg{margin:auto;text-align:center;color:var(--ink3);font-size:14px;padding:24px;line-height:1.8}
.msg a{color:var(--gold);font-weight:700}
.sem-hd{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line)}
.sem-ttl{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sem-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;background:rgba(216,181,107,.16);color:var(--gold);white-space:nowrap}
.sem-live{font-size:10px;font-weight:700;color:#e26a6a;white-space:nowrap;margin-left:auto}
.sem-live .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#e26a6a;margin-right:3px;vertical-align:middle;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.3}}
.body{flex:1 1 auto;display:flex;flex-direction:column;min-width:0;min-height:0}
.sidebar{flex:0 0 auto;display:flex;flex-direction:column;min-width:0}
.stage{flex:1 1 auto;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:4px;min-width:0;min-height:0}
#sem-canvas{max-width:100%;max-height:100%;background:#fff;box-shadow:0 4px 24px rgba(0,0,0,.5);border-radius:2px;pointer-events:none}
.stage-msg{position:absolute;color:var(--ink3);font-size:13px}
/* ページ送りバー（サイドバー/下部に配置。横画面では縦並び） */
.navbar{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.navbar button{background:var(--gold);color:#241c0e;border:none;border-radius:9px;font-size:15px;font-weight:800;padding:7px 16px;cursor:pointer;min-width:52px}
.navbar button:disabled{opacity:.35;cursor:default}
.navbar .pg{font-size:14px;font-variant-numeric:tabular-nums;min-width:62px;text-align:center;font-weight:700;color:var(--ink)}
.foot{flex:0 0 auto;text-align:center;font-size:11px;color:var(--ink3);padding:4px}
.pbar{flex:0 0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:center;padding:6px 12px;border-top:1px solid var(--line);background:var(--panel)}
.pbtn{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:7px 12px;font-size:12px;font-weight:600;cursor:pointer}
.qrwrap{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;z-index:50}
.qrwrap.open{display:flex}
.qrcard{background:#fff;color:#241c0e;border-radius:14px;padding:20px;text-align:center;max-width:88vw}
.qrcard h3{margin:0 0 10px;font-size:15px}
#qrbox{display:flex;justify-content:center;margin:0 auto 10px}
#qrbox img,#qrbox canvas{display:block}
.qrurl{font-size:11px;word-break:break-all;color:#6b5b3a;margin-bottom:12px}
.qrcard button{background:var(--gold-d);color:#fff;border:none;border-radius:9px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;margin:0 4px}
/* 横画面: 下部の操作類を右サイドバーに移して資料(stage)を縦いっぱいに使う */
@media (orientation:landscape){
  .body{flex-direction:row}
  .sidebar{width:210px;border-left:1px solid var(--line);justify-content:center;gap:4px}
  .pbar{flex-direction:column;align-items:stretch;border-top:none;gap:8px}
  .pbar .pbtn{width:100%;text-align:center}
  .navbar{flex-direction:column;border-bottom:none;gap:8px;padding-bottom:0}
  .navbar button{width:100%}
  #sem-savenote{font-size:12px!important;border-top:1px solid var(--line)}
}

<body>
<div id="screen"><div class="msg">読み込み中…</div></div>
<div class="qrwrap" id="qrwrap"><div class="qrcard"><h3>参加者用QR / URL</h3><div id="qrbox"></div><div class="qrurl" id="qrurl"></div><button onclick="copyJoin()">URLをコピー</button><button onclick="closeQr()" style="background:#8a7a55">閉じる</button></div></div>

<script>
firebase.initializeApp(FIREBASE_CONFIG);
var auth=firebase.auth(), db=firebase.firestore();
function g(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
var Q=new URLSearchParams(location.search);
var EID=Q.get('e')||'', SID=Q.get('s')||'', PRESENT=Q.get('present')==='1';
var _sem=null, _pdf=null, _numPages=0, _page=0, _presenter=false, _unsub=null, _rendering=false, _pendingPage=null;
var _syncOn=true, _livePage=1; // 参加者: 配信ページ同期のON/OFF と 現在の配信ページ
var _pstate=''; // 参加者の表示状態: 'pre'（配信前）/'live'（配信中）/'ended'（配信終了）
function stageMsg(html){ var st=g('sem-stage'); if(st) st.innerHTML='<div class="stage-msg" style="max-width:82%;line-height:1.7;text-align:center">'+html+'</div>'; }
// ページ送りバー。配信者/参加者でボタンのidと動作が異なる。サイドバー内に配置。
function _navHtml(){
  return _presenter
    ? '<div class="navbar" id="navbar"><button id="btn-prev" onclick="prevPage()">◀</button><span class="pg" id="sem-pg">- / -</span><button id="btn-next" onclick="nextPage()">▶</button></div>'
    : '<div class="navbar" id="navbar" style="display:none"><button id="p-prev" onclick="pMove(-1)">◀</button><span class="pg" id="p-pg">- / -</span><button id="p-next" onclick="pMove(1)">▶</button></div>';
}
function ensureCanvas(){ var st=g('sem-stage'); if(st && !g('sem-canvas')){ st.innerHTML='<canvas id="sem-canvas"></canvas>'; } }

function showMsg(html){ g('screen').innerHTML='<div class="msg">'+html+'</div>'; }
if(!EID||!SID){ showMsg('セミナーが指定されていません。'); }

// pdf.js 遅延ロード
var _pdfjsP=null;
function loadPdfJs(){
  if(window.pdfjsLib) return Promise.resolve();
  if(_pdfjsP) return _pdfjsP;
  _pdfjsP=new Promise(function(res,rej){
    var s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload=function(){ try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; }catch(e){} res(); };
    s.onerror=function(){ rej(new Error('pdfjs')); };
    document.head.appendChild(s);
  });
  return _pdfjsP;
}
function loadQrJs(){
  if(window.QRCode) return Promise.resolve();
  return new Promise(function(res,rej){
    var s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
    s.onload=function(){ res(); }; s.onerror=function(){ rej(new Error('qr')); };
    document.head.appendChild(s);
  });
}

// スタッフ/共同管理者か判定（配信者モード可否）
async function resolvePresenter(user){
  if(!user) return false;
  try{ var r=await user.getIdTokenResult(); if(r.claims&&(r.claims.role==='owner'||r.claims.role==='staff')) return true; }catch(e){}
  try{ var d=await db.collection('staffRoles').doc(user.uid).get(); if(d.exists&&(d.data().role==='owner'||d.data().role==='staff')) return true; }catch(e){}
  try{ var ev=await db.collection('events').doc(EID).get(); if(ev.exists){ var u=ev.data().coAdminUids; if(Array.isArray(u)&&u.indexOf(user.uid)>=0) return true; } }catch(e){}
  return false;
}

auth.onAuthStateChanged(function(user){
  if(!EID||!SID) return;
  start(user);
});

async function start(user){
  var canPresent=false;
  if(PRESENT){ canPresent=await resolvePresenter(user); }
  // セミナーdoc取得（access判定はルール側。読めなければ権限/ログイン案内）
  var ref=db.collection('events').doc(EID).collection('seminars').doc(SID);
  var snap;
  try{ snap=await ref.get(); }
  catch(e){
    if(!user) showMsg('この配信は会員限定です。<br><br><a href="/member.html">▶ 会員ログイン</a>');
    else showMsg('この配信の閲覧権限がありません。');
    return;
  }
  if(!snap.exists){ showMsg('配信が見つかりません。'); return; }
  _sem=snap.data();
  if(!_sem.pdfUrl){ showMsg('資料が設定されていません。'); return; }
  _presenter=canPresent;
  buildUI();
  loadPdfJs().then(function(){
    // Firebase Storage のダウンロードURLは Range/ストリーム取得で CORS 事前確認に失敗することが
    // あるため、単一GETで取得する（disableRange/disableStream）。
    return window.pdfjsLib.getDocument({url:_sem.pdfUrl, disableRange:true, disableStream:true, disableAutoFetch:true}).promise;
  }).then(function(pdf){
    _pdf=pdf; _numPages=pdf.numPages;
    if(_presenter){
      // 開くたびに必ず1ページ目から（前回の続きから再開しない）
      _page=1;
      renderPage(_page); updateCtl();
      // 配信者が開いたら配信開始(started/live)にし、配信ページを1に戻す（再配信も可）
      db.collection('events').doc(EID).collection('seminars').doc(SID)
        .set({started:true, live:true, currentPage:1, updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true}).catch(function(){});
    } else {
      // 参加者は配信中ページに同期
      subscribe();
    }
    if(_presenter) subscribe(); // 配信者も他端末の変更に追従
  }).catch(function(err){
    var st=g('sem-stage');
    var msg=(err&&(err.message||err.name))?String(err.message||err.name):'不明なエラー';
    if(st) st.innerHTML='<div class="stage-msg" style="max-width:80%;line-height:1.6">資料を表示できませんでした。<br><span style="font-size:11px;color:var(--ink3)">'+esc(msg)+'</span><br><a href="'+esc(_sem.pdfUrl)+'" target="_blank" rel="noopener" style="color:var(--gold);font-size:12px">▶ PDFを直接開く</a></div>';
  });
}

function subscribe(){
  if(_unsub) return;
  var ref=db.collection('events').doc(EID).collection('seminars').doc(SID);
  _unsub=ref.onSnapshot(function(d){
    if(!d.exists) return; var data=d.data()||{}; _sem=data;
    var p=Math.min(Math.max(1,data.currentPage||1),_numPages||1);
    _livePage=p;
    updateLive(data.started && data.live!==false);
    if(_presenter){
      // 配信者は自分の操作を優先。ライブ表示のみ更新。
      return;
    }
    var isLive=(data.started && data.live!==false);
    if(isLive){ // 配信中：資料を同期表示
      if(_pstate!=='live'){ _pstate='live'; ensureCanvas(); if(_syncOn) _page=_livePage; renderPage(_page); setParticipantControls('live'); }
      else if(_syncOn && p!==_page){ _page=p; renderPage(p); } // 同期ON時のみ配信ページへ追従
      updateFoot(); updatePPg();
    } else if(data.preBroadcast===false){ // 配信前=OFF → 配信終了メッセージ
      if(_pstate!=='ended'){ _pstate='ended'; stageMsg('配信は終了しました。'); setParticipantControls('ended'); }
      var fe=g('sem-foot'); if(fe) fe.textContent='配信は終了しました。';
    } else { // 配信前=ON（既定）→ 配信開始前メッセージ（資料は表示しない）
      if(_pstate!=='pre'){ _pstate='pre'; stageMsg('配信開始前です。<br>開始までお待ちください。'); setParticipantControls('pre'); }
      var fp=g('sem-foot'); if(fp) fp.textContent='配信開始前です。開始までお待ちください。';
    }
  }, function(){});
}

function buildUI(){
  var badge=(_sem.access==='public')?'<span class="sem-badge">公開</span>':'<span class="sem-badge">会員限定</span>';
  var live='<span class="sem-live" id="sem-live"><span class="dot"></span>LIVE</span>';
  var hd='<div class="sem-hd"><span class="sem-ttl">'+esc(_sem.title||'セミナー')+'</span>'+badge+live+'</div>';
  var canSave=!!_sem.allowDownload;
  // 資料エリアは canvas のみで最大化。ページ送りは操作類(sidebar)側に置く。
  var stage='<div class="stage" id="sem-stage"><canvas id="sem-canvas"></canvas></div>';
  var bottom;
  if(_presenter){
    var saveBtn=canSave?'<button class="pbtn" onclick="savePdf()">💾 資料を保存</button>':'';
    bottom='<div class="pbar"><button class="pbtn" onclick="openQr()">📱 参加者QR/URL</button><button class="pbtn" onclick="copyJoin()">🔗 URLコピー</button>'+saveBtn+'<button class="pbtn" onclick="endBroadcast()" style="border-color:#e26a6a;color:#e26a6a">⏹ 配信終了</button><span style="font-size:11px;color:var(--ink3)">配信者モード（同期）</span></div>';
  } else {
    // 参加者コントロールは setParticipantControls(state) で状態別に表示制御する（ページ送りは資料上のフローティング）
    bottom='<div class="pbar" id="p-ctl">'
      +'<button class="pbtn" id="p-sync" onclick="toggleSync()" style="display:none">✋ 自由に移動</button>'
      +(canSave?'<button class="pbtn" id="p-save" onclick="savePdf()" style="display:none">💾 資料を保存</button>':'')
      +'<button class="pbtn" onclick="leaveSeminar()" style="border-color:#e26a6a;color:#e26a6a">🚪 退出</button>'
      +'</div>'
      +'<div class="foot" id="sem-foot">読み込み中…</div>';
  }
  // 保存可のときの利用上の注意（配信者は常時、参加者は保存ボタン表示時のみ setParticipantControls で切替）
  var saveNote=canSave?'<div id="sem-savenote" style="display:'+(_presenter?'block':'none')+';text-align:center;font-size:14px;font-weight:700;color:var(--gold);background:rgba(216,181,107,.12);border-top:1px solid var(--line);padding:10px 16px;line-height:1.6">⚠ ダウンロードしたセミナー資料は個人利用のみにとどめ、転載・転用はご遠慮下さい。</div>':'';
  // 横画面では stage を左・操作類(sidebar)を右に並べる（.body が縦/横を切替）。ページ送りバーは sidebar 先頭。
  g('screen').innerHTML=hd+'<div class="body">'+stage+'<div class="sidebar">'+_navHtml()+bottom+saveNote+'</div></div>';
}
// 参加者コントロールを状態別に表示制御。pre=配信前(自由閲覧・保存不可) / live=配信中 / ended=終了
function setParticipantControls(state){
  var canSave=!!(_sem&&_sem.allowDownload);
  var showSave=canSave&&(state==='live'||state==='ended'); // 配信前は保存不可
  var sv=g('p-save'); if(sv) sv.style.display=showSave?'':'none';
  var nt=g('sem-savenote'); if(nt) nt.style.display=showSave?'':'none';
  var sync=g('p-sync'); if(sync) sync.style.display=(state==='live')?'':'none'; // 同期トグルは配信中のみ
  var showNav=(state==='live'&&!_syncOn); // ページ移動は配信中の自由移動時のみ（配信前/終了は資料を出さない）
  var ov=g('navbar'); if(ov) ov.style.display=showNav?'':'none'; // サイドバーのページ送りバー
}

function renderPage(p){
  if(!_pdf) return;
  if(_rendering){ _pendingPage=p; return; }
  _rendering=true;
  _pdf.getPage(p).then(function(page){
    var stage=g('sem-stage'), canvas=g('sem-canvas');
    if(!stage||!canvas){ _rendering=false; return; }
    var vp=page.getViewport({scale:1});
    var availW=stage.clientWidth-16, availH=stage.clientHeight-16;
    var scale=Math.max(0.2, Math.min(availW/vp.width, availH/vp.height));
    var dpr=Math.min(2, window.devicePixelRatio||1);
    var v2=page.getViewport({scale:scale});
    canvas.width=Math.floor(v2.width*dpr); canvas.height=Math.floor(v2.height*dpr);
    canvas.style.width=Math.floor(v2.width)+'px'; canvas.style.height=Math.floor(v2.height)+'px';
    var ctx=canvas.getContext('2d');
    return page.render({canvasContext:ctx, viewport:v2, transform:dpr!==1?[dpr,0,0,dpr,0,0]:null}).promise;
  }).then(function(){
    _rendering=false;
    if(_pendingPage!=null){ var np=_pendingPage; _pendingPage=null; if(np!==p) renderPage(np); }
  }).catch(function(){ _rendering=false; });
}

// 配信者操作
function setPage(p){
  p=Math.min(Math.max(1,p),_numPages||1);
  _page=p; renderPage(p); updateCtl();
  db.collection('events').doc(EID).collection('seminars').doc(SID)
    .set({currentPage:p, started:true, live:true, preBroadcast:true, updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true}).catch(function(){});
}
function prevPage(){ setPage(_page-1); }
function nextPage(){ setPage(_page+1); }
function updateCtl(){
  var pg=g('sem-pg'); if(pg) pg.textContent=_page+' / '+(_numPages||'-');
  var pb=g('btn-prev'), nb=g('btn-next');
  if(pb) pb.disabled=(_page<=1); if(nb) nb.disabled=(_page>=_numPages);
}
function updateFoot(){ var f=g('sem-foot'); if(!f) return;
  if(_pstate==='live'){ f.textContent=_syncOn?('配信に同期中 — ページ '+_livePage+' / '+(_numPages||'-')):('自由閲覧中 — ページ '+_page+' / '+(_numPages||'-')); }
}
function updateLive(on){ var l=g('sem-live'); if(l) l.style.display=on?'':'none'; }

// ── 参加者: ページ同期 ON/OFF と自由移動 ──
function updatePPg(){
  var pg=g('p-pg'); if(pg) pg.textContent=_page+' / '+(_numPages||'-');
  var pb=g('p-prev'), nb=g('p-next');
  if(pb) pb.disabled=(_page<=1); if(nb) nb.disabled=(_page>=(_numPages||1));
}
function toggleSync(){
  _syncOn=!_syncOn;
  var sb=g('p-sync'); if(sb) sb.textContent=_syncOn?'✋ 自由に移動':'🔗 配信に同期';
  if(_syncOn && _livePage){ _page=_livePage; renderPage(_page); } // 同期に戻したら配信ページへ復帰
  setParticipantControls('live');
  updatePPg(); updateFoot();
}
function pMove(d){ if(_pstate!=='live' || _syncOn) return; setLocalPage(_page+d); } // 配信中の自由移動時のみ
function setLocalPage(p){ p=Math.min(Math.max(1,p),_numPages||1); _page=p; renderPage(p); updatePPg(); updateFoot(); }

// ── 配信者: 配信終了 ／ 参加者: 退出 ──
function endBroadcast(){
  if(!_presenter) return;
  if(!confirm('配信を終了しますか？\n参加者の画面に「配信は終了しました」と表示されます。')) return;
  db.collection('events').doc(EID).collection('seminars').doc(SID)
    .set({live:false, preBroadcast:false, updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true}).catch(function(){});
  if(_unsub){ _unsub(); _unsub=null; }
  showMsg('配信を終了しました。<br><span style="font-size:12px;color:var(--ink3)">もう一度配信するには、この画面を再読み込みしてください。</span>');
}
function leaveSeminar(){
  if(_unsub){ _unsub(); _unsub=null; }
  showMsg('退出しました。ご参加ありがとうございました。<br><br><a href="'+esc(joinUrl())+'">▶ もう一度参加する</a>');
}
// 資料の保存（allowDownload が真のセミナーのみボタン表示）
function _dlBlob(b,name){
  var u=URL.createObjectURL(b);
  var a=document.createElement('a'); a.href=u; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(u); },2000);
}
function _dlFallback(name){
  fetch(_sem.pdfUrl).then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.blob(); })
    .then(function(b){ _dlBlob(b,name); })
    .catch(function(){ window.open(_sem.pdfUrl,'_blank','noopener'); });
}
function savePdf(){
  if(!_sem||!_sem.pdfUrl||!_sem.allowDownload) return;
  var name=String(_sem.fileName||_sem.title||'seminar');
  if(!/\.pdf$/i.test(name)) name+='.pdf';
  // PC(Chrome/Edge等): 保存先を選ぶ「名前を付けて保存」ダイアログを表示
  if(window.showSaveFilePicker){
    window.showSaveFilePicker({suggestedName:name, types:[{description:'PDF',accept:{'application/pdf':['.pdf']}}]})
      .then(function(handle){
        return fetch(_sem.pdfUrl).then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.blob(); })
          .then(function(blob){ return handle.createWritable().then(function(w){ return w.write(blob).then(function(){ return w.close(); }); }); });
      })
      .catch(function(e){ if(e && e.name==='AbortError') return; _dlFallback(name); }); // キャンセルは何もしない
    return;
  }
  // モバイル: download 属性が無視されPDFが開くだけになるため、共有シート経由で保存
  fetch(_sem.pdfUrl).then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.blob(); })
    .then(function(b){
      var file=null; try{ file=new File([b],name,{type:'application/pdf'}); }catch(e){}
      if(file && navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
        navigator.share({files:[file], title:name})
          .catch(function(err){ if(err && err.name!=='AbortError') _dlBlob(b,name); });
        return;
      }
      _dlBlob(b,name);
    })
    .catch(function(){ window.open(_sem.pdfUrl,'_blank','noopener'); });
}

// キーボード（配信者PC）
document.addEventListener('keydown',function(e){
  var right=(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' ');
  var left=(e.key==='ArrowLeft'||e.key==='PageUp');
  if(!right&&!left) return;
  if(_presenter){ e.preventDefault(); if(right) nextPage(); else prevPage(); }
  else if(_pstate==='live' && !_syncOn){ e.preventDefault(); pMove(right?1:-1); } // 配信中の自由移動時のみ
});
window.addEventListener('resize',function(){ if(_pdf) renderPage(_page); });

// QR / URL
function joinUrl(){ return location.origin+'/seminar.html?e='+encodeURIComponent(EID)+'&s='+encodeURIComponent(SID); }
function openQr(){
  var w=g('qrwrap'); g('qrurl').textContent=joinUrl();
  loadQrJs().then(function(){
    var box=g('qrbox'); box.innerHTML='';
    try{ new QRCode(box,{text:joinUrl(),width:200,height:200,correctLevel:QRCode.CorrectLevel.M}); }
    catch(e){ box.textContent='QRを生成できませんでした'; }
  }).catch(function(){ g('qrbox').textContent='QRを生成できませんでした'; });
  w.classList.add('open');
}
function closeQr(){ g('qrwrap').classList.remove('open'); }
function copyJoin(){
  var u=joinUrl();
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(u).then(function(){ alert('参加者URLをコピーしました'); }).catch(function(){ prompt('コピーしてください', u); }); }
  else prompt('コピーしてください', u);
}
