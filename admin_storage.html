<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ストレージ管理 - テキーラ道場</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
var FIREBASE_CONFIG={
  apiKey:"AIzaSyD6a3i-N1RyXyAfXmztPQrYtx4x62YGth0",
  authDomain:"tequiladojo.firebaseapp.com",
  projectId:"tequiladojo",
  storageBucket:"tequiladojo.firebasestorage.app",
  messagingSenderId:"56663296233",
  appId:"1:56663296233:web:c8cac2fcbeb4faa09e0878",
  measurementId:"G-KMS18946JQ"
};
</script>
<script src="/auth-role.js?v=20260829"></script>
<style>
:root{
  --ink:#18110a;--ink2:#3a2c14;--ink3:#6b5a44;
  --gold:#c8921e;--gold-l:#e8b84a;--gold-d:#7a5610;
  --cream:#faf7f1;--cream2:#f0ebe0;--cream3:#e4ddd0;--white:#fff;
  --border:rgba(160,130,100,.18);--border2:rgba(160,130,100,.32);
  --shadow:0 1px 12px rgba(24,17,10,.07);--shadow-lg:0 6px 36px rgba(24,17,10,.13);
  --red:#b03020;--teal:#1a6e58;
  --r:8px;--rl:14px;
  --serif:'Hiragino Mincho ProN','Yu Mincho',serif;
  --sans:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  --mono:'SFMono-Regular',Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--cream);color:var(--ink);min-height:100vh}
button{cursor:pointer;font-family:var(--sans)}
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
#app{display:none}
.lcard{width:100%;max-width:360px;background:var(--white);border:1px solid var(--border2);border-radius:var(--rl);padding:40px 30px;box-shadow:var(--shadow-lg)}
.llogo{text-align:center;font-size:40px;margin-bottom:6px}
.lbrand{font-family:var(--serif);font-size:22px;color:var(--gold-d);letter-spacing:.1em;text-align:center}
.lsub{text-align:center;font-size:10px;letter-spacing:.18em;color:var(--ink3);margin-bottom:24px}
.lcard label{display:block;font-size:10px;color:var(--ink3);letter-spacing:.06em;margin:12px 0 4px}
.lcard input{width:100%;padding:11px 12px;border:1px solid var(--border2);border-radius:var(--r);font-size:13px;background:var(--cream)}
.lerr{min-height:16px;font-size:12px;color:#b03020;margin-top:8px;text-align:center}
.lbtn{width:100%;margin-top:18px;padding:12px;background:var(--gold-d);color:var(--cream);border:none;border-radius:var(--r);font-size:13px}
.hdr{background:var(--ink);padding:0 16px;height:56px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:40}
.hdr-title{font-family:var(--serif);font-size:18px;color:var(--gold-l);letter-spacing:.06em}
.hdr-right{margin-left:auto;display:flex;gap:8px}
.hdr-nav{padding:6px 11px;border:1px solid rgba(255,255,255,.16);border-radius:6px;color:var(--gold-l);font-size:11px;text-decoration:none;background:none}
.wrap{max-width:920px;margin:0 auto;padding:18px 14px 60px}
.ptitle{font-family:var(--serif);font-size:20px;color:var(--ink);margin-bottom:4px}
.pdesc{font-size:13px;color:var(--ink2);margin-bottom:16px;line-height:1.7}
.sumrow{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sum{flex:1 1 150px;background:var(--white);border:1px solid var(--border);border-radius:var(--rl);box-shadow:var(--shadow);padding:12px 16px}
.sum-l{font-size:11px;color:var(--ink3);letter-spacing:.04em}
.sum-v{font-size:22px;font-weight:800;color:var(--gold-d);font-variant-numeric:tabular-nums;margin-top:2px}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.btn{border:1px solid var(--border2);border-radius:var(--r);padding:8px 14px;font-size:13px;background:var(--white);color:var(--ink2)}
.btn.bp{background:var(--gold-d);color:var(--cream);border-color:var(--gold-d)}
.btn.bd{background:rgba(176,48,32,.92);color:#fff;border:none}
.btn.sm{padding:5px 11px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.cnt{font-size:12px;color:var(--ink2);margin-left:auto}
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--rl);box-shadow:var(--shadow);overflow:hidden}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 12px;font-size:13px;border-bottom:1px solid var(--cream2);vertical-align:middle}
th{background:var(--cream2);color:var(--ink3);font-size:11px;font-weight:600;letter-spacing:.04em}
td.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12px}
.ev-nm{font-weight:700;color:var(--ink)}
.ev-dt{font-size:11px;color:var(--ink3);font-family:var(--mono)}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.ec{text-align:center;color:var(--ink3);padding:40px 12px;font-size:13px}
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{background:#18110a;color:#fff;font-size:13px;padding:10px 18px;border-radius:18px;box-shadow:var(--shadow-lg)}
.toast.err{background:#b03020}
.toast.inf{background:#2a5fa0}
</style>
</head>
<body>

<div id="login-screen">
  <div class="lcard">
    <div class="llogo">🗄</div>
    <div class="lbrand">テキーラ道場</div>
    <div class="lsub">ストレージ管理</div>
    <label>メールアドレス</label>
    <input type="email" id="lemail" autocomplete="username">
    <label>パスワード</label>
    <input type="password" id="lpass" autocomplete="current-password">
    <div class="lerr" id="lerr"></div>
    <button class="lbtn" id="lbtn">ログイン</button>
  </div>
</div>

<div id="app">
  <div class="hdr">
    <div class="hdr-title">🗄 ストレージ管理</div>
    <div class="hdr-right">
      <a class="hdr-nav" href="/tdhome.html">← ホーム</a>
      <button class="hdr-nav" id="btn-logout">ログアウト</button>
    </div>
  </div>
  <div class="wrap">
    <div class="ptitle">イベント写真の原本</div>
    <div class="pdesc">原本保存をオンにしたイベントで投稿された写真の<b>無圧縮の原本</b>（EXIF・GPS入り）を一覧します。原本は<b>ZIPで一括ダウンロード</b>してローカルに保存したあと、<b>削除</b>してストレージを空けられます。削除しても表示用の写真（ギャラリー）は残ります。原本の閲覧・DLは管理者のみです。</div>
    <div class="sumrow">
      <div class="sum"><div class="sum-l">原本のあるイベント</div><div class="sum-v" id="sum-events">—</div></div>
      <div class="sum"><div class="sum-l">原本の枚数</div><div class="sum-v" id="sum-count">—</div></div>
      <div class="sum"><div class="sum-l">原本の合計容量</div><div class="sum-v" id="sum-bytes">—</div></div>
    </div>
    <div class="toolbar">
      <button class="btn sm" id="btn-reload">↻ 再読み込み</button>
      <span class="cnt" id="cnt"></span>
    </div>
    <div class="card">
      <table>
        <thead><tr><th>イベント</th><th style="width:90px;text-align:right">枚数</th><th style="width:110px;text-align:right">容量</th><th style="width:220px;text-align:right">操作</th></tr></thead>
        <tbody id="tb"><tr><td colspan="4" class="ec">読み込み中…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<div id="toasts"></div>

<script>
firebase.initializeApp(FIREBASE_CONFIG);
var auth=firebase.auth(), db=firebase.firestore(), storage=firebase.storage();
function g(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(msg,type){ var d=document.createElement('div'); d.className='toast'+(type?' '+type:''); d.textContent=msg; g('toasts').appendChild(d); setTimeout(function(){d.remove();},3000); }
function fmtBytes(n){ n=n||0; if(n<1024) return n+' B'; if(n<1048576) return (n/1024).toFixed(0)+' KB'; if(n<1073741824) return (n/1048576).toFixed(1)+' MB'; return (n/1073741824).toFixed(2)+' GB'; }
function safeName(s){ return String(s||'').replace(/[\\/:*?"<>|]+/g,'_').replace(/\s+/g,'_').slice(0,60); }

AuthRole.requireStaff(auth, function(user, role){
  g('login-screen').style.display='none';
  g('app').style.display='block';
  init();
}, function(){
  g('login-screen').style.display='flex';
  g('app').style.display='none';
});
g('lbtn').addEventListener('click',function(){
  auth.signInWithEmailAndPassword((g('lemail').value||'').trim(), g('lpass').value).catch(function(e){ g('lerr').textContent=e.message; });
});
g('lpass').addEventListener('keydown',function(e){ if(e.key==='Enter') g('lbtn').click(); });
g('btn-logout').addEventListener('click',function(){ auth.signOut(); });

var _inited=false, _rows=[];
function init(){ if(_inited){ load(); return; } _inited=true; g('btn-reload').addEventListener('click',load); load(); }

// 全イベントを走査し、hasOriginal==true の写真を集計
function load(){
  g('tb').innerHTML='<tr><td colspan="4" class="ec">読み込み中…</td></tr>';
  g('btn-reload').disabled=true;
  db.collection('events').get().then(function(snap){
    var evs=snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    return Promise.all(evs.map(function(ev){
      return db.collection('events').doc(ev.id).collection('photos').where('hasOriginal','==',true).get()
        .then(function(ps){
          var photos=ps.docs.map(function(p){ return Object.assign({id:p.id}, p.data()); }).filter(function(p){ return p.origPath; });
          var bytes=photos.reduce(function(s,p){ return s+(p.origSize||0); }, 0);
          return { id:ev.id, name:ev.name||'（無題）', startDate:ev.startDate||'', endDate:ev.endDate||'', photos:photos, bytes:bytes };
        })
        .catch(function(){ return { id:ev.id, name:ev.name||'（無題）', startDate:ev.startDate||'', endDate:ev.endDate||'', photos:[], bytes:0 }; });
    }));
  }).then(function(results){
    _rows=results.filter(function(r){ return r.photos.length>0; }).sort(function(a,b){ return b.bytes-a.bytes; });
    render();
    g('btn-reload').disabled=false;
  }).catch(function(e){
    g('tb').innerHTML='<tr><td colspan="4" class="ec">読み込み失敗: '+esc(e.message)+'</td></tr>';
    g('btn-reload').disabled=false;
  });
}

function render(){
  var totEv=_rows.length;
  var totCount=_rows.reduce(function(s,r){ return s+r.photos.length; }, 0);
  var totBytes=_rows.reduce(function(s,r){ return s+r.bytes; }, 0);
  g('sum-events').textContent=totEv;
  g('sum-count').textContent=totCount;
  g('sum-bytes').textContent=fmtBytes(totBytes);
  g('cnt').textContent=totEv+' 件のイベントに原本あり';
  var tb=g('tb');
  if(!_rows.length){ tb.innerHTML='<tr><td colspan="4" class="ec">原本が保存されているイベントはありません</td></tr>'; return; }
  tb.innerHTML=_rows.map(function(r){
    var period=(r.startDate||'')+(r.endDate&&r.endDate!==r.startDate?(' 〜 '+r.endDate):'');
    return '<tr>'
      +'<td><div class="ev-nm">'+esc(r.name)+'</div><div class="ev-dt">'+esc(period)+'</div></td>'
      +'<td class="num">'+r.photos.length+'</td>'
      +'<td class="num">'+fmtBytes(r.bytes)+'</td>'
      +'<td><div class="acts">'
        +'<button class="btn bp sm" id="zip-'+esc(r.id)+'" onclick="zipEvent(\''+esc(r.id)+'\')">⬇ ZIP一括DL</button>'
        +'<button class="btn bd sm" id="del-'+esc(r.id)+'" onclick="delEvent(\''+esc(r.id)+'\')">🗑 原本削除</button>'
      +'</div></td>'
      +'</tr>';
  }).join('');
}

function _rowById(id){ for(var i=0;i<_rows.length;i++) if(_rows[i].id===id) return _rows[i]; return null; }

// 原本をZIPで一括ダウンロード
function zipEvent(eid){
  var r=_rowById(eid); if(!r||!r.photos.length) return;
  if(typeof JSZip==='undefined'){ toast('ZIPライブラリの読込に失敗しました','err'); return; }
  var btn=g('zip-'+eid), del=g('del-'+eid); if(btn){ btn.disabled=true; } if(del){ del.disabled=true; }
  var zip=new JSZip(), total=r.photos.length, done=0, failed=0;
  function setLbl(t){ if(btn) btn.textContent=t; }
  setLbl('準備中… 0/'+total);
  var seq=Promise.resolve();
  r.photos.forEach(function(p, idx){
    seq=seq.then(function(){
      return storage.ref(p.origPath).getDownloadURL()
        .then(function(url){ return fetch(url); })
        .then(function(res){ if(!res.ok) throw new Error('HTTP '+res.status); return res.blob(); })
        .then(function(blob){
          var ext=(p.origPath.split('.').pop()||'jpg');
          var base=p.origName?safeName(p.origName.replace(/\.[^.]+$/,'')):('photo_'+(idx+1));
          var fname=('000'+(idx+1)).slice(-3)+'_'+base+'.'+ext;
          zip.file(fname, blob);
          done++; setLbl('取得中… '+done+'/'+total);
        })
        .catch(function(){ failed++; done++; setLbl('取得中… '+done+'/'+total); });
    });
  });
  seq.then(function(){
    setLbl('ZIP生成中…');
    return zip.generateAsync({type:'blob', compression:'STORE'}, function(meta){ setLbl('ZIP生成中… '+Math.round(meta.percent)+'%'); });
  }).then(function(blob){
    var period=(r.startDate||'').replace(/-/g,'');
    var fn='原本_'+safeName(r.name)+(period?'_'+period:'')+'.zip';
    var url=URL.createObjectURL(blob); var a=document.createElement('a'); a.href=url; a.download=fn; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 6000);
    if(btn){ btn.disabled=false; btn.textContent='⬇ ZIP一括DL'; } if(del){ del.disabled=false; }
    toast('ZIPを作成しました（'+ (total-failed) +'/'+total+'枚）'+(failed?'・失敗'+failed+'枚':''), failed?'err':'');
  }).catch(function(e){
    if(btn){ btn.disabled=false; btn.textContent='⬇ ZIP一括DL'; } if(del){ del.disabled=false; }
    toast('ZIP作成に失敗しました: '+(e&&e.message||e),'err');
  });
}

// 原本を削除（表示用は残す）
function delEvent(eid){
  var r=_rowById(eid); if(!r||!r.photos.length) return;
  if(!confirm('「'+r.name+'」の原本 '+r.photos.length+'枚（'+fmtBytes(r.bytes)+'）を削除します。\n\nZIPでのダウンロードは済んでいますか？\n表示用の写真は残りますが、原本（無圧縮・EXIF入り）は元に戻せません。')) return;
  if(!confirm('本当に削除してよろしいですか？この操作は取り消せません。')) return;
  var btn=g('del-'+eid), zb=g('zip-'+eid); if(btn){ btn.disabled=true; btn.textContent='削除中…'; } if(zb){ zb.disabled=true; }
  var FV=firebase.firestore.FieldValue;
  var seq=Promise.resolve(), okCount=0;
  r.photos.forEach(function(p){
    seq=seq.then(function(){
      return storage.ref(p.origPath).delete().catch(function(){})
        .then(function(){ return db.collection('events').doc(eid).collection('photos').doc(p.id).update({
            hasOriginal:false, origPath:FV.delete(), origSize:FV.delete(), origName:FV.delete(), origType:FV.delete()
          }); })
        .then(function(){ okCount++; })
        .catch(function(){});
    });
  });
  seq.then(function(){
    toast(okCount+'枚の原本を削除しました');
    load();
  }).catch(function(e){
    if(btn){ btn.disabled=false; btn.textContent='🗑 原本削除'; } if(zb){ zb.disabled=false; }
    toast('削除に失敗しました: '+(e&&e.message||e),'err');
  });
}
</script>
</body>
</html>
