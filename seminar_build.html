<style>
:root{--ink:#18110a;--ink2:#4a3820;--ink3:#9a8470;--gold:#c8921e;--gold-d:#7a5610;--cream:#faf7f1;--cream2:#f0ebe0;--white:#fff;--red:#b03020;--teal:#1a6e58;--border:rgba(160,130,100,.2);--border2:rgba(160,130,100,.34);--r:8px;--rl:13px;--sans:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--cream);color:var(--ink);min-height:100vh}
button{cursor:pointer;font-family:var(--sans)}
.hdr{background:var(--ink);padding:0 14px;height:52px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:40}
.hdr .t{font-size:15px;color:var(--gold);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.hdr .r{margin-left:auto;display:flex;gap:6px;flex-shrink:0}
.hnav{padding:7px 12px;border:1px solid rgba(255,255,255,.18);border-radius:7px;color:var(--gold);font-size:12px;text-decoration:none;background:none}
.hnav.save{background:var(--gold-d);color:#fff;border:none;font-weight:700}
.wrap{max-width:860px;margin:0 auto;padding:14px 12px 90px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar .lk{font-size:12px;text-decoration:none;padding:7px 12px;border-radius:8px;border:1px solid var(--border2);color:var(--ink2);background:var(--white);font-weight:600}
.bar .lk.go{background:var(--teal);color:#fff;border:none}
.bar .lk.pv{background:#2a62a0;color:#fff;border:none}
.tip{font-size:12px;color:var(--ink3);line-height:1.7;margin-bottom:12px;background:var(--white);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--rl);padding:12px;margin-bottom:10px;box-shadow:0 1px 8px rgba(24,17,10,.05)}
.card.disabled{opacity:.5}
.card.s360{border-color:#2a62a0}
.chead{display:flex;align-items:center;gap:8px}
.drag{cursor:grab;color:var(--ink3);font-size:18px;flex-shrink:0;touch-action:none;user-select:none}
.chead .ti{font-size:15px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chead .tm{font-size:12px;color:var(--gold-d);font-weight:700;white-space:nowrap}
.chead .sp{flex:1}
.tog{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--ink2);white-space:nowrap}
.chip{font-size:11px;font-weight:700;padding:2px 8px;border-radius:9px;background:var(--cream2);color:var(--ink2)}
.chip.on{background:var(--teal);color:#fff}
.mstrip{display:flex;gap:6px;overflow-x:auto;padding:8px 2px 2px;margin-top:8px}
.mc{position:relative;width:88px;height:66px;flex-shrink:0;border-radius:8px;overflow:hidden;border:2px solid var(--teal);cursor:grab;touch-action:none;background:var(--cream2)}
.mc.off{border-color:var(--border2);opacity:.45}
.mc img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.mc .pv{position:absolute;top:3px;left:3px;font-size:12px}
.mc .ck{position:absolute;right:3px;bottom:3px;width:20px;height:20px;border-radius:50%;background:var(--teal);color:#fff;font-size:12px;line-height:20px;text-align:center;font-weight:700}
.mc.off .ck{background:rgba(0,0,0,.4)}
.mc .st{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink3);text-align:center}
.mnone{font-size:12px;color:var(--ink3);padding:8px 2px}
.s360 .f{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.s360 input{flex:1;min-width:160px;padding:8px 10px;border:1px solid var(--border2);border-radius:7px;font-size:13px}
.rm{background:none;border:1px solid var(--border2);color:var(--red);border-radius:7px;padding:5px 9px;font-size:12px}
.add360{width:100%;padding:11px;border:1px dashed #2a62a0;border-radius:10px;background:#eef3fa;color:#2a62a0;font-weight:700;font-size:13px}
#msg{padding:40px 16px;text-align:center;color:var(--ink3)}
#toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{background:#18110a;color:#fff;font-size:12px;padding:9px 14px;border-radius:18px;opacity:0;transition:.2s}.toast.show{opacity:.96}
</style>
</head>
<body>
<div id="login-screen" style="display:none;align-items:center;justify-content:center;height:100vh;text-align:center;padding:24px"><div style="font-size:14px;color:var(--ink2);line-height:1.9">このページの利用にはスタッフ／共同管理者としてのログインが必要です。<br><a href="/admin.html" style="color:var(--gold-d);font-weight:700">▶ 管理ログイン</a></div></div>
<div class="hdr"><span class="t" id="hdr-title">🎬 セミナー構築</span><div class="r"><button class="hnav" onclick="resetDefault()">既定に戻す</button><button class="hnav save" onclick="save()">💾 保存</button></div></div>
<div id="msg">読み込み中…</div>
<div class="wrap" id="wrap" style="display:none">
  <div class="bar">
    <a class="lk go" id="lk-present" target="_blank">▶ 実施（配信者）</a>
    <a class="lk pv" id="lk-preview" target="_blank">👁 参加者プレビュー</a>
  </div>
  <div class="tip">イベントの流れからセミナーを構築します。ドラッグで項目の順番を入れ替え、各項目の写真・動画は横にドラッグで並び替え、タップで表示/非表示を切り替えできます。地図の表示ON/OFF、項目自体の表示ON/OFFも設定できます。「＋360°動画」で任意の位置にVimeoの360°動画を差し込めます。</div>
  <div id="steps"></div>
  <button class="add360" onclick="add360()">＋ 360°動画ステップを挿入</button>
</div>
<div id="toasts"></div>
<script>
firebase.initializeApp(FIREBASE_CONFIG);
var auth=firebase.auth(), db=firebase.firestore();
function g(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(m){var d=document.createElement('div');d.className='toast';d.textContent=m;g('toasts').appendChild(d);requestAnimationFrame(function(){requestAnimationFrame(function(){d.classList.add('show');});});setTimeout(function(){d.classList.remove('show');setTimeout(function(){d.remove();},250);},2400);}
var EID=new URLSearchParams(location.search).get('e')||'';
var _event=null, _items=[], _photosByItem={}, _itemById={};

function phSort(a,b){ var oa=(a.order!=null?a.order:null), ob=(b.order!=null?b.order:null); if(oa!=null||ob!=null){ if(oa==null) return 1; if(ob==null) return -1; if(oa!==ob) return oa-ob; } return (a.takenAt||a.createdMs||0)-(b.takenAt||b.createdMs||0); }
function _isVid(p){ return !!(p&&p.mediaType==='video'); }
function _thumb(p){ return _isVid(p)?(p.posterUrl||p.thumbUrl||''):(p.thumbUrl||p.url||''); }
function _itemTime(it){ var s=String(it.actualStart||it.time||'').slice(0,5), e=String(it.isMove?(it.actualEnd||it.toTime||''):(it.actualEnd||it.endTime||'')).slice(0,5); return s?(e&&e!==s?(s+'〜'+e):s):''; }
// 座標正規化（mapUrlから抽出）— 並び替えのTZ判定に使用
function _mkLL(la,ln){ return (isFinite(la)&&isFinite(ln)&&la>=-90&&la<=90&&ln>=-180&&ln<=180)?{lat:la,lng:ln}:null; }
function _coordsFromGmapUrl(url){ if(!url) return null; var s=String(url).replace(/%2C/gi,','),m;
  m=s.match(/!3d(-?\d{1,2}(?:\.\d+)?)!4d(-?\d{1,3}(?:\.\d+)?)/); if(m){ var a=_mkLL(+m[1],+m[2]); if(a) return a; }
  m=s.match(/[?&](?:q|query|destination|daddr|ll|sll|center)=(-?\d{1,2}(?:\.\d+)?)\s*,\s*(-?\d{1,3}(?:\.\d+)?)/i); if(m){ var b=_mkLL(+m[1],+m[2]); if(b) return b; }
  m=s.match(/@(-?\d{1,2}(?:\.\d+)?),(-?\d{1,3}(?:\.\d+)?)/); if(m){ var c=_mkLL(+m[1],+m[2]); if(c) return c; } return null; }
function _normItem(it){ if(it.mapUrl){ var a=_coordsFromGmapUrl(it.mapUrl); if(a){ it.lat=a.lat; it.lng=a.lng; } } if(it.isMove&&it.toMapUrl){ var b=_coordsFromGmapUrl(it.toMapUrl); if(b){ it.toLat=b.lat; it.toLng=b.lng; } } return it; }
// ── スケジュールと同じ並び（TZ考慮・日付変更線対応）。event.html の _sortByJst を踏襲 ──
function _tzOffMin(inst,tz){ var m={}; new Intl.DateTimeFormat('en-US',{timeZone:tz,hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(inst).forEach(function(p){m[p.type]=p.value;}); if(m.hour==='24')m.hour='00'; return Math.round((Date.UTC(+m.year,+m.month-1,+m.day,+m.hour,+m.minute,+m.second)-inst.getTime())/60000); }
function _wallInstant(dateStr,timeStr,tz){ var dp=(dateStr||'').split('-'), tp=(timeStr||'00:00').split(':'); if(dp.length<3) return null; var guess=Date.UTC(+dp[0],+dp[1]-1,+dp[2],(+tp[0]||0),(+tp[1]||0)); return new Date(guess-_tzOffMin(new Date(guess),tz)*60000); }
function _hmSec(s){ var m=String(s==null?'':s).match(/^(\d{1,2}):([0-5]\d)(?::([0-5]\d))?/); if(!m) return null; return (+m[1])*3600+(+m[2])*60+(m[3]!=null?+m[3]:0); }
function _safeTz(la,ln){ try{ return window.tzlookup?tzlookup(la,ln):null; }catch(e){ return null; } }
function _endMark(it){ var e=(it&&it.endTime&&String(it.endTime).trim())||(it&&it.isMove&&it.toTime&&String(it.toTime).trim()); return e?1:0; }
function _caSec(it){ return (it&&it.createdAt&&it.createdAt.seconds)||0; }
function sortSchedule(items){
  return items.map(function(it,i){
    var tz=(it.lat!=null&&it.lng!=null)?(_safeTz(it.lat,it.lng)||'Asia/Tokyo'):'Asia/Tokyo';
    var effT=it.time||it.actualStart||'23:59';
    var di=_wallInstant(it.date, effT, tz);
    var sortMs=di?(di.getTime()+(((_hmSec(effT)||0)%60)*1000)):0;
    return {it:it, sortMs:sortMs, day:(it.date||'9999-99-99'), em:_endMark(it), ca:_caSec(it), seq:it.seq||0, i:i};
  }).sort(function(a,b){
    if(a.day!==b.day) return a.day<b.day?-1:1;
    if(a.sortMs!==b.sortMs) return a.sortMs-b.sortMs;
    if(a.em!==b.em) return a.em-b.em;
    return (a.ca-b.ca)||(a.seq-b.seq)||(a.i-b.i);
  }).map(function(x){ return x.it; });
}

if(!EID){ g('msg').textContent='イベントが指定されていません。'; }
else AuthRole.requireStaffOrCoAdmin(auth, EID,
  function(user){ load(); },
  function(user){ load(); },
  function(){ g('msg').innerHTML='このページはスタッフ／共同管理者のみ利用できます。'; });

function load(){
  Promise.all([
    db.collection('events').doc(EID).get(),
    db.collection('events').doc(EID).collection('scheduleItems').get(),
    db.collection('events').doc(EID).collection('photos').get().catch(function(){return {docs:[]};}),
    db.collection('events').doc(EID).collection('seminar').doc('config').get().catch(function(){return {exists:false};})
  ]).then(function(res){
    if(!res[0].exists){ g('msg').textContent='イベントが見つかりません。'; return; }
    _event=Object.assign({id:EID},res[0].data());
    _items=res[1].docs.map(function(d){ return _normItem(Object.assign({id:d.id},d.data())); });
    _items=sortSchedule(_items); // スケジュールと同じ並び（TZ/日付変更線対応）
    _items.forEach(function(it){ _itemById[it.id]=it; });
    _photosByItem={};
    res[2].docs.map(function(d){ return Object.assign({id:d.id},d.data()); }).forEach(function(p){ (_photosByItem[p.scheduleItemId]=_photosByItem[p.scheduleItemId]||[]).push(p); });
    Object.keys(_photosByItem).forEach(function(k){ _photosByItem[k].sort(phSort); });
    g('hdr-title').textContent='🎬 セミナー構築 — '+(_event.name||'');
    g('lk-present').href='/seminar_flow.html?e='+encodeURIComponent(EID)+'&present=1';
    g('lk-preview').href='/seminar_flow.html?e='+encodeURIComponent(EID);
    var cfg=(res[3]&&res[3].exists)?res[3].data():null;
    g('msg').style.display='none'; g('wrap').style.display='block';
    renderAll(buildModel(cfg));
  }).catch(function(e){ g('msg').textContent='読み込み失敗: '+(e&&e.message||e); });
}

// config or default → model（steps）
function buildModel(cfg){
  var steps=[], used={};
  if(cfg && Array.isArray(cfg.steps)){
    cfg.steps.forEach(function(s){
      if(s.type==='360'){ steps.push({type:'360', vimeoId:s.vimeoId||'', title:s.title||'', enabled:s.enabled!==false}); return; }
      if(!_itemById[s.itemId]) return; used[s.itemId]=1;
      steps.push({type:'item', itemId:s.itemId, enabled:s.enabled!==false, showMap:s.showMap!==false, media:(Array.isArray(s.media)?s.media.slice():null), excluded:(Array.isArray(s.excluded)?s.excluded.slice():[])});
    });
  }
  _items.forEach(function(it){ if(used[it.id]) return; steps.push({type:'item', itemId:it.id, enabled:true, showMap:(it.lat!=null&&it.lng!=null), media:null, excluded:[]}); });
  return steps;
}
function resetDefault(){ if(!confirm('イベントの流れから既定の構成に戻します。保存前の変更は失われます。よろしいですか？')) return; renderAll(buildModel(null)); toast('既定に戻しました（保存で確定）'); }

function vimeoId(v){ v=String(v||'').trim(); var m=v.match(/vimeo\.com\/(?:video\/)?(\d+)/); if(m) return m[1]; m=v.match(/^(\d+)$/); return m?m[1]:v; }

function renderAll(model){
  var c=g('steps'); c.innerHTML=model.map(stepHtml).join('');
  if(window.Sortable){
    Sortable.create(c,{animation:150,handle:'.drag',delay:120,delayOnTouchOnly:true});
    Array.prototype.forEach.call(c.querySelectorAll('.mstrip'),function(st){ Sortable.create(st,{animation:150,delay:140,delayOnTouchOnly:true,onStart:function(){window._drag=true;},onEnd:function(){setTimeout(function(){window._drag=false;},60);}}); });
  }
}
function stepHtml(s){
  if(s.type==='360'){
    return '<div class="card s360" data-type="360"><div class="chead"><span class="drag">⠿</span><span class="chip" style="background:#2a62a0;color:#fff">🌐 360°動画</span><span class="sp"></span><button class="rm" onclick="this.closest(\'.card\').remove()">削除</button></div>'
      +'<div class="f"><input class="v360id" placeholder="Vimeo URL または ID" value="'+esc(s.vimeoId||'')+'"><input class="v360t" placeholder="タイトル（任意）" value="'+esc(s.title||'')+'"></div></div>';
  }
  var it=_itemById[s.itemId]; if(!it) return '';
  var all=(_photosByItem[s.itemId]||[]);
  // 表示順: media(選択順) → 残り。各セルの on/off は excluded で判定。
  var order=[], seen={};
  if(s.media){ s.media.forEach(function(id){ if(_pbyId(s.itemId,id)){ order.push(id); seen[id]=1; } }); }
  all.forEach(function(p){ if(!seen[p.id]) order.push(p.id); });
  var exSet={}; (s.excluded||[]).forEach(function(id){ exSet[id]=1; });
  var cells=order.map(function(id){ var p=_pbyId(s.itemId,id); if(!p) return '';
    // 未構築(media未指定)時は家族のみ閲覧可の写真は既定OFF（安全側・staffが明示的にONできる）
    var off=exSet[id] || (s.media==null && p.familyOnly);
    var inner=_isVid(p)?((p.status==='ready'&&_thumb(p))?'<img src="'+esc(_thumb(p))+'">':'<div class="st">🎬'+(p.status==='processing'?'<br>変換中':'')+'</div>')+'<span class="pv">🎬</span>':'<img src="'+esc(_thumb(p))+'">';
    var fam=p.familyOnly?'<span class="pv" style="left:auto;right:3px;top:3px;font-size:10px">👪</span>':'';
    return '<div class="mc'+(off?' off':'')+'" data-pid="'+esc(id)+'" onclick="if(!window._drag){var o=this.classList.toggle(\'off\');this.querySelector(\'.ck\').textContent=o?\'\':\'✓\';}"><span>'+inner+'</span>'+fam+'<span class="ck">'+(off?'':'✓')+'</span></div>';
  }).join('');
  var tm=_itemTime(it);
  return '<div class="card'+(s.enabled?'':' disabled')+'" data-type="item" data-item-id="'+esc(s.itemId)+'">'
    +'<div class="chead"><span class="drag">⠿</span><span class="ti">'+esc(it.title||'（無題）')+'</span>'+(tm?'<span class="tm">'+esc(tm)+'</span>':'')+'<span class="sp"></span>'
    +'<label class="tog"><input type="checkbox" class="en" '+(s.enabled?'checked':'')+' onchange="this.closest(\'.card\').classList.toggle(\'disabled\',!this.checked)"> 表示</label>'
    +'<label class="tog"><input type="checkbox" class="map" '+(s.showMap?'checked':'')+'> 地図</label></div>'
    +(all.length?('<div class="mstrip">'+cells+'</div>'):'<div class="mnone">この項目にメディアはありません。</div>')+'</div>';
}
function _pbyId(itemId,id){ return (_photosByItem[itemId]||[]).find(function(p){return p.id===id;}); }
function _wasKnown(){ return false; } // 新規写真はデフォルト表示（簡潔化）

function add360(){
  var c=g('steps');
  var div=document.createElement('div');
  div.innerHTML=stepHtml({type:'360',vimeoId:'',title:''});
  c.appendChild(div.firstChild);
  toast('360°動画ステップを末尾に追加しました（ドラッグで位置を調整）');
}
// クリックとドラッグの誤爆防止
document.addEventListener('pointerdown',function(e){ if(e.target.closest&&e.target.closest('.mc')) { window._drag=false; } });
document.addEventListener('dragstart',function(){ window._drag=true; });

function save(){
  var cards=g('steps').children, steps=[];
  for(var i=0;i<cards.length;i++){
    var c=cards[i];
    if(c.getAttribute('data-type')==='360'){
      var vid=vimeoId(c.querySelector('.v360id').value), tt=(c.querySelector('.v360t').value||'').trim();
      if(!vid) continue;
      steps.push({type:'360', vimeoId:vid, title:tt||'360°動画', enabled:true});
    } else {
      var itemId=c.getAttribute('data-item-id');
      var en=c.querySelector('.en').checked, mp=c.querySelector('.map').checked;
      var media=[], excluded=[];
      Array.prototype.forEach.call(c.querySelectorAll('.mc'),function(mc){ var pid=mc.getAttribute('data-pid'); if(mc.classList.contains('off')) excluded.push(pid); else media.push(pid); });
      steps.push({type:'item', itemId:itemId, enabled:en, showMap:mp, media:media, excluded:excluded});
    }
  }
  db.collection('events').doc(EID).collection('seminar').doc('config')
    .set({steps:steps, updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true})
    .then(function(){ toast('保存しました'); })
    .catch(function(e){ toast('保存失敗: '+(e&&e.message||e)); });
}
</script>
</body>
</html>
