<style>
:root{--ink:#18110a;--ink2:#4a3820;--ink3:#9a8470;--gold:#c8921e;--gold-d:#7a5610;--gold-l:#e8b84a;
  --cream:#f7f1e6;--cream2:#efe7d7;--cream3:#e3d7c0;--white:#fffdf9;--border:#e3d7c0;--border2:#d3c4a6;
  --red:#b03020;--teal:#1a6e58;--r:8px;--sans:'Noto Sans JP',system-ui,sans-serif;--mono:'DM Mono',monospace;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--cream);color:var(--ink);font-family:var(--sans);min-height:100vh;font-size:14px}
#login-screen{display:none;align-items:center;justify-content:center;height:100vh}
.lcard{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:28px 26px;width:320px}
.lcard h2{font-size:20px;color:var(--gold-d);margin-bottom:4px}
.lcard .lsub{font-size:12px;color:var(--ink3);margin-bottom:16px}
.lcard label{display:block;font-size:11px;color:var(--ink3);margin:12px 0 4px}
.lcard input{width:100%;padding:8px;border:1px solid var(--border2);border-radius:6px;font-size:14px}
#lerr{font-size:12px;color:var(--red);margin-top:8px;min-height:16px}
.lbtn{width:100%;margin-top:16px;padding:10px;background:var(--gold-d);color:#fff;border:none;border-radius:6px;font-size:14px;cursor:pointer}
#app{display:none;max-width:960px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
header h1{font-size:18px;color:var(--gold-d)}
header .sub{font-size:11px;color:var(--ink3)}
.hdr-right{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:11px;color:var(--ink3)}
.btn{padding:8px 14px;border:1px solid var(--border2);border-radius:6px;background:var(--white);color:var(--ink2);font-size:13px;cursor:pointer;font-family:var(--sans)}
.btn:hover{border-color:var(--gold)}
.btn.bp{background:var(--gold-d);color:#fff;border-color:var(--gold-d);font-weight:600}
.btn.bp:disabled{opacity:.5;cursor:not-allowed}
.btn.bs{padding:5px 10px;font-size:12px}
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h2{font-size:14px;color:var(--ink2);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.pdesc{font-size:12px;color:var(--ink3);line-height:1.7;margin-bottom:10px}
.filebox{border:2px dashed var(--border2);border-radius:var(--r);padding:18px;text-align:center;background:var(--cream2)}
.filebox label{display:inline-block;margin:4px 6px}
input[type=file]{font-size:12px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--border)}
th{color:var(--ink3);font-weight:600;font-size:11px;background:var(--cream2)}
td.mono,th.mono{font-family:var(--mono);text-align:right}
.badge{display:inline-block;font-size:10px;padding:1px 7px;border-radius:10px;background:var(--cream3);color:var(--ink2)}
.badge.teal{background:#d6efe7;color:var(--teal)}
.shop-hd{display:flex;align-items:center;gap:10px;margin:4px 0 8px}
.shop-hd .nm{font-size:15px;font-weight:700;color:var(--gold-d)}
.opt-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);margin:6px 0}
.opt-row input[type=date]{padding:4px 6px;border:1px solid var(--border2);border-radius:5px;font-size:12px}
#log{font-family:var(--mono);font-size:11px;color:var(--ink2);background:var(--cream2);border-radius:6px;padding:10px;max-height:220px;overflow:auto;white-space:pre-wrap;margin-top:10px}
.dim{color:var(--ink3)}
.warn{color:var(--red)}
a{color:var(--gold-d)}
</style>

<body>

<div id="login-screen">
  <div class="lcard">
    <h2>テキーラ道場</h2>
    <div class="lsub">オーナーとしてログインしてください</div>
    <label>メールアドレス</label>
    <input id="l-email" type="email" autocomplete="username">
    <label>パスワード</label>
    <input id="l-pass" type="password" autocomplete="current-password">
    <div id="lerr"></div>
    <button class="lbtn" id="l-btn">ログイン</button>
  </div>
</div>

<div id="app">
  <header>
    <h1>🌎 海外相場 取込</h1>
    <span class="sub">保存したHTMLから解析して marketIntl に取り込みます</span>
    <div class="hdr-right">
      <a href="/admin_tequila.html">← テキーラ管理</a>
      <span id="hdr-user"></span>
      <button class="btn bs" id="btn-logout">ログアウト</button>
    </div>
  </header>

  <div class="card">
    <h2>① HTMLを選択</h2>
    <div class="pdesc">
      ブラウザで各店のカテゴリページを「<b>ウェブページ、完全</b>」で保存し、その <code>.html</code> を選びます。
      フォルダ選択なら中の <code>.html</code> をまとめて読みます（ページ送り分も一緒に選択可・商品IDの重複は自動排除）。
      どの店かは中身から自動判定します。<br>
      <span class="dim">現在の対応店: <b id="supported-shops">—</b>（新しい店は個別に相談→解析して追加）</span>
    </div>
    <div class="filebox">
      <div><label>📁 フォルダを選択: <input type="file" id="pick-dir" webkitdirectory multiple></label></div>
      <div><label>📄 ファイルを選択: <input type="file" id="pick-files" accept=".html,.htm" multiple></label></div>
      <div class="dim" style="font-size:11px;margin-top:6px" id="pick-status">未選択</div>
    </div>
  </div>

  <div class="card" id="preview-card" style="display:none">
    <h2>② 解析プレビュー</h2>
    <div id="preview-body"></div>
    <div id="unknown-files" class="warn" style="font-size:12px;margin-top:8px"></div>
  </div>

  <div class="card" id="exec-card" style="display:none">
    <h2>③ 取込</h2>
    <div class="opt-row">
      <label><input type="checkbox" id="opt-history"> 価格推移も記録する（月次の履歴に1点追加）</label>
      <span class="dim">記録日</span>
      <input type="date" id="opt-date">
      <span class="dim" style="font-size:11px">※通常はオフ（手動取込は蓄積しない運用）</span>
    </div>
    <button class="btn bp" id="btn-import" disabled>marketIntl に取り込む</button>
    <div id="log"></div>
  </div>
</div>

<script>
if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
var auth=firebase.auth();
var db=firebase.firestore();
var FV=firebase.firestore.FieldValue;

// ── ログイン ──
document.getElementById('l-btn').addEventListener('click',async function(){
  var email=document.getElementById('l-email').value.trim(), pass=document.getElementById('l-pass').value;
  document.getElementById('lerr').textContent=''; this.disabled=true;
  try{ await auth.signInWithEmailAndPassword(email,pass); }
  catch(e){ document.getElementById('lerr').textContent=e.message; this.disabled=false; }
});
document.getElementById('l-pass').addEventListener('keydown',function(e){ if(e.key==='Enter') document.getElementById('l-btn').click(); });
document.getElementById('btn-logout').addEventListener('click',function(){ auth.signOut(); });

// ══════════ 解析ユーティリティ（tools/market の Python 版を移植） ══════════
function decodeEntities(s){ var t=document.createElement('textarea'); t.innerHTML=String(s||''); return t.value; }
function norm(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,''); }
var STOP=new Set(['tequila','the','and','with','for','de','la','el','los','las','con','por','ml','cl','liter','litre','bottle']);
function tokens(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().split(/[^a-z0-9]+/).filter(function(t){return t.length>=3&&!STOP.has(t)&&!/^\d+ml$/.test(t);}); }
var CLASS_RULES=[['Cristalino',/cristalino/i],['ExtraAnejo',/extra\s*a[nñ]ejo|extra/i],['Reposado',/reposa|reposado/i],['Anejo',/a[nñ]ejo/i],['Joven',/joven|gold|\boro\b/i],['Blanco',/blanco|silver|plata/i]];
function classOf(name){ for(var i=0;i<CLASS_RULES.length;i++){ if(CLASS_RULES[i][1].test(name||'')) return CLASS_RULES[i][0]; } return ''; }
function volFromName(name){ var m=String(name||'').match(/(\d{2,4})\s*ml|(\d(?:\.\d+)?)\s*[lL](?![a-z])/); if(!m)return null; return m[1]?parseInt(m[1],10):Math.round(parseFloat(m[2])*1000); }
function brandOf(name){ var n=String(name||'').replace(/^【[^】]*】/,'').trim().replace(/\d{2,4}\s*ml|\d(?:\.\d+)?\s*[lL]\b/g,''); var toks=n.split(/[\s　]+/).filter(Boolean); return toks.slice(0,2).join(' '); }
var ABV_RE=/(\d{2,3}(?:\.\d+)?)\s*%\s*(?:abv|alc\.?|alcohol|vol)|(?:abv|alc\.?|alcohol)[^0-9]{0,8}(\d{2,3}(?:\.\d+)?)\s*%|(\d{2,3}(?:\.\d+)?)\s*proof/ig;
function abvOf(text){ ABV_RE.lastIndex=0; var m; while((m=ABV_RE.exec(text||''))){ var v=m[3]?parseFloat(m[3])/2:parseFloat(m[1]||m[2]); if(v>=35&&v<=75) return Math.round(v*10)/10; } return null; }
function finalizeItem(it){
  var vol=it.volumeMl||volFromName(it.name); var volUsed=vol||750;
  var ppm=(it.price!=null&&it.price>0)?(it.price/volUsed):null;
  return { volumeMl:vol||null, price750:ppm!=null?Math.round(ppm*750):null,
           classGuess:classOf(it.name), brandGuess:brandOf(it.name),
           abv:(it.abv!=null?it.abv:abvOf(it.name)) };
}

// ── 店レジストリ（判定＋パーサ）。新店はここに1エントリ追加すれば対応 ──
function parseKLWines(html){
  var re=/aria-label="View details for ([^"]+)"[^>]*href="https:\/\/shop\.klwines\.com\/products\/details\/(\d+)"/g;
  var m, uniq=[], seen=new Set();
  while((m=re.exec(html))){ var pid=m[2]; if(seen.has(pid))continue; seen.add(pid); uniq.push({id:pid,name:m[1],pos:m.index}); }
  var priceRe=/\$([0-9][0-9,]*\.[0-9]{2})/g;
  return uniq.map(function(u,i){
    var seg=html.slice(u.pos, i+1<uniq.length?uniq[i+1].pos:html.length);
    var pm, prices=[]; priceRe.lastIndex=0;
    while((pm=priceRe.exec(seg))) prices.push(parseFloat(pm[1].replace(/,/g,'')));
    var price=prices.length?Math.min.apply(null,prices):null;
    return { id:u.id, name:decodeEntities(u.name).trim(), price:price,
             availability:price!=null?'在庫あり':'', url:'https://shop.klwines.com/products/details/'+u.id };
  });
}
var IMPORT_SHOPS={
  klwines:{ name:'K&L Wines', country:'US', currency:'USD',
    detect:function(h){ return /shop\.klwines\.com\/products\/details/.test(h); },
    parse:parseKLWines }
};
function detectShop(html){ for(var k in IMPORT_SHOPS){ if(IMPORT_SHOPS[k].detect(html)) return k; } return null; }

document.getElementById('supported-shops').textContent=Object.keys(IMPORT_SHOPS).map(function(k){return IMPORT_SHOPS[k].name;}).join(' / ');

// ══════════ マスタ照合（bottles コレクション） ══════════
var masters=[];
function loadMasters(){
  return db.collection('bottles').get().then(function(snap){
    masters=snap.docs.map(function(d){ var v=d.data(); var es=v.bottleEs||v.bottleEsBase||''; var tk=tokens(es);
      return { bottleId:d.id, es:es, key:norm(es), tk:tk, tkLen:tk.join('').length }; })
      .filter(function(m){ return m.key.length>=6; });
    masters.sort(function(a,b){ return b.key.length-a.key.length; });
  });
}
function matchMaster(name){
  var n=norm(name); if(!n) return null;
  for(var i=0;i<masters.length;i++){ if(n.indexOf(masters[i].key)>=0) return masters[i]; }
  var itemToks=new Set(tokens(name)); if(!itemToks.size) return null;
  var best=null;
  for(var j=0;j<masters.length;j++){ var m=masters[j];
    if(m.tk.length<2||m.tkLen<8) continue;
    if(m.tk.every(function(t){return itemToks.has(t);}) && (!best||m.tkLen>best.tkLen)) best=m;
  }
  return best;
}

// ══════════ ファイル読み込み → 解析 ══════════
var parsed={};       // shop → [items(finalized+matched)]
var mktFilter={ng:[],ok:[]};
function passFilter(name){ var n=String(name||'').toLowerCase();
  if(mktFilter.ng.length && mktFilter.ng.some(function(w){return n.indexOf(w)>=0;})) return mktFilter.ok.some(function(w){return n.indexOf(w)>=0;});
  return true; }

function jstToday(){ return new Date(Date.now()+9*3600*1000).toISOString().slice(0,10); }

async function handleFiles(fileList){
  var files=Array.prototype.filter.call(fileList,function(f){ return /\.html?$/i.test(f.name); });
  document.getElementById('pick-status').textContent=files.length+' 件のHTMLを読み込み中…';
  if(!files.length){ document.getElementById('pick-status').textContent='HTMLファイルが見つかりません'; return; }
  parsed={}; var unknown=[];
  for(var i=0;i<files.length;i++){
    var f=files[i]; var html='';
    try{ html=await f.text(); }catch(e){ unknown.push(f.name+'（読込失敗）'); continue; }
    var shop=detectShop(html);
    if(!shop){ unknown.push(f.name); continue; }
    var items=IMPORT_SHOPS[shop].parse(html);
    if(!parsed[shop]) parsed[shop]={items:[], seen:new Set(), files:0};
    parsed[shop].files++;
    items.forEach(function(it){ if(parsed[shop].seen.has(it.id))return; parsed[shop].seen.add(it.id); parsed[shop].items.push(it); });
  }
  // マスタ照合＋finalize
  await loadMasters();
  Object.keys(parsed).forEach(function(shop){
    parsed[shop].items.forEach(function(it){
      var fin=finalizeItem(it); Object.assign(it, fin);
      var m=masters.length?matchMaster(it.name):null;
      it.bottleId=m?m.bottleId:''; it.matched=!!m; it.matchedName=m?m.es:'';
      it.excluded=!passFilter(it.name);
    });
  });
  document.getElementById('pick-status').textContent=files.length+' 件を解析しました';
  renderPreview(unknown);
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function renderPreview(unknown){
  var host=document.getElementById('preview-body'); host.innerHTML='';
  var shops=Object.keys(parsed);
  if(!shops.length){ document.getElementById('preview-card').style.display='block'; host.innerHTML='<div class="dim">取り込める商品が見つかりませんでした。</div>'; }
  var totalWrite=0;
  shops.forEach(function(shop){
    var cfg=IMPORT_SHOPS[shop]; var items=parsed[shop].items;
    var keep=items.filter(function(x){return !x.excluded;});
    var priced=keep.filter(function(x){return x.price!=null;}).length;
    var matched=keep.filter(function(x){return x.matched;}).length;
    var excluded=items.length-keep.length;
    totalWrite+=keep.length;
    var cur=({USD:'$',EUR:'€',GBP:'£',JPY:'¥'})[cfg.currency]||cfg.currency+' ';
    var sample=keep.slice(0,6).map(function(x){
      return '<tr><td>'+esc(x.name)+(x.classGuess?' <span class="dim">'+esc(x.classGuess)+'</span>':'')+'</td>'
        +'<td class="mono">'+(x.price!=null?cur+x.price.toLocaleString():'—')+'</td>'
        +'<td class="mono">'+(x.price750!=null?cur+x.price750.toLocaleString():'—')+'</td>'
        +'<td>'+(x.matched?'<span class="badge teal" title="'+esc(x.matchedName)+'">🥃道場</span>':'<span class="dim">—</span>')+'</td></tr>';
    }).join('');
    var div=document.createElement('div'); div.style.marginBottom='14px';
    div.innerHTML='<div class="shop-hd"><span class="nm">'+esc(cfg.name)+'</span>'
      +'<span class="badge">'+parsed[shop].files+'ファイル</span>'
      +'<span class="badge">取込 '+keep.length+'件</span>'
      +'<span class="badge">価格 '+priced+'</span>'
      +'<span class="badge teal">道場マッチ '+matched+'</span>'
      +(excluded?'<span class="badge" style="background:#f3d9d3;color:#b03020">NG除外 '+excluded+'</span>':'')+'</div>'
      +'<table><thead><tr><th>銘柄</th><th class="mono">価格</th><th class="mono">750ml換算</th><th>道場</th></tr></thead>'
      +'<tbody>'+sample+'</tbody></table>'
      +(keep.length>6?'<div class="dim" style="font-size:11px;margin-top:4px">…ほか '+(keep.length-6)+'件</div>':'');
    host.appendChild(div);
  });
  document.getElementById('preview-card').style.display='block';
  var uf=document.getElementById('unknown-files');
  uf.innerHTML=unknown.length?('⚠️ 未判定（対応店として認識できず）: '+unknown.map(esc).join('、')):'';
  document.getElementById('exec-card').style.display=shops.length?'block':'none';
  document.getElementById('btn-import').disabled=totalWrite===0;
}

document.getElementById('pick-dir').addEventListener('change',function(e){ handleFiles(e.target.files); });
document.getElementById('pick-files').addEventListener('change',function(e){ handleFiles(e.target.files); });

// ══════════ 取込実行（marketIntl / marketIntlHistory へ書込） ══════════
function logLine(s){ var el=document.getElementById('log'); el.textContent+=s+'\n'; el.scrollTop=el.scrollHeight; }
async function commitChunked(ops){ for(var i=0;i<ops.length;i+=400){ var b=db.batch(); ops.slice(i,i+400).forEach(function(o){ b.set(o.ref,o.data,{merge:true}); }); await b.commit(); } }

document.getElementById('btn-import').addEventListener('click',async function(){
  var btn=this; btn.disabled=true; document.getElementById('log').textContent='';
  var withHist=document.getElementById('opt-history').checked;
  var day=document.getElementById('opt-date').value||jstToday();
  try{
    var ops=[], total=0, matchedTotal=0;
    Object.keys(parsed).forEach(function(shop){
      var cfg=IMPORT_SHOPS[shop];
      parsed[shop].items.filter(function(x){return !x.excluded;}).forEach(function(it){
        var ref=db.collection('marketIntl').doc(shop+'__'+it.id);
        ops.push({ref:ref, data:{
          shop:shop, shopName:cfg.name, country:cfg.country||'', currency:cfg.currency||'USD',
          name:it.name||'', brandGuess:it.brandGuess||'', classGuess:it.classGuess||'',
          price:(it.price!=null?it.price:null), price750:(it.price750!=null?it.price750:null),
          volumeMl:(it.volumeMl!=null?it.volumeMl:null), abv:(it.abv!=null?it.abv:null),
          availability:it.availability||'', url:it.url||'',
          bottleId:it.bottleId||'', matched:!!it.matched, matchedName:it.matchedName||'',
          source:'import-html', updatedAt:FV.serverTimestamp()
        }});
        if(withHist && it.price750!=null){
          var href=db.collection('marketIntlHistory').doc(shop+'__'+it.id); var h={};
          h[day]={p:it.price750, s:/在庫あり|in ?stock|available|true/i.test(String(it.availability||''))?1:0};
          ops.push({ref:href, data:{ shop:shop, shopName:cfg.name, name:it.name||'', bottleId:it.bottleId||'',
            currency:cfg.currency||'USD', itemKey:shop+'__'+it.id, hist:h }});
        }
        total++; if(it.matched) matchedTotal++;
      });
    });
    logLine('書込 '+ops.length+' 操作（商品 '+total+'件 / 道場マッチ '+matchedTotal+'）'+(withHist?(' / 履歴日 '+day):' / 履歴なし'));
    await commitChunked(ops);
    logLine('✓ 取込完了。admin_tequila の「海外相場 / 海外比較」で確認できます。');
    btn.textContent='取込完了';
  }catch(e){ logLine('✗ 失敗: '+(e.message||e)); btn.disabled=false; }
});

// 初期化
document.getElementById('opt-date').value=jstToday();
AuthRole.requireOwner(auth, function(user){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('hdr-user').textContent=user.email||'';
  db.doc('settings/marketFilter').get().then(function(fd){
    if(fd.exists){ var d=fd.data()||{};
      mktFilter.ng=(d.ng||[]).map(function(s){return String(s).toLowerCase().trim();}).filter(Boolean);
      mktFilter.ok=(d.ok||[]).map(function(s){return String(s).toLowerCase().trim();}).filter(Boolean);
    }
  }).catch(function(){});
}, function(){
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('app').style.display='none';
});
</script>
</body>
</html>
